<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: telefon uchun bitta tor ustun, pastda tab-bar. Ranglar: Registon koshinlari (lojuvard + feruza), mukofotlar uchun za’faron. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --surface-2:#F7F8FC; --ink:#151E38; --muted:#5B6683; --line:#DDE2EE;
  --lapis:#2342A3; --lapis-soft:#E6EBFA; --on-lapis:#FFFFFF;
  --turq:#0F8279; --turq-soft:#DCF2EF;
  --saffron:#B8740F; --saffron-soft:#FBEFD9;
  --bad:#C0392F; --bad-soft:#FBE5E2; --good:#1A7F45; --good-soft:#DFF2E6;
  --g-m:#2F5BD8; --g-f:#C23A6B; --g-n:#2A8A4A; --g-pl:#8A5A12;
  --shadow:0 1px 2px rgba(21,30,56,.06),0 4px 16px rgba(21,30,56,.06);
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1222; --surface:#161D33; --surface-2:#1B2340; --ink:#E6EBF7; --muted:#9AA5C3; --line:#2A3456;
  --lapis:#8EA6FF; --lapis-soft:#22305E; --on-lapis:#0D1222;
  --turq:#45CFC3; --turq-soft:#123D3B;
  --saffron:#F2B54C; --saffron-soft:#3D2E12;
  --bad:#FF8A80; --bad-soft:#41201F; --good:#6DDC98; --good-soft:#163723;
  --g-m:#8FB0FF; --g-f:#FF8DB4; --g-n:#7EDB9C; --g-pl:#E8B865;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1222; --surface:#161D33; --surface-2:#1B2340; --ink:#E6EBF7; --muted:#9AA5C3; --line:#2A3456;
  --lapis:#8EA6FF; --lapis-soft:#22305E; --on-lapis:#0D1222;
  --turq:#45CFC3; --turq-soft:#123D3B;
  --saffron:#F2B54C; --saffron-soft:#3D2E12;
  --bad:#FF8A80; --bad-soft:#41201F; --good:#6DDC98; --good-soft:#163723;
  --g-m:#8FB0FF; --g-f:#FF8DB4; --g-n:#7EDB9C; --g-pl:#E8B865;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--lapis)}
:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
.tile-strip{height:8px;background:
  linear-gradient(135deg,var(--lapis) 25%,transparent 25%) 0 0/16px 16px,
  linear-gradient(225deg,var(--turq) 25%,transparent 25%) 0 0/16px 16px,
  linear-gradient(45deg,var(--turq) 25%,transparent 25%) 0 0/16px 16px,
  linear-gradient(315deg,var(--lapis) 25%,var(--lapis-soft) 25%) 0 0/16px 16px}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 6px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand svg{width:30px;height:30px;color:var(--lapis)}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.02em;display:block;text-align:left}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700;text-align:left;white-space:nowrap}
.langs{display:flex;gap:6px}
.lang{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:800}
.lang[aria-pressed="true"]{background:var(--lapis);border-color:var(--lapis);color:var(--on-lapis)}
.lang.soon{color:var(--muted);border-style:dashed}

/* bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,calc(50% - 320px)) calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;font-weight:800;color:var(--muted);border-radius:10px;position:relative}
.tabbar svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--lapis);background:var(--lapis-soft)}
.tabbar .cnt{position:absolute;top:2px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-block:10px 0}
.stat{background:var(--surface);border-radius:14px;padding:10px;box-shadow:var(--shadow);min-width:0}
.stat .v{font-family:var(--f-display);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.stat .v svg{width:16px;height:16px;flex:none}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.25}
.stat.streak .v{color:var(--saffron)} .stat.xp .v{color:var(--lapis)} .stat.lvl .v{color:var(--turq)} .stat.words .v{color:var(--good)}
.goal{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);margin-top:8px}
.goal .gbar{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.goal .gbar i{display:block;height:100%;background:var(--saffron);border-radius:8px}
.goal b{font-size:13px;white-space:nowrap}
.goal span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.freeze{font-size:12.5px;color:var(--muted);margin-top:6px}

.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-block:26px 10px}
.section-h h2{font-size:15px;font-weight:700}
.section-h span{font-size:13px;color:var(--muted)}

/* today plan */
.today{background:var(--lapis);color:var(--on-lapis);border-radius:18px;padding:16px;margin-top:14px;display:grid;gap:10px}
.today h2{font-size:16px}
.today .sub{font-size:13.5px;opacity:.9;margin:0}
.todo{display:grid;gap:6px}
.todo button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.14);color:inherit;font-weight:700;font-size:14.5px}
:root[data-theme="dark"] .todo button{background:rgba(13,18,34,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .todo button{background:rgba(13,18,34,.18)}}
.todo button .ck{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;flex:none;display:grid;place-items:center;font-size:13px}
.todo button.done{opacity:.7}
.todo button.done .ck{background:currentColor}
.todo button.done .ck::after{content:"";width:8px;height:4px;border-left:2.5px solid var(--lapis);border-bottom:2.5px solid var(--lapis);transform:rotate(-45deg) translate(1px,-1px)}
.todo button small{display:block;font-weight:600;opacity:.85;font-size:12.5px}
.todo button span{min-width:0}

/* level road */
.road{position:relative;display:grid;gap:0;padding-left:4px}
.lvl-h{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.lvl-h .tag{font-family:var(--f-display);font-weight:700;font-size:14px;background:var(--turq);color:var(--surface);border-radius:10px;padding:4px 10px}
.lvl-h.locked .tag{background:var(--line);color:var(--muted)}
.lvl-h b{font-size:14px}
.lvl-h span{font-size:12.5px;color:var(--muted);display:block;font-weight:600}
.stop{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;position:relative;padding:6px 0;background:none;border:0;text-align:left;width:100%}
.stop::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:3px;background:var(--line)}
.stop:first-of-type::before{top:50%}
.stop.last::before{bottom:50%}
.stop .dot{position:relative;z-index:1;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--surface);border:2.5px solid var(--line);color:var(--muted)}
.stop.done .dot{background:var(--good);border-color:var(--good);color:var(--surface)}
.stop.next .dot{background:var(--lapis);border-color:var(--lapis);color:var(--on-lapis);box-shadow:0 0 0 5px var(--lapis-soft)}
.stop.part .dot{border-color:var(--turq);color:var(--turq)}
.stop.exam .dot{border-radius:50%;border-color:var(--saffron);color:var(--saffron)}
.stop.exam.done .dot{background:var(--saffron);color:var(--surface)}
.stop .card{background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.stop.next .card{outline:2px solid var(--lapis)}
.stop h3{font-size:14px;font-weight:700}
.stop .ru{font-size:12.5px;color:var(--muted)}
.stop .meta{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:12px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.stop .chev{width:18px;height:18px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;width:70px}
.bar i{display:block;height:100%;background:var(--turq)}
.locked-box{background:var(--surface-2);border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--muted)}
.locked-box b{color:var(--ink)}
.pill{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--saffron-soft);color:var(--saffron);border-color:transparent}

.cardbox{background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.cardbox h3{font-size:15px;margin-bottom:4px}
.cardbox p{margin:0 0 8px;font-size:14px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:12px 14px;border:1px solid var(--line)}

/* lesson */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font-weight:800;font-size:14px;padding:8px 0 0}
.back svg{width:18px;height:18px}
.thead{margin-block:6px 12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--turq);font-weight:800}
.thead h1{font-size:23px;font-weight:700;margin-top:2px}
.thead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.cando{display:grid;gap:4px;margin:10px 0 0;padding:0;list-style:none;font-size:13.5px}
.cando li{display:flex;gap:8px;align-items:flex-start}
.cando li::before{content:"";flex:none;width:16px;height:16px;margin-top:3px;border-radius:50%;background:var(--turq-soft);box-shadow:inset 0 0 0 4px var(--turq-soft),inset 0 0 0 8px var(--turq)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:var(--surface);padding:4px;border-radius:14px;box-shadow:var(--shadow);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs.t3{grid-template-columns:repeat(3,1fr)}
.tab{border:0;background:none;border-radius:10px;padding:8px 2px;font-size:12px;font-weight:800;color:var(--muted);min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px}
.tab i{font-style:normal;font-size:10px;line-height:1;color:var(--good)}
.tab[aria-selected="true"]{background:var(--lapis-soft);color:var(--lapis)}
.panel{margin-top:16px}

/* gender */
.g-m{color:var(--g-m)} .g-f{color:var(--g-f)} .g-n{color:var(--g-n)} .g-pl{color:var(--g-pl)}
.gtag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;border:1.5px solid currentColor;vertical-align:middle;font-family:var(--f-body);letter-spacing:0}

/* flashcards */
.deckinfo{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:10px;font-variant-numeric:tabular-nums;gap:8px;flex-wrap:wrap}
.fc{perspective:1200px;height:340px;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:10px;border:1.5px solid var(--line);overflow:auto}
.fc-face.back{transform:rotateY(180deg);background:var(--surface-2)}
.fc-word{font-family:var(--f-display);font-size:clamp(24px,7vw,34px);font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.fc-tr{font-size:14px;color:var(--muted);font-weight:700}
.fc-uz{font-size:clamp(20px,6vw,26px);font-weight:800;color:var(--turq)}
.fc-ex{font-size:15.5px;font-weight:700}
.fc-ex i{display:block;color:var(--muted);font-style:normal;font-size:14px;font-weight:500;margin-top:2px}
.fc-hint{font-size:12px;color:var(--muted);font-weight:700}
.box-dots{display:flex;gap:4px}
.box-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.box-dots i.on{background:var(--turq)}
.spk{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 14px;background:var(--lapis-soft);color:var(--lapis);font-weight:800;font-size:14px;text-decoration:none}
.spk svg{width:18px;height:18px;flex:none}
.spk.sm{padding:6px 10px;font-size:12.5px}
.spk.alt{background:var(--turq-soft);color:var(--turq)}
.spk.playing{outline:2px solid var(--turq)}
.spkrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.btn{border:0;border-radius:14px;padding:13px 12px;font-weight:800;font-size:15px;background:var(--surface);box-shadow:var(--shadow);text-decoration:none;color:inherit;display:inline-block;text-align:center}
.btn.primary{background:var(--lapis);color:var(--on-lapis)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.mid{background:var(--saffron-soft);color:var(--saffron)}
.btn.good{background:var(--good-soft);color:var(--good)}
.btn.ghost{background:transparent;box-shadow:none;border:1.5px solid var(--line)}
.btn.wide{width:100%;margin-top:12px}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn small{display:block;font-size:11px;font-weight:700;opacity:.85}
.btn:disabled{opacity:.45;cursor:default}
.empty{text-align:center;background:var(--surface);border-radius:20px;padding:28px 20px;box-shadow:var(--shadow)}
.empty h3{font-size:18px;margin-bottom:6px}
.empty p{color:var(--muted);margin:0 0 6px}

/* questions */
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:800;margin-bottom:8px;font-variant-numeric:tabular-nums}
.qprog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.qprog i{display:block;height:100%;background:var(--lapis);transition:width .3s}
.qcard{background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.qkind{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--turq)}
.qtext{font-size:19px;font-weight:800;margin:6px 0 14px;overflow-wrap:anywhere}
.qtext small{display:block;font-size:14px;color:var(--muted);font-weight:600;margin-top:4px}
.qtext .big{font-family:var(--f-display);font-size:28px;font-weight:700}
.opts{display:grid;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;font-weight:700;font-size:15.5px;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--lapis)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.tin{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:18px;font-weight:700;background:var(--surface-2)}
.tin:focus{border-color:var(--lapis);outline:none}
.tin.right{border-color:var(--good);background:var(--good-soft)} .tin.wrong{border-color:var(--bad);background:var(--bad-soft)}
.built{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;margin-bottom:12px}
.built.right{border-color:var(--good);border-style:solid} .built.wrong{border-color:var(--bad);border-style:solid}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.tok{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;font-weight:700;font-size:15.5px;box-shadow:0 1px 0 var(--line)}
.tok.used{visibility:hidden}
.built .tok{background:var(--lapis-soft);border-color:transparent;color:var(--lapis)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:grid;gap:8px;align-content:start;min-width:0}
.mt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:700;font-size:14.5px;text-align:left;min-height:46px;overflow-wrap:anywhere}
.mt.sel{border-color:var(--lapis);background:var(--lapis-soft)}
.mt.done{border-color:transparent;background:var(--good-soft);color:var(--good);opacity:.7}
.mt.err{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:14.5px}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)} .fb.mid{background:var(--saffron-soft)}
.fb b{display:block} .fb.good b{color:var(--good)} .fb.bad b{color:var(--bad)} .fb.mid b{color:var(--saffron)}
.fb i{font-style:normal;display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.result{text-align:center;background:var(--surface);border-radius:20px;padding:26px 20px;box-shadow:var(--shadow)}
.result .big{font-family:var(--f-display);font-size:46px;font-weight:700;color:var(--lapis);font-variant-numeric:tabular-nums}
.result p{color:var(--muted);margin:4px 0}

/* cyrillic keyboard */
.kbtoggle{margin-top:8px}
.kb{margin-top:10px;display:grid;gap:5px;user-select:none}
.kb .r{display:flex;gap:4px;justify-content:center}
.kb button{flex:1;max-width:44px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 0;font-weight:700;font-size:15px;box-shadow:0 1px 0 var(--line)}
.kb button.w{max-width:none;flex:2;font-size:12.5px}
.kb button:active{background:var(--lapis-soft)}

/* grammar */
.gram{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.gram h3{font-size:18px;margin-bottom:8px}
.gram p{margin:0 0 12px;max-width:65ch}
.gram h4{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--turq);margin:20px 0 8px;font-family:var(--f-body);font-weight:800}
.cmp-wrap{overflow-x:auto}
.cmp{width:100%;border-collapse:collapse;font-size:14.5px}
.cmp th{text-align:left;font-size:12px;color:var(--muted);font-weight:800;padding:6px 8px;border-bottom:1.5px solid var(--line)}
.cmp td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}

.cmp td button{border:0;background:none;color:var(--lapis);padding:0 0 0 4px;vertical-align:-4px}

mark{background:var(--saffron-soft);color:var(--saffron);font-weight:800;border-radius:4px;padding:0 3px}

.mi{border-radius:12px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line)}

.mi .ok{color:var(--good);font-weight:800}
.mi .why{font-size:13.5px;color:var(--muted);margin-top:3px}
.tip{background:var(--turq-soft);border-radius:12px;padding:12px 14px;font-size:14.5px;margin-top:14px}
.tip b{color:var(--turq)}

/* dialogue */
.dlg-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:inherit}
.chip svg{width:16px;height:16px}
.chip[aria-pressed="true"]{border-color:var(--turq);color:var(--turq);background:var(--turq-soft)}
.scene{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.lines{display:flex;flex-direction:column;gap:10px}
.line{max-width:88%;display:flex;flex-direction:column;gap:3px;min-width:0}
.line.b{align-self:flex-end;align-items:flex-end}
.line .who{font-size:12px;font-weight:800;color:var(--muted)}
.bubble{background:var(--surface);border-radius:16px 16px 16px 4px;padding:10px 12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start}
.line.b .bubble{background:var(--lapis-soft);border-radius:16px 16px 4px 16px}
.bubble .t{font-weight:700;min-width:0}
.bubble .tr{display:block;font-weight:500;font-size:14px;color:var(--muted);margin-top:2px}
.bubble button{border:0;background:none;color:var(--lapis);padding:2px;flex:none}
.bubble button svg{width:20px;height:20px}
.line.playing .bubble{outline:2px solid var(--turq)}
.live{margin-top:18px}
.live .row a{font-size:13.5px}

/* homework */
.hw{display:grid;gap:8px}
.hwi{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:0;border-radius:16px;padding:12px 14px;text-align:left;box-shadow:var(--shadow);width:100%}
.hwi .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--turq-soft);color:var(--turq)}
.hwi .ic svg{width:20px;height:20px}
.hwi.done .ic{background:var(--good-soft);color:var(--good)}
.hwi b{display:block;font-size:14.5px}
.hwi span{font-size:12.5px;color:var(--muted);display:block;line-height:1.35}
.talkq{display:grid;gap:8px;counter-reset:q}
.talkq li{list-style:none;background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.talkq li b{display:block}
.talkq li span{font-size:13.5px;color:var(--muted)}
.talkq{padding:0;margin:0}
.rec{display:grid;gap:10px}
.rec .row{justify-content:center}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* leaderboard */
.lb{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.lb li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.lb li.me{outline:2px solid var(--lapis)}
.lb .pos{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--surface-2);color:var(--muted)}
.lb li:nth-child(1) .pos{background:var(--saffron);color:var(--surface)}
.lb li:nth-child(2) .pos{background:var(--turq-soft);color:var(--turq)}
.lb li:nth-child(3) .pos{background:var(--lapis-soft);color:var(--lapis)}
.lb .nm{min-width:0}
.lb .nm b{display:block;overflow-wrap:anywhere}
.lb .nm small{font-size:12px;color:var(--muted);display:flex;gap:5px;align-items:center}
.lb .vl{font-family:var(--f-display);font-weight:700;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.lb .vl small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--lapis);color:var(--lapis);background:var(--lapis-soft)}

/* dictionary */
.search{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px;width:100%;min-width:0}
.dtools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
.dtools select{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:700;font-size:14px;max-width:170px}
.dict-wrap{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin-top:12px;overflow-x:auto}
.dict{width:100%;border-collapse:collapse;font-size:14.5px}
.dict th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:1.5px solid var(--line)}
.dict td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.dict td.w{font-weight:800}
.dict td.w small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.dict td.w button{border:0;background:none;color:var(--lapis);padding:0 4px 0 0;vertical-align:-4px}
.dict td.w button svg{width:18px;height:18px}

/* alphabet */
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}

.letter .w{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.letter.false{border-color:var(--saffron)}
.letter.false .s{color:var(--saffron)}
.letter.sign .s{color:var(--muted)}
.lt-detail{margin-top:12px}

  linear-gradient(135deg,var(--lapis) 25%,transparent 25%) 0 0/16px 16px,
  linear-gradient(225deg,var(--turq) 25%,transparent 25%) 0 0/16px 16px,
  linear-gradient(45deg,var(--turq) 25%,transparent 25%) 0 0/16px 16px,

.cert::before{top:0} .cert::after{bottom:0}
.cert .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.cert h2{font-size:26px;margin:10px 0 4px;color:var(--lapis)}
.cert .name{font-family:var(--f-display);font-size:22px;margin:12px 0}
.cert .lv{font-family:var(--f-display);font-size:54px;color:var(--saffron);line-height:1}
.cert p{color:var(--muted);margin:6px 0;font-size:14px}

/* profile */
.field{display:grid;gap:6px;margin-top:10px}
.field label{font-size:13px;font-weight:800;color:var(--muted)}
.field input,.field textarea,.field select{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:15px;width:100%}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:700}
.switch:last-child{border-bottom:0}
.switch input{width:22px;height:22px;accent-color:var(--lapis);flex:none}
.prose{font-size:14.5px}
.prose p,.prose li{max-width:65ch}
.prose h3{font-size:16px;margin:18px 0 6px}
.prose ul,.prose ol{padding-left:20px;margin:6px 0}
.cefr{width:100%;border-collapse:collapse;font-size:13.5px}
.cefr td,.cefr th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cefr th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

.toasts{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:50;padding-inline:16px}
.toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;font-weight:800;font-size:14px;box-shadow:var(--shadow);max-width:440px;animation:tin .25s ease-out}
.toast.gold{background:var(--saffron);color:#1A1204}
.toast.small{font-size:12.5px;font-weight:700;padding:7px 12px;opacity:.92}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.fc-inner,.qprog i{transition:none}.toast,.recdot{animation:none}}
@media (max-width:400px){.stat .v{font-size:16px}.stat{padding:9px 8px}.tab{font-size:11px}.stats{gap:6px}}

grammar:{title:"Rus tilida so‘zlarning jinsi bor: мой, моя, моё, мои",
intro:"O‘zbek tilida «mening» so‘zi o‘zgarmaydi: mening akam, mening opam. Rus tilida esa har bir ot <b>erkak</b>, <b>ayol</b> yoki <b>o‘rta</b> jinsda bo‘ladi va «mening» shunga moslashadi. Jinsni so‘z oxiridan bilish oson:<br>• undosh bilan tugasa: <b>erkak</b> jinsi → <b>мой</b> брат, мой дом<br>• <b>-а / -я</b> bilan tugasa: <b>ayol</b> jinsi → <b>моя</b> сестра, моя семья<br>• <b>-о / -е</b> bilan tugasa: <b>o‘rta</b> jins → <b>моё</b> имя, моё фото<br>• ko‘plik → <b>мои</b> дети",
table:[["mening akam","<mark>мой</mark> брат"],["mening opam","<mark>моя</mark> сестра"],["mening ismim","<mark>моё</mark> имя"],["mening ota-onam","<mark>мои</mark> родители"],["mening dadam (!)","<mark>мой</mark> папа"]],
tip:"<b>Istisno:</b> папа, дедушка, дядя -а/-я bilan tugaydi, lekin ular erkaklar, shuning uchun <b>мой папа, мой дедушка, мой дядя</b>. <br><b>Aka yoki uka?</b> Ruslar ikkalasini ham <b>брат</b> deydi. Aniqlashtirish kerak bo‘lsa: старший брат (aka), младший брат (uka).",
mistakes:[["моя брат","мой брат","брат erkak jinsida."],["мой мама","моя мама","мама -а bilan tugaydi, ayol jinsi."],["моя папа","мой папа","Istisno: papa erkak."],["Я 25 лет.","Мне 25 лет.","Yosh «мне» bilan aytiladi: «menga 25 yil»."]]},

<script>
/* Ovoz: avval odamlarning jonli yozuvlari, topilmasa sintez ovoz.
   1) So‘zlar: Wikimedia Commons (Vikilug‘at yozuvlari "Ru-so‘z.ogg") va Lingua Libre ("LL-Q7737 (rus)-...").
   2) Gaplar: Tatoeba (faqat ochiq litsenziyali yozuvlar).
   3) Hech narsa topilmasa: brauzerning eng tabiiy rus ovozi. */
window.TIL = window.TIL || {};
TIL.audio = (function(){
  const COMMONS = "https://commons.wikimedia.org/w/api.php";
  const CACHE_KEY = "til.audio.v1";
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}"); } catch(e) {}
  const saveCache = () => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch(e) {} };
  let offline = { commons:false, tatoeba:false };
  let cur = null;          // hozir o‘ynayotgan Audio
  let settings = { live:true, slow:false };

  const plain = s => String(s).replace(/́/g,"").replace(/'/g,"").trim();
  const keyOf = (lang,s) => lang + ":" + plain(s).toLowerCase();

  function withTimeout(p, ms){
    return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")), ms))]);
  }
  async function getJSON(url, ms){
    const r = await withTimeout(fetch(url, {mode:"cors"}), ms || 4000);
    if (!r.ok) throw new Error("http " + r.status);
    return r.json();
  }

  const canOgg = (()=>{ try { return !!document.createElement("audio").canPlayType('audio/ogg; codecs="vorbis"'); } catch(e){ return false; } })();

  function pickFromInfo(info){
    if (!info) return null;
    const ders = info.derivatives || [];
    const mp3 = ders.find(d => /audio\/mpeg/.test(d.type||""));
    if (mp3) return mp3.src;
    if (/\.(ogg|oga)$/i.test(info.url||"") && !canOgg) return (ders.find(d=>/audio/.test(d.type||""))||{}).src || null;
    return info.url || null;
  }

  /* Bir nechta so‘zni bitta so‘rov bilan tekshirish (dars ochilganda) */
  async function prefetchWords(lang, words){
    if (!settings.live || offline.commons || lang !== "ru") return;
    const todo = [];
    words.forEach(w => {
      const p = plain(w).toLowerCase();
      if (!p || /[\s?!.,]/.test(p)) return;
      if (cache[keyOf(lang,p)] !== undefined) return;
      todo.push(p);
    });
    for (let i=0; i<todo.length; i+=40){
      const chunk = todo.slice(i, i+40);
      const titles = chunk.map(w => "File:Ru-" + w + ".ogg").join("|");
      const url = COMMONS + "?action=query&format=json&origin=*&prop=videoinfo&viprop=url|derivatives&titles=" + encodeURIComponent(titles);
      try {
        const j = await getJSON(url, 6000);
        const norm = {};
        ((j.query||{}).normalized||[]).forEach(n => norm[n.to] = n.from);
        const pages = (j.query||{}).pages || {};
        const found = {};
        Object.values(pages).forEach(pg => {
          if (pg.missing !== undefined || !pg.videoinfo) return;
          const src = pickFromInfo(pg.videoinfo[0]);
          if (!src) return;
          const t = (norm[pg.title] || pg.title).replace(/^File:Ru-/,"").replace(/\.ogg$/,"").replace(/_/g," ").toLowerCase();
          found[t] = { src, by:"Wikimedia Commons", lic:"ochiq litsenziya", link:"https://commons.wikimedia.org/wiki/" + encodeURIComponent(pg.title.replace(/ /g,"_")) };
        });
        chunk.forEach(w => { cache[keyOf(lang,w)] = found[w] || (cache[keyOf(lang,w)] === undefined ? null : cache[keyOf(lang,w)]); });
        saveCache();
      } catch(e){ offline.commons = true; return; }
    }
  }

  async function lookupLinguaLibre(w){
    const q = 'intitle:"LL-Q7737 (rus)" intitle:"' + w + '"';
    const url = COMMONS + "?action=query&format=json&origin=*&list=search&srnamespace=6&srlimit=20&srsearch=" + encodeURIComponent(q);
    const j = await getJSON(url, 5000);
    const hits = ((j.query||{}).search||[]).map(h=>h.title).filter(t => t.toLowerCase().endsWith("-" + w.toLowerCase() + ".wav"));
    if (!hits.length) return null;
    const title = hits[0];
    const j2 = await getJSON(COMMONS + "?action=query&format=json&origin=*&prop=imageinfo&iiprop=url&titles=" + encodeURIComponent(title), 5000);
    const pg = Object.values((j2.query||{}).pages||{})[0];
    const u = pg && pg.imageinfo && pg.imageinfo[0] && pg.imageinfo[0].url;
    if (!u) return null;
    const m = title.match(/\(rus\)-(.+?)-/);
    return { src:u, by:"Lingua Libre" + (m ? " · " + m[1] : ""), lic:"CC BY-SA 4.0", link:"https://commons.wikimedia.org/wiki/" + encodeURIComponent(title.replace(/ /g,"_")) };
  }

  async function lookupTatoeba(text){
    const q = plain(text);
    const url = "https://tatoeba.org/en/api_v0/search?from=rus&orphans=no&unapproved=no&has_audio=yes&query=" + encodeURIComponent('"' + q + '"');
    const j = await getJSON(url, 5000);
    const norm = s => plain(s).toLowerCase().replace(/[«»"“”.,!?—–-]/g,"").replace(/\s+/g," ").trim();
    const want = norm(q);
    for (const r of (j.results||[])){
      if (norm(r.text) !== want) continue;
      const au = (r.audios||[]).find(a => a.license && /^CC/i.test(a.license));
      if (au) return { src:"https://tatoeba.org/audio/download/" + au.id, by:"Tatoeba · " + (au.author||""), lic:au.license, link:"https://tatoeba.org/ru/sentences/show/" + r.id };
    }
    return null;
  }

  async function resolve(lang, text){
    if (!settings.live || lang !== "ru") return null;
    const k = keyOf(lang, text);
    if (cache[k]) return cache[k];
    const p = plain(text).replace(/[«»"“”]/g,"");
    const isWord = !/\s/.test(p) && p.length < 30;
    if (isWord){
      const w = p.toLowerCase().replace(/[?!.,]/g,"");
      if (cache[k] === undefined) { await prefetchWords(lang, [w]); if (cache[k]) return cache[k]; }
      if (!offline.commons && cache[k + "#ll"] === undefined){
        try { const res = await lookupLinguaLibre(w); cache[k + "#ll"] = res ? 1 : 0; if (res) cache[k] = res; saveCache(); }
        catch(e){ offline.commons = true; }
      }
    } else if (!offline.tatoeba && cache[k + "#tt"] === undefined){
      try { const res = await lookupTatoeba(p); cache[k + "#tt"] = res ? 1 : 0; if (res) cache[k] = res; saveCache(); }
      catch(e){ offline.tatoeba = true; }
    }
    return cache[k] || null;
  }

  /* --- sintez ovoz --- */
  let voices = [];
  function loadVoices(){ try { voices = speechSynthesis.getVoices(); } catch(e){ voices = []; } }
  if ("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  function bestVoice(langTag){
    const base = langTag.slice(0,2);
    const list = voices.filter(v => (v.lang||"").toLowerCase().startsWith(base));
    const score = v => (/natural|neural|online/i.test(v.name) ? 40 : 0) + (/google/i.test(v.name) ? 20 : 0) + (/milena|yuri|katya|svetlana|dmitry|dariya/i.test(v.name) ? 15 : 0) + (v.localService ? 0 : 5);
    return list.sort((a,b)=>score(b)-score(a))[0] || null;
  }
  function tts(text, langTag){
    return new Promise(res => {
      if (!("speechSynthesis" in window)) return res(false);
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(plain(text));
        u.lang = langTag; const v = bestVoice(langTag); if (v) u.voice = v;
        u.rate = settings.slow ? 0.7 : 0.9;
        u.onend = () => res(true); u.onerror = () => res(false);
        speechSynthesis.speak(u);
      } catch(e){ res(false); }
    });
  }

  function stop(){
    try { if (cur){ cur.pause(); cur = null; } } catch(e){}
    try { speechSynthesis.cancel(); } catch(e){}
  }

  function playSrc(src){
    return new Promise((res, rej) => {
      const a = new Audio(src); cur = a;
      a.playbackRate = settings.slow ? 0.8 : 1;
      a.onended = () => res(true);
      a.onerror = () => rej(new Error("audio"));
      const p = a.play(); if (p && p.catch) p.catch(rej);
    });
  }

  /* say(): matnni o‘qiydi; onSource(info) qaysi manbadan ekanini aytadi */
  async function say(text, opts){
    opts = opts || {};
    const lang = opts.lang || "ru", tag = opts.tag || "ru-RU";
    stop();
    let info = null;
    try { info = await withTimeout(resolve(lang, text), 7000); } catch(e){ info = null; }
    if (info && info.src){
      try { opts.onSource && opts.onSource(info); await playSrc(info.src); return info; }
      catch(e){ /* sintezga o‘tamiz */ }
    }
    const s = { by:"Sintez ovoz (jonli yozuv topilmadi)", synth:true };
    opts.onSource && opts.onSource(s);
    await tts(text, tag);
    return s;
  }

  return { say, stop, prefetchWords, plain, setSettings: s => Object.assign(settings, s), status: () => ({...offline}) };
})();

</script>

/* Guruh rejimi: Supabase orqali kirish (ism + PIN), umumiy reyting va duellar.

window.TIL = window.TIL || {};
TIL.cloud = (function(){
  const CFG = window.TIL_CONFIG || {};
  const URL_ = (CFG.supabaseUrl || "").replace(/\/+$/, "");
  const KEY = CFG.supabaseKey || "";

  const SKEY = "til.session.v1";
  const DOMAIN = CFG.emailDomain || "til.example";
  let session = null;
  try { session = JSON.parse(localStorage.getItem(SKEY) || "null"); } catch(e){}
  const saveSession = () => { try { session ? localStorage.setItem(SKEY, JSON.stringify(session)) : localStorage.removeItem(SKEY); } catch(e){} };

  const slug = name => String(name).trim().toLowerCase().replace(/[‘’'`ʻʼ]/g, "").replace(/[^a-z0-9]+/g, "");
  const emailOf = name => slug(name) + "@" + DOMAIN;

  async function auth(grant, body){
    const r = await fetch(URL_ + "/auth/v1/token?grant_type=" + grant, { method:"POST", headers:{ apikey:KEY, "Content-Type":"application/json" }, body:JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.error_description || j.msg || j.message || ("HTTP " + r.status)); e.status = r.status; throw e; }
    session = { access_token:j.access_token, refresh_token:j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, user:{ id:j.user.id, email:j.user.email } };
    saveSession();
    return session;
  }
  async function login(name, pin){
    if (!slug(name)) throw new Error("Ismni kiriting");
    return auth("password", { email: emailOf(name), password: String(pin).trim() });
  }
  function logout(){ session = null; saveSession(); }
  async function token(){
    if (!session) throw new Error("not logged in");
    if (Date.now() > session.expires_at - 60000){
      try { await auth("refresh_token", { refresh_token: session.refresh_token }); }
      catch(e){ if (e.status === 400 || e.status === 401) { logout(); } throw e; }
    }
    return session.access_token;
  }
  async function rest(path, opts){
    opts = opts || {};
    const t = await token();
    const r = await fetch(URL_ + "/rest/v1/" + path, { method: opts.method || "GET",
      headers: Object.assign({ apikey:KEY, Authorization:"Bearer " + t, "Content-Type":"application/json" }, opts.headers || {}),
      body: opts.body ? JSON.stringify(opts.body) : undefined });
    if (!r.ok){ const j = await r.json().catch(() => ({})); throw new Error(j.message || ("HTTP " + r.status)); }
    if (r.status === 204) return null;
    const txt = await r.text(); return txt ? JSON.parse(txt) : null;
  }

  return {
    configured, slug,
    user: () => session && session.user,
    login, logout,
    myProfile: () => rest("profiles?select=*&id=eq." + session.user.id).then(a => a && a[0] || null),

    duels: () => rest("duels?select=*&order=created_at.desc&limit=30"),

    createDuel: d => rest("duels", { method:"POST", headers:{ Prefer:"return=representation" }, body: d }).then(a => a[0]),
    submitResult: r => rest("duel_results", { method:"POST", headers:{ Prefer:"return=minimal" }, body: r })
  };
})();

const known = () => ALL_WORDS.filter(w => (S.cards[w.id]||{}).box >= 3).length;
const learning = () => ALL_WORDS.filter(w => { const c = S.cards[w.id]; return c && c.box > 0 && c.box < 3; }).length;
const dueCards = () => ALL_WORDS.filter(w => { const c = S.cards[w.id]; return c && c.seen && c.due <= todayStr(); });

/* ---------- dars holati ---------- */
const PARTS = ["cards","grammar","dialog","practice","hwOK"];
const HW_PARTS = ["review","dict","trans","build","speak"];
function lessonPct(l){ const st = S.lessons[l.id] || {}; return Math.round(PARTS.filter(p => st[p]).length / PARTS.length * 100); }
function hwDone(l){ const h = (S.lessons[l.id]||{}).hw || {}; return HW_PARTS.every(p => h[p]); }
function markPart(l, part){
  const st = LS(l.id);
  if (st[part]) return;
  st[part] = true; save();
  if (part === "practice") addXP(20);
  if (PARTS.every(p => st[p])) { addXP(50); toast("«" + l.title + "» darsi tugadi! +50 XP", "gold"); }
}
function alphaDone(){ return !!(S.alpha.read && S.alpha.write); }
function nextStop(){
  if (!alphaDone()) return "alpha";
  const l = C.lessons.find(l => lessonPct(l) < 100);
  if (l) return l.id;
  if (!(S.exams.A1||{}).passed) return "examA1";
  return null;
}
const doneLessons = () => C.lessons.filter(l => lessonPct(l) === 100).length;

/* ---------- toast ---------- */
function toast(msg, cls){
  const t = document.createElement("div"); t.className = "toast " + (cls||""); t.textContent = msg;
  $("#toasts").appendChild(t); setTimeout(() => t.remove(), cls === "small" ? 2600 : 3200);
}

/* ---------- ovoz ---------- */
let lastSrcToast = "";
function speak(text, btn){
  if (btn) btn.classList.add("playing");
  return TIL.audio.say(text, { onSource: info => {
    const msg = info.synth ? "Sintez ovoz" : "Jonli ovoz: " + info.by;
    if (msg !== lastSrcToast) { toast(msg, "small"); lastSrcToast = msg; setTimeout(()=> lastSrcToast = "", 8000); }
  }}).finally(() => btn && btn.classList.remove("playing"));
}
const yg = phrase => "https://youglish.com/pronounce/" + encodeURIComponent(plain(phrase)) + "/russian";
const spkBtn = (text, label, cls) => `<button class="spk ${cls||""}" data-say="${esc(text)}">${I.play}${label ? "<span>" + label + "</span>" : ""}</button>`;
document.addEventListener("click", e => {
  const b = e.target.closest("[data-say]");
  if (b){ e.stopPropagation(); speak(b.dataset.say, b); }
}, true);

/* ---------- genderni ko‘rsatish ---------- */
const GN = { m:"erkak", f:"ayol", n:"o‘rta", pl:"ko‘plik" };
const gTag = g => g ? `<span class="gtag g-${g}" title="${GN[g]} jinsi">${{m:"m",f:"f",n:"n",pl:"ko‘p"}[g]}</span>` : "";
const wordHTML = w => `<span class="${w.g ? "g-" + w.g : ""}">${esc(w.ru)}</span>`;

/* ---------- guruh: natijalarni bulutga yuborish ---------- */
let pushT = null, guest = false;
try { guest = localStorage.getItem("til.guest") === "1"; } catch(e){}
function weekXP(wk){ let s = 0; for (let i=0;i<7;i++) s += S.days[addDays(wk, i)] || 0; return s; }
const loginName = () => { const u = CL.user(); if (!u) return ""; const n = u.email.split("@")[0]; return n[0].toUpperCase() + n.slice(1); };
function statsRow(){
  const wk = weekKey(), t = todayStr();
  return { name: S.name || loginName(), xp:S.xp, week_xp:weekXP(wk), last_week_xp:weekXP(addDays(wk, -7)), week_key:wk, today_xp:S.days[t] || 0, day:t,
    streak:streak().n, words:known(), lessons:doneLessons(), a1_passed:!!(S.exams.A1||{}).passed, weekly_score:(S.weekly[wk]||{}).score ?? null, last_seen:new Date().toISOString(), state:S };
}
function schedulePush(){ if (!CL.configured || !CL.user()) return; clearTimeout(pushT); pushT = setTimeout(pushNow, 3000); }
async function pushNow(){ clearTimeout(pushT); if (!CL.configured || !CL.user()) return; try { await CL.upsertProfile(statsRow()); } catch(e){ /* internet yo‘q: keyingi safar yuboriladi */ } }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") pushNow(); });
async function afterLogin(typed){
  KEY = "til.state." + CL.user().id;
  let cloud = null;
  try { const p = await CL.myProfile(); if (p && p.state) cloud = Object.assign(fresh(), p.state); } catch(e){}
  const cands = [cloud, loadLocal(KEY)].filter(Boolean);
  if (!cands.length){ const g = loadLocal("til.state.v1"); if (g) cands.push(g); }
  S = cands.sort((a, b) => b.xp - a.xp)[0] || fresh();
  if (!S.name) S.name = typed.trim();
  S.settings = Object.assign(fresh().settings, S.settings || {}); TIL.audio.setSettings(S.settings);
  try { localStorage.removeItem("til.guest"); } catch(e){} guest = false;
  save(); await pushNow();
}

/* ===================== NAVIGATSIYA ===================== */
let route = { v:"home" };
const history_ = [];
function go(r, push){ if (push !== false) history_.push(route); route = r; TIL.audio.stop(); render(); window.scrollTo(0,0); }
function back(){ route = history_.pop() || { v:"home" }; TIL.audio.stop(); render(); window.scrollTo(0,0); }

function renderNav(){
  const due = dueCards().length;
  const items = [["home","Yo‘l",I.road],["review","Takrorlash",I.cards,due],["rank","Reyting",I.trophy],["dict","Lug‘at",I.book],["profile","Profil",I.user]];
  $("#nav").hidden = route.v === "login";
  $("#nav").innerHTML = items.map(([v, label, ic, cnt]) =>
    `<button data-nav="${v}" ${(route.v === v || (v==="home" && !["review","dict","profile","rank","duel"].includes(route.v)) || (v==="rank" && route.v==="duel")) ? 'aria-current="page"' : ""}>${ic}${label}${cnt ? `<span class="cnt">${cnt > 99 ? "99+" : cnt}</span>` : ""}</button>`).join("");
  $$("#nav button").forEach(b => b.onclick = () => { history_.length = 0; go({ v:b.dataset.nav }, false); });
  $("#langs").innerHTML = Object.values(COURSES).map(c => `<button class="lang ${c.soon ? "soon" : ""}" aria-pressed="${c.id === "ru"}" data-lang="${c.id}" title="${c.name}">${c.short}</button>`).join("");
  $$("#langs button").forEach(b => b.onclick = () => {
    const c = COURSES[b.dataset.lang];
    if (c.soon) toast(c.name + " rus kursidan keyin qo‘shiladi.");
  });
}
$("#brand").onclick = () => { history_.length = 0; go({ v:"home" }, false); };

function render(){
  renderNav();
  const v = route.v;
  if (v === "home") return viewHome();
  if (v === "lesson") return viewLesson();
  if (v === "alpha") return viewAlpha();
  if (v === "review") return viewReview();
  if (v === "dict") return viewDict();
  if (v === "profile") return viewProfile();
  if (v === "exam") return viewExamIntro();
  if (v === "weekly") return viewWeeklyIntro();
  if (v === "cert") return viewCert();
  if (v === "guide") return viewGuide();
  if (v === "login") return viewLogin();
  if (v === "rank") return viewRank();
  if (v === "duel") return viewDuel();
}
const backBtn = (label) => `<button class="back" id="backBtn">${I.back}${label || "Orqaga"}</button>`;
const bindBack = () => { const b = $("#backBtn"); if (b) b.onclick = back; };

/* ===================== BOSH SAHIFA: YO‘L XARITASI ===================== */
function viewHome(){
  const st = streak(), t = todayStr(), todayXP = S.days[t] || 0;
  const k = known(), dl = doneLessons(), nx = nextStop();
  const nxL = nx && LESSON[nx];
  const remain = C.lessons.length - dl + ((S.exams.A1||{}).passed ? 0 : 1);
  const due = dueCards().length;
  const wk = S.weekly[weekKey()];

  /* Bugungi reja */
  const todo = [];
  if (nx === "alpha") todo.push({ t:"Rus alifbosini o‘rganing", s:"33 harf, o‘qish va yozish mashqi", go:{v:"alpha"}, done:false });
  else if (nxL) {
    const stp = S.lessons[nxL.id] || {};
    const nextPart = PARTS.find(p => !stp[p]);
    const PN = { cards:"So‘z kartochkalari", grammar:"Grammatika", dialog:"Dialog", practice:"Mashq (80% dan yuqori)", hwOK:"Uy vazifasi" };
    todo.push({ t:`${nxL.n}-dars: ${nxL.title}`, s:"Keyingi qadam: " + PN[nextPart], go:{ v:"lesson", id:nxL.id, tab: nextPart === "hwOK" ? "hw" : nextPart }, done:false });
  } else if (nx === "examA1") todo.push({ t:"A1 imtihonini topshiring", s:"30 savol, o‘tish bali 80%", go:{v:"exam"}, done:false });
  todo.push({ t: due ? `${due} ta so‘zni takrorlang` : "Takrorlash", s: due ? "Unutmaslik uchun aynan bugun" : "Bugun takrorlanadigan so‘z yo‘q", go:{v:"review"}, done: !due && Object.keys(S.cards).length > 0 });
  if (dl > 0 || Object.keys(S.lessons).length) todo.push({ t:"Haftalik nazorat", s: wk ? `Bu hafta: ${wk.score}%` : "Haftada bir marta, 15 savol", go:{v:"weekly"}, done: !!wk });

  const road = [];
  road.push(stopHTML({ id:"alpha", n:"А", title:"Alifbo", ru:"Кириллица · 33 harf", pct: (S.alpha.read?50:0) + (S.alpha.write?50:0), next: nx === "alpha" }));
  C.lessons.forEach(l => road.push(stopHTML({ id:l.id, n:l.n, title:l.title, ru:l.ruTitle, pct:lessonPct(l), next: nx === l.id, words:l.W.length })));
  const ex = S.exams.A1 || {};
  road.push(stopHTML({ id:"examA1", n:"A1", title:"A1 imtihoni va sertifikat", ru: ex.best ? `Eng yaxshi natija: ${ex.best}%` : "30 savol · o‘tish bali 80%", pct: ex.passed ? 100 : 0, next: nx === "examA1", exam:true, last:true }));

  app.innerHTML = `
  <section class="stats" aria-label="Natijalar">
    <div class="stat streak"><div class="v">${I.fire}${st.n}</div><div class="l">kun ketma-ket</div></div>
    <div class="stat xp"><div class="v">${I.star}${S.xp}</div><div class="l">XP</div></div>
    <div class="stat words"><div class="v">${k}</div><div class="l">so‘zni bilasiz</div></div>
    <div class="stat lvl"><div class="v">${dl}/${C.lessons.length}</div><div class="l">dars (A1)</div></div>
  </section>
  <div class="goal"><b>Bugun</b><div class="gbar"><i style="width:${Math.min(100, todayXP / S.goal * 100)}%"></i></div><span>${todayXP} / ${S.goal} XP</span></div>
  <div class="freeze">Seriyani saqlash: haftada bir kun o‘tkazib yuborsangiz ham seriya uzilmaydi. Bu hafta ${freezeLeft() ? "1 ta muzlatish bor" : "muzlatish ishlatildi"}.</div>

  <section class="today">
    <h2>${S.name ? esc(S.name) + ", bugungi reja" : "Bugungi reja"}</h2>
    <p class="sub">${remain > 0 ? `A2 darajasigacha <b>${remain}</b> qadam qoldi.` : "A1 darajasi yakunlandi! A2 kursi tayyorlanmoqda."} Kuniga 30–60 daqiqa yetarli.</p>
    <div class="todo">${todo.map((x,i) => `<button data-todo="${i}" class="${x.done ? "done" : ""}"><span class="ck"></span><span><b>${esc(x.t)}</b><small>${esc(x.s)}</small></span></button>`).join("")}</div>
  </section>

  <div class="section-h"><h2>Yo‘l xaritasi</h2><span>${k} / ${ALL_WORDS.length} so‘z</span></div>
  <div class="lvl-h"><span class="tag">A1</span><div><b>${LEVELS[0].name}</b><span>${LEVELS[0].desc}</span></div></div>
  <div class="road">${road.join("")}</div>
  ${LEVELS.slice(1).map(L => `
    <div class="lvl-h locked"><span class="tag">${L.id}</span><div><b>${L.name}</b><span>${L.desc} ${L.words}.</span></div></div>
    <div class="locked-box"><b>${L.lessons} dars · tayyorlanmoqda.</b> A1 imtihonidan o‘tgach ochiladi.</div>`).join("")}
  <p class="note" style="margin-top:22px">Taraqqiyotingiz faqat shu brauzerda saqlanadi. Boshqa telefonga o‘tmoqchi bo‘lsangiz, Profil bo‘limida «Taraqqiyotni ko‘chirish» kodidan foydalaning.</p>`;

  $$("[data-todo]").forEach(b => b.onclick = () => go(todo[+b.dataset.todo].go));
  $$("[data-stop]").forEach(b => b.onclick = () => {
    const id = b.dataset.stop;
    if (id === "alpha") go({ v:"alpha" });
    else if (id === "examA1") go({ v:"exam" });
    else go({ v:"lesson", id });
  });
}
function stopHTML(o){
  const cls = ["stop", o.pct >= 100 ? "done" : "", o.next ? "next" : "", o.pct > 0 && o.pct < 100 ? "part" : "", o.exam ? "exam" : "", o.last ? "last" : ""].join(" ");
  return `<button class="${cls}" data-stop="${o.id}">
    <span class="dot">${o.pct >= 100 && !o.exam ? "✓" : o.n}</span>
    <span class="card"><h3>${esc(o.title)}</h3><span class="ru">${o.ru}</span>
      <span class="meta">${o.pct >= 100 ? '<span class="pill ok">Tugadi</span>' : o.next ? '<span class="pill warn">Keyingi</span>' : ""}${!o.exam ? `<span class="bar"><i style="width:${o.pct}%"></i></span><span>${o.pct}%</span>` : ""}${o.words ? `<span>${o.words} so‘z</span>` : ""}</span>
    </span>
    <span class="chev">${I.chev}</span></button>`;
}

function viewAlpha(){
  const tab = route.tab || "letters";
  app.innerHTML = `${backBtn("Yo‘l xaritasi")}
  <div class="thead"><div class="eyebrow">Birinchi qadam</div><h1>Rus alifbosi</h1><p>Кириллица</p></div>
  <div class="tabs t3" role="tablist">
    ${[["letters","Harflar"],["read","O‘qish",S.alpha.read],["write","Yozish",S.alpha.write]].map(([k,l,d]) => `<button class="tab" role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}${d ? "<i>✓</i>" : ""}</button>`).join("")}
  </div><div class="panel" id="panel"></div>`;
  bindBack();
  $$("[data-tab]").forEach(b => b.onclick = () => { route.tab = b.dataset.tab; viewAlpha(); });
  const P = $("#panel");
  if (tab === "letters"){
    P.innerHTML = `<p class="note">${C.alphabet.intro}</p>
      <div class="legend"><span><span class="kdot k"></span>tanish</span><span><span class="kdot l"></span>aldamchi: ko‘rinishi tanish, o‘qilishi boshqa</span></div>
      <div class="letters" style="margin-top:12px">${ALPHA.map((a,i) => `<button class="letter ${a.type}" data-l="${i}"><div class="L">${a.L}</div><div class="s">${esc(a.lat)}</div><div class="w">${a.ex}</div></button>`).join("")}</div>
      <div id="ltd" class="lt-detail"></div>
      <button class="btn primary wide" id="toRead">O‘qish mashqini boshlash</button>`;
    $$("[data-l]").forEach(b => b.onclick = () => {
      const a = ALPHA[+b.dataset.l];
      $("#ltd").innerHTML = `<div class="cardbox"><h3>${a.L} — «${esc(a.lat)}»</h3><p>${a.note ? esc(a.note) : "O‘zbekchadagi kabi o‘qiladi."}</p>
        <div class="row"><b style="font-size:20px">${a.ex}</b><span class="fc-tr">[${translit(a.ex)}]</span><span>— ${esc(a.exUz)}</span>${spkBtn(a.ex, "Tinglash", "sm")}</div></div>`;
      $("#ltd").scrollIntoView({ block:"nearest", behavior:"smooth" });
      speak(a.ex);
    });
    $("#toRead").onclick = () => { route.tab = "read"; viewAlpha(); };
  }
  if (tab === "read"){
    const pool = READING.concat(ALPHA.map(a => ({ ru:a.ex, uz:a.exUz })));
    const qs = sample(pool, 12).map(it => {
      const right = translit(it.ru);
      const opts = [right]; let guard = 0;
      while (opts.length < 4 && guard++ < 50){ const o = translit(sample(pool,1)[0].ru); if (!opts.includes(o)) opts.push(o); }
      return { kind:"choice", label:"Qanday o‘qiladi?", prompt:`<span class="big">${it.ru}</span><small>${esc(it.uz)}</small>`, audioAfter: it.ru, options: opts, answer: right };
    });
    runQuiz(P, { questions: qs, onFinish: (sc, n) => { const p = Math.round(sc/n*100); if (p >= 80 && !S.alpha.read){ S.alpha.read = true; save(); addXP(15); } return p >= 80 ? "O‘qish mashqi bajarildi!" : "80% kerak. Yana bir bor urinib ko‘ring."; }, retry: () => viewAlpha() });
  }
  if (tab === "write"){
    const pool = READING.filter(r => plain(r.ru).length <= 8);
    const qs = sample(pool, 8).map(it => ({ kind:"type", label:"Kirillda yozing", prompt:`<span class="big">${esc(translit(it.ru))}</span><small>${esc(it.uz)}</small>`, audio: it.ru, answer: it.ru }));
    P.innerHTML = `<p class="note">Telefoningizda rus klaviaturasi bo‘lmasa, pastdagi «Klaviatura» tugmasini bosing. Uni o‘rnatish ham foydali: Sozlamalar → Til va klaviatura → Русский.</p><div id="q"></div>`;
    runQuiz($("#q"), { questions: qs, onFinish: (sc, n) => { const p = Math.round(sc/n*100); if (p >= 80 && !S.alpha.write){ S.alpha.write = true; save(); addXP(15); } return p >= 80 ? "Yozish mashqi bajarildi!" : "80% kerak. Yana bir bor urinib ko‘ring."; }, retry: () => viewAlpha() });
  }
}

function bindNext(P){ $$("[data-next]", P).forEach(b => b.onclick = () => { route.tab = b.dataset.next; viewLesson(); window.scrollTo(0,0); }); }

/* --- kartochkalar --- */
function flashDeck(P, words, opts){
  let i = 0, flipped = false;
  const draw = () => {
    if (i >= words.length){ P.innerHTML = `<div class="empty"><h3>Barakalla!</h3><p>${words.length} ta kartochka ko‘rildi.</p>${opts.doneHTML || ""}</div>`; opts.onDone && opts.onDone(P); return; }
    const w = words[i], c = S.cards[w.id] || { box:0 };
    P.innerHTML = `<div class="deckinfo"><span>${i+1} / ${words.length}</span><span>${opts.info || "Kartochkani bosing: tarjimasi chiqadi"}</span></div>
    <div class="fc ${flipped ? "flipped" : ""}" id="fc" tabindex="0" role="button" aria-label="Kartochkani aylantirish">
      <div class="fc-inner">
        <div class="fc-face">
          <div class="box-dots" title="Bilish darajasi">${[1,2,3,4,5,6].map(n => `<i class="${c.box >= n ? "on" : ""}"></i>`).join("")}</div>
          <div class="fc-word">${wordHTML(w)} ${gTag(w.g)}</div>
          ${S.settings.translit ? `<div class="fc-tr">[${esc(translit(w.ru))}]</div>` : ""}
          <div class="spkrow">${spkBtn(w.ru, "Tinglash")}</div>
          <div class="fc-hint">Ma’nosini eslang, keyin bosing</div>
        </div>
        <div class="fc-face back">
          <div class="fc-uz">${esc(w.uz)}</div>
          <div class="fc-word" style="font-size:20px">${wordHTML(w)}</div>
          ${w.ex ? `<div class="fc-ex">${esc(w.ex)}<i>${esc(w.exUz)}</i></div>` : ""}
          <div class="spkrow">${w.ex ? spkBtn(w.ex, "Misol", "sm") : ""}<a class="spk sm alt" href="${yg(w.plain)}" target="_blank" rel="noopener">${I.video}Videoda</a></div>
        </div>
      </div></div>
    <div class="grade">
      <button class="btn bad" data-g="0">Bilmayman<small>yana ko‘rsat</small></button>
      <button class="btn mid" data-g="1">Qiynaldim<small>ertaga</small></button>
      <button class="btn good" data-g="2">Bilaman<small>keyinroq</small></button>
    </div>`;
    const fc = $("#fc");
    const flip = () => { flipped = !flipped; fc.classList.toggle("flipped", flipped); };
    fc.onclick = e => { if (!e.target.closest("button,a")) flip(); };
    fc.onkeydown = e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); } };
    if (!flipped && opts.autoplay !== false) speak(w.ru);
    $$("[data-g]").forEach(b => b.onclick = () => {
      const g = +b.dataset.g;
      grade(w.id, g > 0, g === 1); addXP(1);
      if (g === 0) words.push(w);
      i++; flipped = false; draw();
    });
  };
  draw();
}
function lessonCards(P, l){
  P.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="fc-tr">${l.W.length} ta so‘z · rang = jins: <span class="g-m">erkak</span>, <span class="g-f">ayol</span>, <span class="g-n">o‘rta</span></span><button class="chip" id="listBtn">${I.book}Ro‘yxat</button></div><div id="deck"></div>`;
  $("#listBtn").onclick = () => {
    $("#deck").innerHTML = `<div class="dict-wrap"><table class="dict"><tbody>${l.W.map(w => `<tr><td class="w"><button data-say="${esc(w.ru)}" aria-label="Tinglash">${I.play}</button>${wordHTML(w)} ${gTag(w.g)}<small>${esc(translit(w.ru))}</small></td><td>${esc(w.uz)}</td></tr>`).join("")}</tbody></table></div>${nextTab(l, "cards")}`;

/* --- savol generatorlari --- */
function distract(w, field, n, pool){
  const out = new Set([w[field]]);
  const cands = shuffle((pool || ALL_WORDS).filter(x => x[field] !== w[field] && x.id !== w.id));
  for (const x of cands){ if (out.size > n) break; out.add(x[field]); }
  return [...out];
}
function qVocab(w, type, pool){
  if (type === "gender" && !w.g) type = "ru2uz";
  pool = pool && pool.length >= 6 ? pool : ALL_WORDS;
  if (type === "ru2uz") return { kind:"choice", word:w.id, label:"Tarjimasini toping", prompt:`<span class="big">${wordHTML(w)}</span>`, audio:w.ru, options:distract(w,"uz",3,pool), answer:w.uz };
  if (type === "uz2ru") return { kind:"choice", word:w.id, label:"Ruschasini toping", prompt:esc(w.uz), options:distract(w,"ru",3,pool), answer:w.ru, audioAfter:w.ru };
  if (type === "listen") return { kind:"choice", word:w.id, label:"Tinglang va toping", prompt:`<span class="fc-tr">Tugmani bosib tinglang</span>`, audio:w.ru, autoplay:true, options:distract(w,"uz",3,pool), answer:w.uz };
  if (type === "type" && (w.plain.includes("...") || w.plain.length > 16)) type = "uz2ru";
  if (type === "type") return { kind:"type", word:w.id, label:"Ruscha yozing", prompt:esc(w.uz), answer:w.ru, audioAfter:w.ru };
  if (type === "gender"){
    const ans = { m:"мой", f:"моя", n:"моё", pl:"мои" }[w.g];
    return { kind:"choice", word:w.id, label:"«Mening» qaysi shakli?", prompt:`___ <span class="big" style="font-size:24px">${esc(w.ru)}</span><small>${esc(w.uz)}</small>`, options:["мой","моя","моё","мои"], keepOrder:true, answer:ans, explain: GN[w.g] + " jinsi" };
  }
}
const nouns = ws => ws.filter(w => /^(m|f|n|pl)$/.test(w.g) && !/\s/.test(w.plain));
const grammarQs = (l, n) => sample(l.test, n || l.test.length).map(t => ({ kind:"choice", label:"Grammatika", prompt:esc(t.q), options:t.o, answer:t.o[0], explain:t.e }));
function sentencePool(l){
  const ex = l.W.filter(w => w.ex && w.ex.split(" ").length >= 2 && w.ex.split(" ").length <= 8 && !w.ex.includes("—")).map(w => ({ ru:w.ex, uz:w.exUz }));
  const dl = l.D.filter(d => d.ru.split(" ").length <= 9).map(d => ({ ru:d.ru, uz:d.uz }));
  return { ex, dl };
}

function lessonPractice(P, l){
  const st = LS(l.id);
  const W = shuffle(l.W);
  const qs = [];
  W.slice(0,3).forEach(w => qs.push(qVocab(w, "ru2uz", l.W)));
  W.slice(3,5).forEach(w => qs.push(qVocab(w, "uz2ru", l.W)));

  }
  const finish = () => {

    if (HW_PARTS.every(p => st.hw[p]) && !st.hwOK){ markPart(l, "hwOK"); toast("Uy vazifasi to‘liq bajarildi!", "gold"); }

  const backHW = () => { route.hw = null; viewLesson(); };

    const earlier = C.lessons.slice(0, idx).flatMap(x => x.W).filter(w => S.cards[w.id]).sort((a,b) => (S.cards[a.id].box - S.cards[b.id].box) || (S.cards[a.id].due < S.cards[b.id].due ? -1 : 1)).slice(0, 5);
    const words = shuffle(sample(l.W, 10 - earlier.length).concat(earlier));
    const types = ["ru2uz","uz2ru","listen","type"];
    const qs = words.map((w, i) => qVocab(w, w.plain.length > 14 && types[i%4] === "type" ? "uz2ru" : types[i%4], l.W));
    runQuiz(Q, { questions: qs, onFinish: done, retry: () => viewLesson(), after: backHW });
  }
  if (part === "dict"){
    const qs = sample(ex.concat(dl).filter(s => s.ru.split(" ").length <= 6), 4).map(s => ({ kind:"type", label:"Diktant", prompt:`<span class="fc-tr">Tinglang va yozing. Kerak bo‘lsa, bir necha marta tinglang.</span>`, audio:s.ru, autoplay:true, answer:s.ru, explain:s.uz, sentence:true }));
    runQuiz(Q, { questions: qs, onFinish: done, retry: () => viewLesson(), after: backHW });
  }
  if (part === "trans"){
    const qs = sample(ex.filter(s => s.ru.split(" ").length <= 6), 4).map(s => ({ kind:"type", label:"Ruschaga tarjima qiling", prompt:esc(s.uz), answer:s.ru, audioAfter:s.ru, sentence:true, selfCheck:true }));
    runQuiz(Q, { questions: qs, onFinish: done, retry: () => viewLesson(), after: backHW });
  }
  if (part === "build"){
    const qs = sample(dl.concat(ex).filter(s => s.ru.split(" ").length >= 3), 4).map(s => ({ kind:"build", label:"Gap tuzing", prompt:esc(s.uz), answer:s.ru, audioAfter:s.ru }));
    runQuiz(Q, { questions: qs, onFinish: done, retry: () => viewLesson(), after: backHW });
  }
  if (part === "speak") speakPractice(Q, sample(l.D, 3).map(d => d.ru), () => { finish(); backHW(); });
}

        ${url ? `<button class="spk alt" id="mine">${I.play}<span>Mening ovozim</span></button>` : ""}</div>
      ${!canRec ? `<p class="fc-tr">Bu brauzerda ovoz yozib bo‘lmaydi. Asl ovozni tinglab, ovoz chiqarib 3 marta takrorlang.</p>` : ""}
      <p class="fc-tr" id="recMsg"></p>
      <div class="grade" style="grid-template-columns:1fr 1fr"><button class="btn mid" id="again">Yana urinaman</button><button class="btn good" id="next">O‘xshadi, keyingisi</button></div>
    </div>`;
    if (state !== "rec" && !url) speak(s);
    const sr = $("#startRec"), sp = $("#stopRec");
    if (sr) sr.onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
        chunks = []; rec = new MediaRecorder(stream);
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = () => { stream.getTracks().forEach(t => t.stop()); if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || "audio/webm" })); draw("done"); new Audio(url).play().catch(()=>{}); };
        rec.start(); draw("rec");
      } catch(e){ $("#recMsg").textContent = "Mikrofonga ruxsat berilmadi. Ovoz chiqarib takrorlang va o‘zingiz baholang."; }
    };
    if (sp) sp.onclick = () => rec && rec.state !== "inactive" && rec.stop();
    const m = $("#mine"); if (m) m.onclick = () => new Audio(url).play().catch(()=>{});
    $("#again").onclick = () => { url = null; draw(); };
    $("#next").onclick = () => { addXP(3); i++; url = null; draw(); };
  };
  draw();
}

let kbOpen = false;
const KB_ROWS = ["йцукенгшщзхъ","фывапролджэ","ячсмитьбю"];
function keyboardHTML(){
  return `<button class="chip kbtoggle" id="kbT" aria-pressed="${kbOpen}">⌨ Klaviatura</button>
  <div class="kb" id="kb" ${kbOpen ? "" : "hidden"}>${KB_ROWS.map(r => `<div class="r">${[...r].map(ch => `<button type="button" data-k="${ch}">${ch}</button>`).join("")}</div>`).join("")}
  <div class="r"><button type="button" class="w" data-k="ё">ё</button><button type="button" class="w" data-k=" ">bo‘sh joy</button><button type="button" class="w" data-k="⌫">⌫ o‘chirish</button></div></div>`;
}
function bindKeyboard(input){
  const T = $("#kbT"); if (!T) return;
  T.onclick = () => { kbOpen = !kbOpen; $("#kb").hidden = !kbOpen; T.setAttribute("aria-pressed", kbOpen); };
  $$("#kb [data-k]").forEach(b => b.onclick = () => {
    const k = b.dataset.k; if (input.disabled) return;
    const s = input.selectionStart ?? input.value.length, e = input.selectionEnd ?? input.value.length;
    if (k === "⌫"){ if (s === e && s > 0) { input.value = input.value.slice(0, s-1) + input.value.slice(e); input.setSelectionRange(s-1, s-1); } else { input.value = input.value.slice(0, s) + input.value.slice(e); input.setSelectionRange(s, s); } }
    else { input.value = input.value.slice(0, s) + k + input.value.slice(e); input.setSelectionRange(s+1, s+1); }
  });
}

function runQuiz(root, cfg){
  const qs = cfg.questions.filter(Boolean);
  let i = 0, score = 0;
  const draw = () => {
    if (i >= qs.length){
      const p = Math.round(score / qs.length * 100);
      const msg = cfg.onFinish ? cfg.onFinish(score, qs.length) : "";
      const extra = cfg.extra ? cfg.extra()(p) : "";
      root.innerHTML = `<div class="result"><div class="big">${p}%</div><p>${score} / ${qs.length} to‘g‘ri</p><p><b>${esc(msg || "")}</b></p>
        <div class="row" style="justify-content:center;margin-top:12px">${cfg.after ? '<button class="btn primary" id="afterBtn">Davom etish</button>' : ""}<button class="btn ghost" id="retryBtn">Qayta boshlash</button></div></div>${extra}`;
      const rb = $("#retryBtn", root); if (rb) rb.onclick = cfg.retry || (() => { i = 0; score = 0; draw(); });
      const ab = $("#afterBtn", root); if (ab) ab.onclick = cfg.after;
      if (cfg.bindExtra) cfg.bindExtra(root);
      renderNav();
      return;
    }
    const q = qs[i];
    root.innerHTML = `<div class="qmeta"><span>${i+1} / ${qs.length}</span><span>${score} to‘g‘ri</span></div>
      <div class="qprog"><i style="width:${i / qs.length * 100}%"></i></div>
      <div class="qcard"><div class="qkind">${esc(q.label || "")}</div>
        <div class="qtext">${q.prompt || ""}</div>
        ${q.audio ? `<div class="row" style="margin:-4px 0 14px">${spkBtn(q.audio, "Tinglash", "sm")}${q.sentence ? spkBtn(q.audio, "Sekin", "sm alt slowone") : ""}</div>` : ""}
        <div id="body"></div><div id="fb"></div></div>`;
    $$(".slowone", root).forEach(b => b.addEventListener("click", e => { e.stopPropagation(); const prev = S.settings.slow; TIL.audio.setSettings({ slow:true }); speak(q.audio, b).finally(() => TIL.audio.setSettings({ slow:prev })); }, true));
    if (q.audio && q.autoplay) setTimeout(() => speak(q.audio), 150);
    const body = $("#body", root), fb = $("#fb", root);
    const next = (ok, half) => {
      if (ok) { score += 1; addXP(half ? 1 : 2); }
      if (q.word) grade(q.word, ok, !!half);
      const nb = document.createElement("button"); nb.className = "btn primary wide"; nb.textContent = i + 1 < qs.length ? "Davom etish" : "Natijani ko‘rish";
      nb.onclick = () => { i++; draw(); }; fb.appendChild(nb); nb.focus({ preventScroll:true });
      if (q.audioAfter) speak(q.audioAfter);
    };
    const feedback = (cls, title, body2) => { fb.innerHTML = `<div class="fb ${cls}"><b>${title}</b>${body2 ? `<i>${body2}</i>` : ""}</div>`; };

    if (q.kind === "choice"){
      const opts = q.keepOrder ? q.options : shuffle(q.options);
      body.innerHTML = `<div class="opts">${opts.map(o => `<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
      $$(".opt", body).forEach(b => b.onclick = () => {
        const ok = b.dataset.o === q.answer;
        $$(".opt", body).forEach(x => { x.disabled = true; if (x.dataset.o === q.answer) x.classList.add("right"); });
        if (!ok) b.classList.add("wrong");
        feedback(ok ? "good" : "bad", ok ? "To‘g‘ri!" : "Noto‘g‘ri. To‘g‘ri javob: " + esc(q.answer), q.explain ? esc(q.explain) : "");
        next(ok);
      });
    }
    if (q.kind === "type"){
      body.innerHTML = `<form id="tf" autocomplete="off"><input class="tin" id="tin" lang="ru" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Kirillda yozing…" aria-label="Javob">
        <button class="btn primary wide" type="submit">Tekshirish</button></form>${keyboardHTML()}`;
      const inp = $("#tin", body); bindKeyboard(inp);
      if (!kbOpen) setTimeout(() => inp.focus({ preventScroll:true }), 50);
      $("#tf", body).onsubmit = e => {
        e.preventDefault(); if (inp.disabled) return;
        const a = normRu(inp.value), b = normRu(q.answer);
        if (!a) return;
        inp.disabled = true; $("#tf button", body).remove();
        const d = lev(a, b), tol = b.length <= 6 ? 1 : Math.max(2, Math.round(b.length * 0.12));
        if (a === b){ inp.classList.add("right"); feedback("good", "To‘g‘ri!", esc(q.answer) + (q.explain ? " — " + esc(q.explain) : "")); next(true); }
        else if (d <= tol && /[а-я]/.test(a)){ inp.classList.add("right"); feedback("mid", "Deyarli to‘g‘ri! Imloga e’tibor bering:", esc(q.answer)); next(true, true); }
        else {
          inp.classList.add("wrong");
          feedback("bad", "To‘g‘ri javob: " + esc(q.answer), (/[a-z]/i.test(a) ? "Lotin harflarida yozdingiz. Kirill harflaridan foydalaning. " : "") + (q.explain ? esc(q.explain) : ""));
          if (q.selfCheck){
            const sb = document.createElement("button"); sb.className = "btn ghost sm"; sb.style.marginTop = "8px"; sb.textContent = "Mening javobim ham to‘g‘ri (boshqa so‘zlar bilan)";
            sb.onclick = () => { score += 1; addXP(1); sb.remove(); toast("Qabul qilindi. Javobni o‘zingiz tekshirdingiz."); };
            fb.appendChild(sb);
          }
          next(false);
        }
      };
    }
    if (q.kind === "build"){
      const toks = q.answer.split(" ");
      const bank = shuffle(toks.map((t, k) => ({ t, k })));
      const chosen = [];
      body.innerHTML = `<div class="built" id="built" aria-label="Siz tuzgan gap"></div><div class="bank" id="bank">${bank.map(b => `<button class="tok" data-k="${b.k}">${esc(b.t)}</button>`).join("")}</div><button class="btn primary wide" id="chk" disabled>Tekshirish</button>`;
      const built = $("#built", body), chk = $("#chk", body);
      const redraw = () => { built.innerHTML = chosen.map((c, j) => `<button class="tok" data-j="${j}">${esc(c.t)}</button>`).join(""); $$("#bank .tok", body).forEach(b => b.classList.toggle("used", chosen.some(c => c.k === +b.dataset.k))); chk.disabled = chosen.length !== toks.length;
        $$("[data-j]", built).forEach(b => b.onclick = () => { if (chk.dataset.done) return; chosen.splice(+b.dataset.j, 1); redraw(); }); };
      $$("#bank .tok", body).forEach(b => b.onclick = () => { if (chk.dataset.done || b.classList.contains("used")) return; chosen.push(bank.find(x => x.k === +b.dataset.k)); redraw(); });
      chk.onclick = () => {
        chk.dataset.done = 1; chk.remove();
        const ok = normRu(chosen.map(c => c.t).join(" ")) === normRu(q.answer);
        built.classList.add(ok ? "right" : "wrong");
        feedback(ok ? "good" : "bad", ok ? "To‘g‘ri!" : "To‘g‘ri tartib:", ok ? "" : esc(q.answer));
        next(ok);
      };
    }
    if (q.kind === "match"){
      const L = shuffle(q.pairs.map((p, k) => ({ t:p[0], k }))), R = shuffle(q.pairs.map((p, k) => ({ t:p[1], k })));
      let sel = null, errs = 0, left = q.pairs.length;
      body.innerHTML = `<div class="match"><div class="col">${L.map(x => `<button class="mt" data-side="L" data-k="${x.k}">${esc(x.t)}</button>`).join("")}</div><div class="col">${R.map(x => `<button class="mt" data-side="R" data-k="${x.k}">${esc(x.t)}</button>`).join("")}</div></div>`;
      $$(".mt", body).forEach(b => b.onclick = () => {
        if (b.classList.contains("done")) return;
        if (b.dataset.side === "L") speak(q.pairs[+b.dataset.k][0]);
        if (!sel || sel.dataset.side === b.dataset.side){ $$(".mt.sel", body).forEach(x => x.classList.remove("sel")); sel = b; b.classList.add("sel"); return; }
        if (sel.dataset.k === b.dataset.k){ [sel, b].forEach(x => { x.classList.remove("sel"); x.classList.add("done"); x.disabled = true; }); left--; sel = null;
          if (!left){ const ok = errs <= 1; feedback(ok ? "good" : "bad", ok ? "Hammasi to‘g‘ri!" : `Tugadi, lekin ${errs} ta xato bilan.`); next(ok); } }
        else { errs++; const a = sel, c = b; [a, c].forEach(x => x.classList.add("err")); setTimeout(() => [a, c].forEach(x => x.classList.remove("err","sel")), 500); sel = null; }
      });
    }
  };
  draw();
}

const BOARDS = [["week","Hafta","XP"],["words","So‘zlar","so‘z"],["streak","Seriya","kun"],["lessons","Darslar","dars"],["xp","Jami","XP"]];
let board = "week", rankCache = null;
function adjust(p){
  const wk = weekKey(), prev = addDays(wk, -7);
  const week = p.week_key === wk ? p.week_xp : 0;
  const last = p.week_key === wk ? p.last_week_xp : p.week_key === prev ? p.week_xp : 0;
  const today = p.day === todayStr() && p.today_xp > 0;
  const streakNow = (p.day === todayStr() || p.day === addDays(todayStr(), -1)) ? p.streak : 0;
  return Object.assign({}, p, { week, last, today, streakNow });
}
async function loadRank(){
  const [ps, ds] = await Promise.all([CL.profiles(), CL.duels()]);
  const rs = await CL.results(ds.map(d => d.id));
  rankCache = { ps: ps.map(adjust), ds, rs, at: Date.now() };
  return rankCache;
}

function drawRank(){

  const val = p => ({ week:p.week, words:p.words, streak:p.streakNow, lessons:p.lessons, xp:p.xp })[board];
  const rows = ps.slice().sort((a, b) => val(b) - val(a) || b.xp - a.xp);
  const unit = BOARDS.find(b => b[0] === board)[2];
  const champ = ps.slice().sort((a, b) => b.last - a.last)[0];
  const goal = Math.max(1, ps.length) * 350, sum = ps.reduce((a, p) => a + p.week, 0);

    else if (!th) status = `<span class="pill">Siz: ${my.score}/10 · raqib kutilmoqda</span>`;
    else { const win = my.score > th.score || (my.score === th.score && my.ms < th.ms); const draw = my.score === th.score && my.ms === th.ms;
      status = `<span class="pill ${draw ? "" : win ? "ok" : "warn"}">${my.score}:${th.score} · ${draw ? "durang" : win ? "g‘alaba" : "mag‘lubiyat"}</span>`; }

  };
  R.innerHTML = `
    ${champ && champ.last > 0 ? `<div class="today" style="margin-top:0"><h2>${I.trophy.replace("<svg", '<svg width="20" height="20" style="vertical-align:-4px"')} O‘tgan hafta g‘olibi: ${esc(champ.name)}</h2><p class="sub">${champ.last} XP. Bu hafta kim uni quvib o‘tadi?</p></div>` : ""}
    <div class="goal" style="margin-top:12px"><b>Guruh maqsadi</b><div class="gbar"><i style="width:${Math.min(100, sum / goal * 100)}%"></i></div><span>${sum} / ${goal} XP</span></div>
    <div class="freeze">Bu hafta hammamiz birga ${goal} XP to‘plashimiz kerak. Bugun ${todayN} / ${ps.length} kishi o‘qidi.</div>
    <div class="tabs" style="grid-template-columns:repeat(5,1fr);margin-top:14px;position:static" role="tablist">${BOARDS.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${board === k}" data-b="${k}">${l}</button>`).join("")}</div>

    <div class="section-h"><h2>Duellar</h2><span>10 savol, bir xil test</span></div>
    <div class="cardbox"><p>Do‘stingizni chaqiring: ikkalangizga bir xil 10 ta savol tushadi. Ko‘p to‘g‘ri javob bergan yutadi, teng bo‘lsa tezrog‘i.</p>
      <div class="row">${ps.filter(p => p.id !== me).map(p => `<button class="chip" data-vs="${p.id}">${I.swords}${esc(p.name)}</button>`).join("") || '<span class="fc-tr">Guruhda boshqa a’zo hali yo‘q.</span>'}</div>
      ${mine.length ? `<div style="margin-top:10px">${mine.map(duelRow).join("")}</div>` : ""}</div>
    <button class="btn ghost wide" id="refresh">Yangilash</button>`;
  $$("[data-b]").forEach(b => b.onclick = () => { board = b.dataset.b; drawRank(); });
  $("#refresh").onclick = () => viewRank();
  $$("[data-vs]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try {
      const ls = studied().map(l => l.id);
      const d = await CL.createDuel({ opponent: b.dataset.vs, seed: Math.floor(Math.random() * 2147483647), lessons: ls.length ? ls : [C.lessons[0].id] });

}
function seeded(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function duelQuestions(d){
  const R = Math.random; Math.random = seeded(d.seed);
  try {
    const ls = (d.lessons || []).map(id => LESSON[id]).filter(Boolean);
    const pool = (ls.length ? ls : [C.lessons[0]]).flatMap(l => l.W);
    return sample(pool, 10).map((w, i) => qVocab(w, ["ru2uz","uz2ru","listen","ru2uz","uz2ru"][i % 5], pool));
  } finally { Math.random = R; }
}
function viewDuel(){
  const d = route.d;
  const opp = rankCache && (rankCache.ps.find(p => p.id === (d.creator === CL.user().id ? d.opponent : d.creator)) || {}).name;
  app.innerHTML = `${backBtn("Reyting")}<div class="thead"><div class="eyebrow">Duel</div><h1>${opp ? "Siz va " + esc(opp) : "Duel"}</h1><p>10 savol. Vaqt ham hisoblanadi.</p></div><div id="q"></div>`;
  bindBack();
  const t0 = Date.now();
  runQuiz($("#q"), { questions: duelQuestions(d), onFinish: (sc) => {
    const ms = Date.now() - t0;
    CL.submitResult({ duel_id: d.id, score: sc, ms }).then(() => toast("Natija yuborildi")).catch(e => toast("Natija yuborilmadi: " + e.message));
    return `Vaqt: ${Math.round(ms / 1000)} soniya. Raqibingiz o‘ynagach, natija reytingda chiqadi.`;
  }, after: () => { history_.length = 0; go({ v:"rank" }, false); }, retry: () => toast("Duelni faqat bir marta o‘ynash mumkin.") });
}

/* ===================== PROFIL ===================== */

  <div class="cardbox">
    <label class="switch">Jonli ovozlarni qidirish (internet kerak)<input type="checkbox" id="s_live" ${S.settings.live ? "checked" : ""}></label>
    <label class="switch">Sekin talaffuz<input type="checkbox" id="s_slow" ${S.settings.slow ? "checked" : ""}></label>
    <label class="switch">Lotincha o‘qilishini ko‘rsatish<input type="checkbox" id="s_tr" ${S.settings.translit ? "checked" : ""}></label>

    <button class="hwi" id="toCert"><span class="ic">${I.star}</span><span><b>Sertifikat</b><span>${(S.exams.A1||{}).passed ? "A1 sertifikatingiz" : "A1 imtihonidan keyin"}</span></span>${I.chev.replace("<svg", '<svg width="18" height="18"')}</button>
  </div>
  <div class="section-h"><h2>Taraqqiyotni ko‘chirish</h2></div>
  <div class="cardbox"><p>Boshqa telefon yoki kompyuterga o‘tish uchun kodni nusxalang va u yerda «Kodni kiritish» qismiga qo‘ying.</p>
    <div class="row"><button class="btn sm" id="exp">Kodni olish</button><button class="btn sm ghost" id="imp">Kodni kiritish</button></div>
    <div class="field" id="codeBox" hidden><textarea id="code" rows="4" spellcheck="false"></textarea><div class="row"><button class="btn sm primary" id="copy">Nusxalash</button><button class="btn sm primary" id="load" hidden>Yuklash</button></div></div></div>
  <div class="section-h"><h2>Ovoz manbalari</h2></div>
  <div class="cardbox prose"><p>Saytdagi ovozlar avvalo haqiqiy odamlarning ochiq litsenziyali yozuvlaridan olinadi:</p>
    <ul><li><a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a> (Vikilug‘at talaffuzlari) va <a href="https://lingualibre.org" target="_blank" rel="noopener">Lingua Libre</a>: so‘zlar, CC BY-SA.</li>
    <li><a href="https://tatoeba.org" target="_blank" rel="noopener">Tatoeba</a>: gaplar, faqat ochiq litsenziyali yozuvlar (CC BY va boshqalar).</li>
    <li><a href="https://youglish.com" target="_blank" rel="noopener">YouGlish</a>: iboralarning YouTube videolardagi jonli talaffuzi.</li></ul>
    <p>Har bir yozuv ijro etilganda muallifi ekranda ko‘rsatiladi. Jonli yozuv topilmasa, brauzerning sintez ovozi ishlatiladi.</p></div>

  <div class="cardbox"><p>Barcha natijalar o‘chiriladi.</p><button class="btn sm bad" id="rst">Taraqqiyotni o‘chirish</button><div id="rstC"></div></div>`;
  $("#nm").onchange = e => { S.name = e.target.value.trim(); save(); };
  $("#gl").onchange = e => { S.goal = +e.target.value; save(); };
  $("#s_live").onchange = e => { S.settings.live = e.target.checked; TIL.audio.setSettings(S.settings); save(); };
  $("#s_slow").onchange = e => { S.settings.slow = e.target.checked; TIL.audio.setSettings(S.settings); save(); };
  $("#s_tr").onchange = e => { S.settings.translit = e.target.checked; save(); };
  $("#toGuide").onclick = () => go({ v:"guide" });
  if ($("#logout")) $("#logout").onclick = async () => { await pushNow(); CL.logout(); location.reload(); };
  if ($("#toLogin")) $("#toLogin").onclick = () => go({ v:"login" });
  $("#toCert").onclick = () => go({ v:"cert" });
  $("#exp").onclick = () => { $("#codeBox").hidden = false; $("#code").value = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); $("#copy").hidden = false; $("#load").hidden = true; $("#code").select(); };
  $("#imp").onclick = () => { $("#codeBox").hidden = false; $("#code").value = ""; $("#copy").hidden = true; $("#load").hidden = false; $("#code").focus(); };
  $("#copy").onclick = () => { const t = $("#code"); navigator.clipboard && navigator.clipboard.writeText(t.value).then(() => toast("Nusxalandi")).catch(() => { t.select(); toast("Belgilandi: nusxalang"); }); if (!navigator.clipboard){ t.select(); } };
  $("#load").onclick = () => { try { const d = JSON.parse(decodeURIComponent(escape(atob($("#code").value.trim())))); S = Object.assign(fresh(), d); save(); toast("Taraqqiyot yuklandi"); viewProfile(); } catch(e){ toast("Kod noto‘g‘ri. To‘liq nusxalanganini tekshiring."); } };
  $("#rst").onclick = () => { $("#rstC").innerHTML = `<p style="margin-top:10px"><b>Rostdan ham hammasini o‘chirasizmi?</b></p><div class="row"><button class="btn sm bad" id="rstY">Ha, o‘chirish</button><button class="btn sm ghost" id="rstN">Yo‘q</button></div>`;
    $("#rstY").onclick = () => { S = fresh(); save(); toast("Taraqqiyot o‘chirildi"); go({ v:"home" }, false); };
    $("#rstN").onclick = () => $("#rstC").innerHTML = ""; };
}
