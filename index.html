<script>
/* Guruh rejimi: Supabase orqali kirish (ism + PIN), umumiy reyting va duellar.
   Sozlanmagan bo‘lsa, sayt oddiy rejimda (faqat shu brauzerda) ishlaydi.
   Sahifada faqat ochiq (anon / publishable) kalit turadi; ma’lumotlarni RLS qoidalari himoya qiladi. */
window.TIL = window.TIL || {};
TIL.cloud = (function(){
  const CFG = window.TIL_CONFIG || {};
  const URL_ = (CFG.supabaseUrl || "").replace(/\/+$/, "");
  const KEY = CFG.supabaseKey || "";
  const configured = !!(URL_ && KEY && /^(https:\/\/|http:\/\/localhost)/.test(URL_));
  const SKEY = "til.session.v1";
  const DOMAIN = CFG.emailDomain || "til.example";
  let session = null;
  try { session = JSON.parse(localStorage.getItem(SKEY) || "null"); } catch(e){}
  const saveSession = () => { try { session ? localStorage.setItem(SKEY, JSON.stringify(session)) : localStorage.removeItem(SKEY); } catch(e){} };

  const slug = name => String(name).trim().toLowerCase().replace(/[‘’'`ʻʼ]/g, "").replace(/[^a-z0-9]+/g, "");
  const emailOf = name => slug(name) + "@" + DOMAIN;

  async function auth(grant, body){
    const r = await fetch(URL_ + "/auth/v1/token?grant_type=" + grant, { method:"POST", headers:{ apikey:KEY, "Content-Type":"application/json" }, body:JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.error_description || j.msg || j.message || ("HTTP " + r.status)); e.status = r.status; throw e; }
    session = { access_token:j.access_token, refresh_token:j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, user:{ id:j.user.id, email:j.user.email } };
    saveSession();
    return session;
  }
  async function login(name, pin){
    if (!slug(name)) throw new Error("Ismni kiriting");
    return auth("password", { email: emailOf(name), password: String(pin).trim() });
  }
  function logout(){ session = null; saveSession(); }
  async function token(){
    if (!session) throw new Error("not logged in");
    if (Date.now() > session.expires_at - 60000){
      try { await auth("refresh_token", { refresh_token: session.refresh_token }); }
      catch(e){ if (e.status === 400 || e.status === 401) { logout(); } throw e; }
    }
    return session.access_token;
  }
  async function rest(path, opts){
    opts = opts || {};
    const t = await token();
    const r = await fetch(URL_ + "/rest/v1/" + path, { method: opts.method || "GET",
      headers: Object.assign({ apikey:KEY, Authorization:"Bearer " + t, "Content-Type":"application/json" }, opts.headers || {}),
      body: opts.body ? JSON.stringify(opts.body) : undefined });
    if (!r.ok){ const j = await r.json().catch(() => ({})); throw new Error(j.message || ("HTTP " + r.status)); }
    if (r.status === 204) return null;
    const txt = await r.text(); return txt ? JSON.parse(txt) : null;
  }

  return {
    configured, slug,
    user: () => session && session.user,
    login, logout,
    myRole: () => rest("roles?select=user_id,role").then(a => a || []),
    myProfile: () => rest("profiles?select=*&id=eq." + session.user.id).then(a => a && a[0] || null),
    profiles: () => rest("profiles?select=id,name,xp,week_xp,last_week_xp,week_key,today_xp,day,streak,words,lessons,a1_passed,weekly_score,last_seen,tour:state->tour&order=xp.desc"),
    upsertProfile: p => rest("profiles?on_conflict=id", { method:"POST", headers:{ Prefer:"resolution=merge-duplicates,return=minimal" }, body: Object.assign({ id: session.user.id }, p) }),
    duels: () => rest("duels?select=*&order=created_at.desc&limit=30"),
    results: ids => ids.length ? rest("duel_results?select=*&duel_id=in.(" + ids.join(",") + ")") : Promise.resolve([]),
    createDuel: d => rest("duels", { method:"POST", headers:{ Prefer:"return=representation" }, body: d }).then(a => a[0]),
    clips: lesson => rest("clips?select=id,user_id,video,start_s,phrase,created_at&lesson=eq." + encodeURIComponent(lesson) + "&order=created_at.asc"),
    addClip: c => rest("clips", { method:"POST", headers:{ Prefer:"return=minimal" }, body: c }),
    delClip: id => rest("clips?id=eq." + id, { method:"DELETE" }),
    submitResult: r => rest("duel_results", { method:"POST", headers:{ Prefer:"return=minimal" }, body: r })
  };
})();

</script>

function addXP(n){
  if (!n) return;
  const t = todayStr(), before = S.days[t] || 0;
  S.xp += n; S.days[t] = before + n; save();
  if (before < S.goal && S.days[t] >= S.goal) toast("Kunlik maqsad bajarildi! Barakalla!", "gold");
}
function streak(){
  let d = todayStr(), n = 0, usedWeeks = {}, guard = 0;
  if (!S.days[d]) d = addDays(d, -1);
  while (guard++ < 2000){
    if (S.days[d]) { n++; d = addDays(d, -1); continue; }
    const wk = weekKey(d);
    const prev = addDays(d, -1);
    if (!usedWeeks[wk] && S.days[prev]) { usedWeeks[wk] = d; d = prev; continue; }
    break;
  }
  return { n, frozen: Object.values(usedWeeks) };
}

let route = { v:"home" };
const history_ = [];
function go(r, push){ if (push !== false) history_.push(route); route = r; LG = null; stopAudio(); closeVideo(); render(); window.scrollTo(0,0); }
function back(){ route = history_.pop() || { v:"home" }; LG = null; stopAudio(); closeVideo(); render(); window.scrollTo(0,0); }

function renderNav(){
  const due = dueCards().length;
  const items = [["home","Yo‘l",I.road],["review","Takrorlash",I.cards,due],["rank","Reyting",I.trophy],["dict","Lug‘at",I.book],["profile","Profil",I.user]];
  $("#nav").hidden = route.v === "login";
  $("#nav").innerHTML = items.map(([v, label, ic, cnt]) =>
    `<button data-nav="${v}" ${(route.v === v || (v==="home" && !["review","dict","profile","rank","duel"].includes(route.v)) || (v==="rank" && route.v==="duel")) ? 'aria-current="page"' : ""}>${ic}${label}${cnt ? `<span class="cnt">${cnt > 99 ? "99+" : cnt}</span>` : ""}</button>`).join("");
  $$("#nav button").forEach(b => b.onclick = () => { history_.length = 0; go({ v:b.dataset.nav }, false); });
  $("#langs").innerHTML = Object.values(COURSES).map(c => `<button class="lang ${c.soon ? "soon" : ""}" aria-pressed="${c.id === C.id}" data-lang="${c.id}" title="${c.name}">${c.short}</button>`).join("");
  $$("#langs button").forEach(b => b.onclick = () => {
    const c = COURSES[b.dataset.lang];
    if (c.soon) return toast(c.name + " keyinroq qo‘shiladi.");
    if (c.id === C.id) return;
    stopAudio(); pushNow(); try { localStorage.setItem("til.course", c.id); } catch(e){} location.reload();
  });
}
$("#brand").onclick = () => { history_.length = 0; go({ v:"home" }, false); };

$("#brandSub").textContent = C.sub; document.title = "TIL: " + C.sub.replace(" · ", " ");
function render(){
  if (CL.configured && !CL.user() && route.v !== "login") route = { v:"login" };
  renderNav();
  const v = route.v;
  if (v === "home") return viewHome();
  if (v === "lesson") return viewLesson();
  if (v === "alpha") return viewAlpha();
  if (v === "review") return viewReview();
  if (v === "dict") return viewDict();
  if (v === "profile") return viewProfile();
  if (v === "exam") return viewExamIntro(route.lvl || "A1");
  if (v === "weekly") return viewWeeklyIntro();
  if (v === "cert") return viewCert(route.lvl || LVL_IDS.filter(passed).pop() || "A1");
  if (v === "guide") return viewGuide();
  if (v === "login") return viewLogin();
  if (v === "rank") return viewRank();
  if (v === "duel") return viewDuel();
  if (v === "liga") return viewLiga();
}
const backBtn = (label) => `<button class="back" id="backBtn">${I.back}${label || "Orqaga"}</button>`;
const bindBack = () => { const b = $("#backBtn"); if (b) b.onclick = back; };

/* ===================== BOSH SAHIFA: YO‘L XARITASI ===================== */
function viewHome(){
  const st = streak(), t = todayStr(), todayXP = S.days[t] || 0;
  const k = known(), dl = doneLessons(), nx = nextStop();
  const nxL = nx && LESSON[nx];
  const cl = curLvl(), nextL = LEVELS[LEVELS.findIndex(L => L.id === cl) + 1];
  const remain = LV(cl).length - dl + (passed(cl) ? 0 : 1);
  const due = dueCards().length;
  const wk = S.weekly[WKK(weekKey())];

  /* Bugungi reja */
  const todo = [];
  if (nx === "alpha") todo.push({ t:C.alpha.todo, s:C.alpha.todoSub, go:{v:"alpha"}, done:false });
  else if (nxL) {
    const stp = S.lessons[nxL.id] || {};
    const nextPart = PARTS.find(p => !stp[p]);
    const PN = { cards:"So‘z kartochkalari", grammar:"Grammatika", dialog:"Dialog", practice:"Mashq (80% dan yuqori)", hwOK:"Uy vazifasi" };
    todo.push({ t:`${nxL.level} · ${nxL.n}-dars: ${nxL.title}`, s:"Keyingi qadam: " + PN[nextPart], go:{ v:"lesson", id:nxL.id, tab: nextPart === "hwOK" ? "hw" : nextPart }, done:false });
  } else if (/^exam/.test(nx || "")) todo.push({ t:`${nx.slice(4)} imtihonini topshiring`, s:"30 savol, o‘tish bali 80%", go:{v:"exam", lvl:nx.slice(4)}, done:false });
  const openRound = rounds().find(r => roundReady(r) && lvlOpen(r.lvl) && !(RT(r.id) && RT(r.id).done) && !isAdmin());
  if (openRound) todo.unshift({ t:`Liga: ${openRound.k}-raund ochiq!`, s:"7 bosqich, raqiblar sizni kutyapti", go:{ v:"liga", id:openRound.id }, done:false });
  todo.push({ t: due ? `${due} ta so‘zni takrorlang` : "Takrorlash", s: due ? "Unutmaslik uchun aynan bugun" : "Bugun takrorlanadigan so‘z yo‘q", go:{v:"review"}, done: !due && Object.keys(S.cards).length > 0 });
  if (dl > 0 || Object.keys(S.lessons).length) todo.push({ t:"Haftalik nazorat", s: wk ? `Bu hafta: ${wk.score}%` : "Haftada bir marta, 15 savol", go:{v:"weekly"}, done: !!wk });

  const alphaStop = stopHTML({ id:"alpha", n:C.alpha.n, title:C.alpha.stop, ru:C.alpha.ru, pct: (S[AK].read?50:0) + (S[AK].write?50:0), next: nx === "alpha" });
  const roads = LVL_IDS.filter(v => LV(v).length).map((v, i) => {
    const L = LEVELS.find(x => x.id === v), open = lvlOpen(v), ex = S.exams[exk(v)] || {};
    const head = `<div class="lvl-h${open ? "" : " locked"}"><span class="tag">${v}</span><div><b>${L.name}</b><span>${L.desc}${open ? "" : " " + L.words + "."}</span></div></div>`;
    if (!open) return head + `<div class="locked-box"><b>${LV(v).length} dars · ${LV(v).reduce((a, l) => a + l.W.length, 0)} so‘z.</b> ${LVL_IDS[i - 1]} imtihonidan o‘tgach ochiladi.</div>`;
    const road = (i === 0 ? [alphaStop] : []).concat(LV(v).flatMap((l, j) => {
      const out = [stopHTML({ id:l.id, n:l.n, title:l.title, ru:l.ruTitle, pct:lessonPct(l), next: nx === l.id, words:l.W.length })];
      const rd = (j + 1) % ROUND_N === 0 && roundOf(C.id + "-" + v + "-" + (j + 1) / ROUND_N);
      if (rd){ const t = RT(rd.id), ok = roundReady(rd);
        out.push(stopHTML({ id:"liga:" + rd.id, n:"R" + rd.k, title:`Liga · ${rd.k}-raund`, ru: t && t.done ? `Natija: ${t.total} ball` : ok ? "Ochiq! 7 bosqich, bitta urinish" : `${ROUND_N} ta dars tugagach ochiladi`, pct: t && t.done ? 100 : 0, next: ok && !(t && t.done), exam:true, liga:true })); }
      return out;
    }));
    road.push(stopHTML({ id:"exam" + v, n:v, title:v + " imtihoni va sertifikat", ru: ex.best ? `Eng yaxshi natija: ${ex.best}%` : "30 savol · o‘tish bali 80%", pct: ex.passed ? 100 : 0, next: nx === "exam" + v, exam:true, last:true }));
    return head + `<div class="road">${road.join("")}</div>`;
  }).join("");
  const later = LEVELS.filter(L => !LVL_IDS.includes(L.id) || !LV(L.id).length);

  app.innerHTML = `
  <section class="stats" aria-label="Natijalar">
    <div class="stat streak"><div class="v">${I.fire}${st.n}</div><div class="l">kun ketma-ket</div></div>
    <div class="stat xp"><div class="v">${I.star}${S.xp}</div><div class="l">XP</div></div>
    <div class="stat words"><div class="v">${k}</div><div class="l">so‘zni bilasiz</div></div>
    <div class="stat lvl"><div class="v">${dl}/${LV(cl).length}</div><div class="l">dars (${cl})</div></div>
  </section>
  <div class="goal"><b>Bugun</b><div class="gbar"><i style="width:${Math.min(100, todayXP / S.goal * 100)}%"></i></div><span>${todayXP} / ${S.goal} XP</span></div>
  <div class="freeze">Seriyani saqlash: haftada bir kun o‘tkazib yuborsangiz ham seriya uzilmaydi. Bu hafta ${freezeLeft() ? "1 ta muzlatish bor" : "muzlatish ishlatildi"}.</div>

  <section class="today">
    <h2>${S.name ? esc(S.name) + ", bugungi reja" : "Bugungi reja"}</h2>
    <p class="sub">${remain > 0 ? `${nextL ? nextL.id + " darajasigacha" : cl + " sertifikatigacha"} <b>${remain}</b> qadam qoldi.` : `${cl} darajasi yakunlandi! Keyingi daraja tayyorlanmoqda.`} Kuniga 30–60 daqiqa yetarli.</p>
    <div class="todo">${todo.map((x,i) => `<button data-todo="${i}" class="${x.done ? "done" : ""}"><span class="ck"></span><span><b>${esc(x.t)}</b><small>${esc(x.s)}</small></span></button>`).join("")}</div>
  </section>

  <div class="section-h"><h2>Yo‘l xaritasi</h2><span>${k} / ${openWords().length} so‘z</span></div>
  ${roads}
  ${later.map(L => `
    <div class="lvl-h locked"><span class="tag">${L.id}</span><div><b>${L.name}</b><span>${L.desc} ${L.words}.</span></div></div>
    <div class="locked-box"><b>${L.lessons} dars · tayyorlanmoqda.</b></div>`).join("")}
  <p class="note" style="margin-top:22px">Taraqqiyotingiz faqat shu brauzerda saqlanadi. Boshqa telefonga o‘tmoqchi bo‘lsangiz, Profil bo‘limida «Taraqqiyotni ko‘chirish» kodidan foydalaning.</p>`;

  $$("[data-todo]").forEach(b => b.onclick = () => go(todo[+b.dataset.todo].go));
  $$("[data-stop]").forEach(b => b.onclick = () => {
    const id = b.dataset.stop;
    if (id === "alpha") go({ v:"alpha" });
    else if (/^exam/.test(id)) go({ v:"exam", lvl:id.slice(4) });
    else if (/^liga:/.test(id)) go({ v:"liga", id:id.slice(5) });
    else go({ v:"lesson", id });
  });
}
function stopHTML(o){
  const cls = ["stop", o.liga ? "liga" : "", o.pct >= 100 ? "done" : "", o.next ? "next" : "", o.pct > 0 && o.pct < 100 ? "part" : "", o.exam ? "exam" : "", o.last ? "last" : ""].join(" ");
  return `<button class="${cls}" data-stop="${o.id}">
    <span class="dot">${o.pct >= 100 && !o.exam ? "✓" : o.n}</span>
    <span class="card"><h3>${esc(o.title)}</h3><span class="ru">${o.ru}</span>
      <span class="meta">${o.pct >= 100 ? '<span class="pill ok">Tugadi</span>' : o.next ? '<span class="pill warn">Keyingi</span>' : ""}${!o.exam ? `<span class="bar"><i style="width:${o.pct}%"></i></span><span>${o.pct}%</span>` : ""}${o.words ? `<span>${o.words} so‘z</span>` : ""}</span>
    </span>
    <span class="chev">${I.chev}</span></button>`;
}

/* ===================== ALIFBO ===================== */
function viewAlpha(){
  const tab = route.tab || "letters";
  app.innerHTML = `${backBtn("Yo‘l xaritasi")}
  <div class="thead"><div class="eyebrow">Birinchi qadam</div><h1>${C.alpha.h1}</h1><p>${C.alpha.h1sub}</p></div>
  <div class="tabs t3" role="tablist">
    ${[["letters","Harflar"],["read","O‘qish",S[AK].read],["write",C.alpha.write,S[AK].write]].map(([k,l,d]) => `<button class="tab" role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}${d ? "<i>✓</i>" : ""}</button>`).join("")}
  </div><div class="panel" id="panel"></div>`;
  bindBack();
  $$("[data-tab]").forEach(b => b.onclick = () => { route.tab = b.dataset.tab; viewAlpha(); });
  const P = $("#panel");
  if (tab === "letters"){
    P.innerHTML = `<p class="note">${C.alphabet.intro}</p>
      <div class="legend"><span><span class="kdot k"></span>tanish</span><span><span class="kdot l"></span>aldamchi: ko‘rinishi tanish, o‘qilishi boshqa</span>${isLat ? '<span><span class="kdot"></span>yangi</span>' : ""}</div>
      <div class="letters" style="margin-top:12px">${ALPHA.map((a,i) => `<button class="letter ${a.type}" data-l="${i}"><div class="L">${a.L}</div><div class="s">${esc(a.lat)}</div><div class="w">${a.ex}</div></button>`).join("")}</div>
      <div id="ltd" class="lt-detail"></div>
      <button class="btn primary wide" id="toRead">O‘qish mashqini boshlash</button>`;
    $$("[data-l]").forEach(b => b.onclick = () => {
      const a = ALPHA[+b.dataset.l];
      $("#ltd").innerHTML = `<div class="cardbox"><h3>${a.L} — «${esc(a.lat)}»</h3><p>${a.note ? esc(a.note) : "O‘zbekchadagi kabi o‘qiladi."}</p>
        <div class="row"><b style="font-size:20px">${a.ex}</b><span class="fc-tr">[${translit(a.ex)}]</span><span>— ${esc(a.exUz)}</span>${spkBtn(a.ex, "Tinglash", "sm")}</div></div>`;
      $("#ltd").scrollIntoView({ block:"nearest", behavior:"smooth" });
      speak(a.ex);
    });
    $("#toRead").onclick = () => { route.tab = "read"; viewAlpha(); };
  }
  if (tab === "read"){
    const pool = READING.concat(ALPHA.map(a => ({ ru:a.ex, uz:a.exUz }))).filter(it => translit(it.ru));
    const qs = sample(pool, 12).map(it => {
      const right = translit(it.ru);
      const opts = [right]; let guard = 0;
      while (opts.length < 4 && guard++ < 50){ const o = translit(sample(pool,1)[0].ru); if (!opts.includes(o)) opts.push(o); }
      return { kind:"choice", label:"Qanday o‘qiladi?", prompt:`<span class="big">${it.ru}</span><small>${esc(it.uz)}</small>`, audioAfter: it.ru, options: opts, answer: right };
    });
    runQuiz(P, { questions: qs, onFinish: (sc, n) => { const p = Math.round(sc/n*100); if (p >= 80 && !S[AK].read){ S[AK].read = true; save(); addXP(15); } return p >= 80 ? "O‘qish mashqi bajarildi!" : "80% kerak. Yana bir bor urinib ko‘ring."; }, retry: () => viewAlpha() });
  }
  if (tab === "write"){
    const pool = READING.filter(r => plain(r.ru).length <= 8);
    const qs = sample(pool, 8).map(it => ({ kind:"type", label:C.typeLbl, prompt:`<span class="big">${esc(translit(it.ru))}</span><small>${esc(it.uz)}</small>`, audio: it.ru, answer: it.ru }));
    P.innerHTML = `<p class="note">${C.alpha.kbNote}</p><div id="q"></div>`;
    runQuiz($("#q"), { questions: qs, onFinish: (sc, n) => { const p = Math.round(sc/n*100); if (p >= 80 && !S[AK].write){ S[AK].write = true; save(); addXP(15); } return p >= 80 ? "Yozish mashqi bajarildi!" : "80% kerak. Yana bir bor urinib ko‘ring."; }, retry: () => viewAlpha() });
  }
}

/* ===================== DARS ===================== */
const TABS = [["cards","So‘zlar"],["grammar","Grammatika"],["dialog","Dialog"],["practice","Mashq"],["hw","Uy vazifasi"]];
function viewLesson(){
  const l = LESSON[route.id];
  if (!l) return go({ v:"home" }, false);
  if (!lvlOpen(l.level)){ app.innerHTML = `${backBtn()}<div class="empty"><h3>${l.level} darajasi hali yopiq</h3><p>Avval ${LVL_IDS[LVL_IDS.indexOf(l.level) - 1]} imtihonidan 80% dan yuqori ball oling.</p></div>`; bindBack(); return; }
  const tab = route.tab || "cards"; const st = LS(l.id);
  TIL.audio.prefetchWords(C.id, l.W.map(w => w.plain));
  app.innerHTML = `${backBtn("Yo‘l xaritasi")}
  <div class="thead"><div class="eyebrow">${l.n}-dars · ${l.level}</div><h1>${esc(l.title)}</h1><p>${l.ruTitle}</p>
    <ul class="cando">${l.cando.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>
  <div class="tabs" role="tablist">${TABS.map(([k, lab]) => `<button class="tab" role="tab" aria-selected="${tab===k}" data-tab="${k}">${lab}${(k==="hw" ? hwDone(l) : st[k]) ? "<i>✓</i>" : ""}</button>`).join("")}</div>
  <div class="panel" id="panel"></div>`;
  bindBack();
  $$("[data-tab]").forEach(b => b.onclick = () => { route.tab = b.dataset.tab; viewLesson(); });
  const P = $("#panel");
  ({ cards: lessonCards, grammar: lessonGrammar, dialog: lessonDialog, practice: lessonPractice, hw: lessonHW })[tab](P, l);
}
const nextTab = (l, cur) => { const i = TABS.findIndex(t => t[0] === cur); return TABS[i+1] ? `<button class="btn primary wide" data-next="${TABS[i+1][0]}">Keyingi: ${TABS[i+1][1]}</button>` : ""; };
function bindNext(P){ $$("[data-next]", P).forEach(b => b.onclick = () => { route.tab = b.dataset.next; viewLesson(); window.scrollTo(0,0); }); }

/* --- kartochkalar --- */
function flashDeck(P, words, opts){
  let i = 0, flipped = false;
  const draw = () => {
    if (i >= words.length){ P.innerHTML = `<div class="empty"><h3>Barakalla!</h3><p>${words.length} ta kartochka ko‘rildi.</p>${opts.doneHTML || ""}</div>`; opts.onDone && opts.onDone(P); return; }
    const w = words[i], c = S.cards[w.id] || { box:0 };
    P.innerHTML = `<div class="deckinfo"><span>${i+1} / ${words.length}</span><span>${opts.info || "Kartochkani bosing: tarjimasi chiqadi"}</span></div>
    <div class="fc ${flipped ? "flipped" : ""}" id="fc" tabindex="0" role="button" aria-label="Kartochkani aylantirish">
      <div class="fc-inner">
        <div class="fc-face">
          <div class="box-dots" title="Bilish darajasi">${[1,2,3,4,5,6].map(n => `<i class="${c.box >= n ? "on" : ""}"></i>`).join("")}</div>
          <div class="fc-word">${wordHTML(w)} ${gTag(w.g)}</div>
          ${S.settings.translit && translit(w.ru) ? `<div class="fc-tr">[${esc(translit(w.ru))}]</div>` : ""}
          <div class="spkrow">${spkBtn(w.ru, "Tinglash")}</div>
          <div class="fc-hint">Ma’nosini eslang, keyin bosing</div>
        </div>
        <div class="fc-face back">
          <div class="fc-uz">${esc(w.uz)}</div>
          <div class="fc-word" style="font-size:20px">${wordHTML(w)}</div>
          ${w.ex ? `<div class="fc-ex">${esc(w.ex)}<i>${esc(w.exUz)}</i></div>` : ""}
          <div class="spkrow">${w.ex ? spkBtn(w.ex, "Misol", "sm") : ""}<button class="spk sm alt" data-yg="${esc(w.plain)}">${I.video}Videoda</button></div>
        </div>
      </div></div>
    <div class="grade">
      <button class="btn bad" data-g="0">Bilmayman<small>yana ko‘rsat</small></button>
      <button class="btn mid" data-g="1">Qiynaldim<small>ertaga</small></button>
      <button class="btn good" data-g="2">Bilaman<small>keyinroq</small></button>
    </div>`;
    const fc = $("#fc");
    const flip = () => { flipped = !flipped; fc.classList.toggle("flipped", flipped); };
    fc.onclick = e => { if (!e.target.closest("button,a")) flip(); };
    fc.onkeydown = e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); } };
    if (!flipped && opts.autoplay !== false) speak(w.ru);
    $$("[data-g]").forEach(b => b.onclick = () => {
      const g = +b.dataset.g;
      grade(w.id, g > 0, g === 1); addXP(1);
      if (g === 0) words.push(w);
      i++; flipped = false; draw();
    });
  };
  draw();
}
function lessonCards(P, l){
  P.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="fc-tr">${l.W.length} ta so‘z${C.gender ? ` · rang = jins: <span class="g-m">erkak</span>, <span class="g-f">ayol</span>, <span class="g-n">o‘rta</span>` : ""}</span><button class="chip" id="listBtn">${I.book}Ro‘yxat</button></div><div id="deck"></div>`;
  $("#listBtn").onclick = () => {
    $("#deck").innerHTML = `<div class="dict-wrap"><table class="dict"><tbody>${l.W.map(w => `<tr><td class="w"><button data-say="${esc(w.ru)}" aria-label="Tinglash">${I.play}</button>${wordHTML(w)} ${gTag(w.g)}<small>${esc(translit(w.ru))}</small></td><td>${esc(w.uz)}</td></tr>`).join("")}</tbody></table></div>${nextTab(l, "cards")}`;
    bindNext(P);
  };
  flashDeck($("#deck"), l.W.slice(), { onDone: (D) => { markPart(l, "cards"); D.insertAdjacentHTML("beforeend", nextTab(l, "cards")); bindNext(D); } });
}

/* --- dialog --- */
function lessonDialog(P, l){
  let showTr = true;
  const draw = () => {
    P.innerHTML = `<p class="scene">${esc(l.dialog.scene)}</p>
    <div class="dlg-tools">
      <button class="chip" id="playAll">${I.play}Hammasini tinglash</button>
      <button class="chip" id="trBtn" aria-pressed="${showTr}">Tarjima</button>
      <button class="chip" id="slowBtn" aria-pressed="${S.settings.slow}">${I.slow}Sekin</button>
    </div>
    <div class="lines">${l.D.map((d, i) => `<div class="line ${d.who}" data-i="${i}"><span class="who">${esc(d.who === "a" ? l.dialog.a : l.dialog.b)}</span>

function ytId(u){
  u = String(u || "").trim();
  const m = u.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/) || u.match(/^([A-Za-z0-9_-]{11})$/);
  return m ? m[1] : "";
}
function ytStart(u){ const m = String(u).match(/[?&#]t=(?:(\d+)m)?(\d+)s?/); return m ? (+(m[1]||0)) * 60 + (+m[2]) : 0; }
function parseTime(t){ t = String(t || "").trim(); if (!t) return null; const p = t.split(/[:.]/).map(Number); if (p.some(isNaN)) return null; return p.reduce((a, x) => a * 60 + x, 0); }
const fmtTime = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
/* Videoda: YouGlish vidjeti YouTube’dagi haqiqiy videolar (kino, serial, intervyu) ichidan
   aynan shu ibora aytilgan joyni topib, sahifaning o‘zida ko‘rsatadi. Uzun gap topilmasa, qisqaroq bo‘laklarini qidiradi. */
let ygReady = null, ygWidget = null;
function loadYG(){
  if (ygReady) return ygReady;
  ygReady = new Promise((res, rej) => {
    window.onYouglishAPIReady = () => res();
    const t = document.createElement("script"); t.src = "https://youglish.com/public/emb/widget.js"; t.async = true;
    t.onerror = () => { ygReady = null; rej(new Error("load")); };
    document.head.appendChild(t);
    setTimeout(() => rej(new Error("timeout")), 15000);
  });
  return ygReady;
}
function ygQueries(text){
  const clean = t => plain(t).replace(/\.\.\.|…/g, ". ").replace(/[«»"“”„()]/g, "").replace(/\s+/g, " ").trim();
  const words = t => t.split(" ").filter(Boolean);
  const full = clean(text).replace(/[?!.,;:—–]/g, "").replace(/\s+/g, " ").trim();
  const parts = clean(text).split(/[?!.,;:—–]+/).map(x => x.trim()).filter(Boolean);
  const out = [];
  const add = q => { q = q.trim(); if (q && !out.includes(q)) out.push(q); };
  if (words(full).length <= 8 && parts.length <= 2) add(full);
  parts.filter(x => words(x).length >= 2).sort((a, b) => words(b).length - words(a).length).forEach(x => add(words(x).length > 6 ? words(x).slice(0, 6).join(" ") : x));
  parts.filter(x => words(x).length >= 4).forEach(x => add(words(x).slice(0, 3).join(" ")));
  parts.filter(x => words(x).length === 1).forEach(add);
  if (!out.length) add(full);
  return out.slice(0, 6);
}

/* --- savol generatorlari --- */
function distract(w, field, n, pool){
  const out = new Set([w[field]]);
  const cands = shuffle((pool || ALL_WORDS).filter(x => x[field] !== w[field] && x.id !== w.id));
  for (const x of cands){ if (out.size > n) break; out.add(x[field]); }
  return [...out];
}
function qVocab(w, type, pool){
  if (type === "gender" && !w.g) type = "ru2uz";
  pool = pool && pool.length >= 6 ? pool : ALL_WORDS;
  if (type === "ru2uz") return { kind:"choice", word:w.id, label:"Tarjimasini toping", prompt:`<span class="big">${wordHTML(w)}</span>`, audio:w.ru, options:distract(w,"uz",3,pool), answer:w.uz };
  if (type === "uz2ru") return { kind:"choice", word:w.id, label:C.adj + "sini toping", prompt:esc(w.uz), options:distract(w,"ru",3,pool), answer:w.ru, audioAfter:w.ru };
  if (type === "listen") return { kind:"choice", word:w.id, label:"Tinglang va toping", prompt:`<span class="fc-tr">Tugmani bosib tinglang</span>`, audio:w.ru, autoplay:true, options:distract(w,"uz",3,pool), answer:w.uz };
  if (type === "type" && (w.plain.includes("...") || w.plain.length > 16)) type = "uz2ru";
  if (type === "type") return { kind:"type", word:w.id, label:C.adj + " yozing", prompt:esc(w.uz), answer:w.ru, audioAfter:w.ru };
  if (type === "gender"){
    const G = C.gender, ans = G.ans[w.g];
    if (!ans) return qVocab(w, "ru2uz", pool);
    const bare = isDe ? w.ru.replace(/^(der|die|das)\s+/i, "") : w.ru;
    return { kind:"choice", word:w.id, label:G.label, prompt:`___ <span class="big" style="font-size:24px">${esc(bare)}</span><small>${esc(w.uz)}</small>`, options:G.opts, keepOrder:true, answer:ans, audioAfter:w.ru, explain: GN[w.g] + " jinsi" + (isDe ? ": " + w.ru : "") };
  }
}
const nouns = ws => !C.gender ? [] : ws.filter(w => isDe ? (/^(m|f|n)$/.test(w.g) && /^(der|die|das) \S+$/.test(w.plain)) : (/^(m|f|n|pl)$/.test(w.g) && !/\s/.test(w.plain)));
const grammarQs = (l, n) => sample(l.test, n || l.test.length).map(t => ({ kind:"choice", label:"Grammatika", prompt:esc(t.q), options:t.o, answer:t.o[0], explain:t.e }));
function sentencePool(l){
  const ex = l.W.filter(w => w.ex && w.ex.split(" ").length >= 2 && w.ex.split(" ").length <= 8 && !w.ex.includes("—")).map(w => ({ ru:w.ex, uz:w.exUz }));
  const dl = l.D.filter(d => d.ru.split(" ").length <= 9).map(d => ({ ru:d.ru, uz:d.uz }));
  return { ex, dl };
}

/* --- mashq --- */
function lessonPractice(P, l){
  const st = LS(l.id);
  const W = shuffle(l.W);
  const qs = [];
  W.slice(0,3).forEach(w => qs.push(qVocab(w, "ru2uz", l.W)));
  W.slice(3,5).forEach(w => qs.push(qVocab(w, "uz2ru", l.W)));
  W.slice(5,7).forEach(w => qs.push(qVocab(w, "listen", l.W)));
  W.slice(7).filter(w => w.plain.length <= 12 && !w.plain.includes("...")).slice(0,2).forEach(w => qs.push(qVocab(w, "type", l.W)));
  sample(nouns(l.W), 2).forEach(w => qs.push(qVocab(w, "gender")));
  qs.push({ kind:"match", label:"Juftini toping", pairs: sample(l.W, 5).map(w => [w.ru, w.uz]) });
  const all = shuffle(qs).concat(grammarQs(l, 5));
  P.innerHTML = `<p class="note">${all.length} ta savol: so‘zlar, tinglash, yozish va grammatika. Darsni yopish uchun kamida <b>80%</b> kerak.${st.practiceBest ? ` Eng yaxshi natijangiz: <b>${st.practiceBest}%</b>.` : ""}</p><div id="q" style="margin-top:12px"></div>`;

}

  }

  }
  if (part === "trans"){
    const qs = sample(ex.filter(s => s.ru.split(" ").length <= 6), 4).map(s => ({ kind:"type", label:C.adj.replace(/a$/, "aga") + " tarjima qiling", prompt:esc(s.uz), answer:s.ru, audioAfter:s.ru, sentence:true, selfCheck:true }));
    runQuiz(Q, { questions: qs, onFinish: done, retry: () => viewLesson(), after: backHW });
  }
  if (part === "build"){
    const qs = sample(dl.concat(ex).filter(s => s.ru.split(" ").length >= 3), 4).map(s => ({ kind:"build", label:"Gap tuzing", prompt:esc(s.uz), answer:s.ru, audioAfter:s.ru }));
    runQuiz(Q, { questions: qs, onFinish: done, retry: () => viewLesson(), after: backHW });
  }
  if (part === "speak") speakPractice(Q, sample(l.D, 3).map(d => d.ru), () => { finish(); backHW(); });
}

/* --- gapirish: tinglash, yozib olish, solishtirish --- */
function speakPractice(Q, lines, onDone){
  let i = 0, rec = null, url = null, chunks = [];
  const canRec = !!(navigator.mediaDevices && window.MediaRecorder);
  const draw = (state) => {
    if (i >= lines.length){ Q.innerHTML = `<div class="result"><div class="big">✓</div><p>Gapirish mashqi bajarildi.</p><button class="btn primary wide" id="ok">Uy vazifasiga qaytish</button></div>`; $("#ok").onclick = onDone; return; }
    const s = lines[i];
    Q.innerHTML = `<div class="qmeta"><span>${i+1} / ${lines.length}</span></div>
    <div class="qcard rec"><div class="qkind">1. Tinglang · 2. Yozib oling · 3. Solishtiring</div>
      <div class="qtext">${esc(s)}<small>${S.settings.translit ? esc(translit(s)) : ""}</small></div>
      <div class="row">${spkBtn(s, "Asl ovoz")}
        ${canRec ? (state === "rec" ? `<button class="btn bad sm" id="stopRec">${'<span class="recdot"></span>'} To‘xtatish</button>` : `<button class="btn primary sm" id="startRec">${I.mic} Ovozimni yozish</button>`) : ""}
        ${url ? `<button class="spk alt" id="mine">${I.play}<span>Mening ovozim</span></button>` : ""}</div>
      ${!canRec ? `<p class="fc-tr">Bu brauzerda ovoz yozib bo‘lmaydi. Asl ovozni tinglab, ovoz chiqarib 3 marta takrorlang.</p>` : ""}
      <p class="fc-tr" id="recMsg"></p>
      <div class="grade" style="grid-template-columns:1fr 1fr"><button class="btn mid" id="again">Yana urinaman</button><button class="btn good" id="next">O‘xshadi, keyingisi</button></div>
    </div>`;
    if (state !== "rec" && !url) speak(s);
    const sr = $("#startRec"), sp = $("#stopRec");
    if (sr) sr.onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
        chunks = []; rec = new MediaRecorder(stream);
        rec.ondataavailable = e => chunks.push(e.data);
        rec.onstop = () => { stream.getTracks().forEach(t => t.stop()); if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || "audio/webm" })); draw("done"); new Audio(url).play().catch(()=>{}); };
        rec.start(); draw("rec");
      } catch(e){ $("#recMsg").textContent = "Mikrofonga ruxsat berilmadi. Ovoz chiqarib takrorlang va o‘zingiz baholang."; }
    };
    if (sp) sp.onclick = () => rec && rec.state !== "inactive" && rec.stop();
    const m = $("#mine"); if (m) m.onclick = () => new Audio(url).play().catch(()=>{});
    $("#again").onclick = () => { url = null; draw(); };
    $("#next").onclick = () => { addXP(3); i++; url = null; draw(); };
  };
  draw();
}

let kbOpen = false;
const KB_ROWS = C.kb;
function keyboardHTML(){
  return `<button class="chip kbtoggle" id="kbT" aria-pressed="${kbOpen}">⌨ Klaviatura</button>
  <div class="kb" id="kb" ${kbOpen ? "" : "hidden"}>${KB_ROWS.map(r => `<div class="r">${[...r].map(ch => `<button type="button" data-k="${ch}">${ch}</button>`).join("")}</div>`).join("")}
  <div class="r">${C.kbExtra.map(ch => `<button type="button" class="w" data-k="${ch}">${ch}</button>`).join("")}<button type="button" class="w" data-k=" ">bo‘sh joy</button><button type="button" class="w" data-k="⌫">⌫ o‘chirish</button></div></div>`;
}
function bindKeyboard(input){
  const T = $("#kbT"); if (!T) return;
  T.onclick = () => { kbOpen = !kbOpen; $("#kb").hidden = !kbOpen; T.setAttribute("aria-pressed", kbOpen); };
  $$("#kb [data-k]").forEach(b => b.onclick = () => {
    const k = b.dataset.k; if (input.disabled) return;
    const s = input.selectionStart ?? input.value.length, e = input.selectionEnd ?? input.value.length;
    if (k === "⌫"){ if (s === e && s > 0) { input.value = input.value.slice(0, s-1) + input.value.slice(e); input.setSelectionRange(s-1, s-1); } else { input.value = input.value.slice(0, s) + input.value.slice(e); input.setSelectionRange(s, s); } }
    else { input.value = input.value.slice(0, s) + k + input.value.slice(e); input.setSelectionRange(s+1, s+1); }
  });
}

function runQuiz(root, cfg){
  const qs = cfg.questions.filter(Boolean);
  let i = 0, score = 0;
  const draw = () => {
    if (i >= qs.length){
      const p = Math.round(score / qs.length * 100);
      const msg = cfg.onFinish ? cfg.onFinish(score, qs.length) : "";
      const extra = cfg.extra ? cfg.extra()(p) : "";
      root.innerHTML = `<div class="result"><div class="big">${p}%</div><p>${score} / ${qs.length} to‘g‘ri</p><p><b>${esc(msg || "")}</b></p>
        <div class="row" style="justify-content:center;margin-top:12px">${cfg.after ? '<button class="btn primary" id="afterBtn">Davom etish</button>' : ""}<button class="btn ghost" id="retryBtn">Qayta boshlash</button></div></div>${extra}`;
      const rb = $("#retryBtn", root); if (rb) rb.onclick = cfg.retry || (() => { i = 0; score = 0; draw(); });
      const ab = $("#afterBtn", root); if (ab) ab.onclick = cfg.after;
      if (cfg.bindExtra) cfg.bindExtra(root);
      renderNav();
      return;
    }
    const q = qs[i];
    root.innerHTML = `<div class="qmeta"><span>${i+1} / ${qs.length}</span><span>${score} to‘g‘ri</span></div>
      <div class="qprog"><i style="width:${i / qs.length * 100}%"></i></div>
      <div class="qcard"><div class="qkind">${esc(q.label || "")}</div>
        <div class="qtext">${q.prompt || ""}</div>
        ${q.audio ? `<div class="row" style="margin:-4px 0 14px">${spkBtn(q.audio, "Tinglash", "sm")}${q.sentence ? spkBtn(q.audio, "Sekin", "sm alt slowone") : ""}</div>` : ""}
        <div id="body"></div><div id="fb"></div></div>`;
    $$(".slowone", root).forEach(b => b.addEventListener("click", e => { e.stopPropagation(); const prev = S.settings.slow; TIL.audio.setSettings({ slow:true }); speak(q.audio, b).finally(() => TIL.audio.setSettings({ slow:prev })); }, true));
    if (q.audio && q.autoplay) setTimeout(() => speak(q.audio), 150);
    const body = $("#body", root), fb = $("#fb", root);
    const next = (ok, half) => {
      if (ok) { score += 1; addXP(half ? 1 : 2); }
      if (q.word) grade(q.word, ok, !!half);
      const nb = document.createElement("button"); nb.className = "btn primary wide"; nb.textContent = i + 1 < qs.length ? "Davom etish" : "Natijani ko‘rish";
      nb.onclick = () => { i++; draw(); }; fb.appendChild(nb); nb.focus({ preventScroll:true });
      if (q.audioAfter) speak(q.audioAfter);
    };
    const feedback = (cls, title, body2) => { fb.innerHTML = `<div class="fb ${cls}"><b>${title}</b>${body2 ? `<i>${body2}</i>` : ""}</div>`; };

    if (q.kind === "choice"){
      const opts = q.keepOrder ? q.options : shuffle(q.options);
      body.innerHTML = `<div class="opts">${opts.map(o => `<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
      $$(".opt", body).forEach(b => b.onclick = () => {
        const ok = b.dataset.o === q.answer;
        $$(".opt", body).forEach(x => { x.disabled = true; if (x.dataset.o === q.answer) x.classList.add("right"); });
        if (!ok) b.classList.add("wrong");
        feedback(ok ? "good" : "bad", ok ? "To‘g‘ri!" : "Noto‘g‘ri. To‘g‘ri javob: " + esc(q.answer), q.explain ? esc(q.explain) : "");
        next(ok);
      });
    }
    if (q.kind === "type"){
      body.innerHTML = `<form id="tf" autocomplete="off"><input class="tin" id="tin" lang="${C.id}" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${C.typeLbl}…" aria-label="Javob">
        <button class="btn primary wide" type="submit">Tekshirish</button></form>${keyboardHTML()}`;
      const inp = $("#tin", body); bindKeyboard(inp);
      if (!kbOpen) setTimeout(() => inp.focus({ preventScroll:true }), 50);
      $("#tf", body).onsubmit = e => {
        e.preventDefault(); if (inp.disabled) return;
        const a = normRu(inp.value), b = normRu(q.answer);
        if (!a) return;
        inp.disabled = true; $("#tf button", body).remove();
        const d = lev(a, b), tol = b.length <= 6 ? 1 : Math.max(2, Math.round(b.length * 0.12));
        if (a === b){ inp.classList.add("right"); feedback("good", "To‘g‘ri!", esc(q.answer) + (q.explain ? " — " + esc(q.explain) : "")); next(true); }
        else if (d <= tol && (isLat ? /[a-z]/ : /[а-я]/).test(a)){ inp.classList.add("right"); feedback("mid", "Deyarli to‘g‘ri! Imloga e’tibor bering:", esc(q.answer)); next(true, true); }
        else {
          inp.classList.add("wrong");
          feedback("bad", "To‘g‘ri javob: " + esc(q.answer), (!isLat && /[a-z]/i.test(a) ? "Lotin harflarida yozdingiz. Kirill harflaridan foydalaning. " : "") + (q.explain ? esc(q.explain) : ""));
          if (q.selfCheck){
            const sb = document.createElement("button"); sb.className = "btn ghost sm"; sb.style.marginTop = "8px"; sb.textContent = "Mening javobim ham to‘g‘ri (boshqa so‘zlar bilan)";
            sb.onclick = () => { score += 1; addXP(1); sb.remove(); toast("Qabul qilindi. Javobni o‘zingiz tekshirdingiz."); };
            fb.appendChild(sb);
          }
          next(false);
        }
      };
    }
    if (q.kind === "build"){
      const toks = q.answer.split(" ");
      const bank = shuffle(toks.map((t, k) => ({ t, k })));
      const chosen = [];
      body.innerHTML = `<div class="built" id="built" aria-label="Siz tuzgan gap"></div><div class="bank" id="bank">${bank.map(b => `<button class="tok" data-k="${b.k}">${esc(b.t)}</button>`).join("")}</div><button class="btn primary wide" id="chk" disabled>Tekshirish</button>`;
      const built = $("#built", body), chk = $("#chk", body);
      const redraw = () => { built.innerHTML = chosen.map((c, j) => `<button class="tok" data-j="${j}">${esc(c.t)}</button>`).join(""); $$("#bank .tok", body).forEach(b => b.classList.toggle("used", chosen.some(c => c.k === +b.dataset.k))); chk.disabled = chosen.length !== toks.length;
        $$("[data-j]", built).forEach(b => b.onclick = () => { if (chk.dataset.done) return; chosen.splice(+b.dataset.j, 1); redraw(); }); };
      $$("#bank .tok", body).forEach(b => b.onclick = () => { if (chk.dataset.done || b.classList.contains("used")) return; chosen.push(bank.find(x => x.k === +b.dataset.k)); redraw(); });
      chk.onclick = () => {
        chk.dataset.done = 1; chk.remove();
        const ok = normRu(chosen.map(c => c.t).join(" ")) === normRu(q.answer);
        built.classList.add(ok ? "right" : "wrong");
        feedback(ok ? "good" : "bad", ok ? "To‘g‘ri!" : "To‘g‘ri tartib:", ok ? "" : esc(q.answer));
        next(ok);
      };
    }
    if (q.kind === "match"){
      const L = shuffle(q.pairs.map((p, k) => ({ t:p[0], k }))), R = shuffle(q.pairs.map((p, k) => ({ t:p[1], k })));
      let sel = null, errs = 0, left = q.pairs.length;
      body.innerHTML = `<div class="match"><div class="col">${L.map(x => `<button class="mt" data-side="L" data-k="${x.k}">${esc(x.t)}</button>`).join("")}</div><div class="col">${R.map(x => `<button class="mt" data-side="R" data-k="${x.k}">${esc(x.t)}</button>`).join("")}</div></div>`;
      $$(".mt", body).forEach(b => b.onclick = () => {
        if (b.classList.contains("done")) return;
        if (b.dataset.side === "L") speak(q.pairs[+b.dataset.k][0]);
        if (!sel || sel.dataset.side === b.dataset.side){ $$(".mt.sel", body).forEach(x => x.classList.remove("sel")); sel = b; b.classList.add("sel"); return; }
        if (sel.dataset.k === b.dataset.k){ [sel, b].forEach(x => { x.classList.remove("sel"); x.classList.add("done"); x.disabled = true; }); left--; sel = null;
          if (!left){ const ok = errs <= 1; feedback(ok ? "good" : "bad", ok ? "Hammasi to‘g‘ri!" : `Tugadi, lekin ${errs} ta xato bilan.`); next(ok); } }
        else { errs++; const a = sel, c = b; [a, c].forEach(x => x.classList.add("err")); setTimeout(() => [a, c].forEach(x => x.classList.remove("err","sel")), 500); sel = null; }
      });
    }
  };
  draw();
}

      const e = S.exams[K] = S.exams[K] || {};
      e.best = Math.max(e.best||0, p); e.tries = (e.tries||0) + 1;
      if (p >= 80 && !e.passed){ e.passed = true; e.date = todayStr(); e.score = p; e.no = "TIL-" + C.short + "-" + lvl + "-" + Math.random().toString(36).slice(2, 8).toUpperCase(); addXP(100); }
      save();
      return p >= 80 ? "Tabriklaymiz! Siz " + lvl + " darajasini tasdiqladingiz." : "80% kerak. Xato qilgan mavzularingizni takrorlab, yana topshiring.";
    }, retry: () => viewExamIntro(lvl), after: () => go({ v: passed(lvl) ? "cert" : "home", lvl }) });
  };
}

/* ===================== LIGA: har 3 darsdan keyin raund ===================== */
/* Har bir daraja bitta mavsum. Har 3 darsdan keyin raund ochiladi: 7 bosqich, har birida vaqt chegarasi.
   Joker (×2), lider bilan jonli poyga, boshqa oynaga o‘tsangiz savol 0 ball va bu hammaga ko‘rinadi.
   Raund o‘rinlari mavsum ochkosini beradi: 1-o‘rin 10, 2-o‘rin 6, 3-o‘rin 3, qatnashgan 1. */
const ROUND_N = 3;
const PLACE_PTS = [10, 6, 3];
const STAGES = [
  { k:"blitz", t:"Blits", s:"60 soniya, iloji boricha ko‘p so‘z. Ketma-ket to‘g‘ri javob kombo beradi: ×2, keyin ×3. Xato komboni yo‘qotadi.", max:150 },
  { k:"ear", t:"Quloq", s:"Matn yo‘q, faqat ovoz. Gapni eshiting va ma’nosini toping. Ovoz tugagach vaqt boshlanadi.", max:100 },
  { k:"dict", t:"Diktant", s:"So‘zni eshiting va yozing. Kichik xato yarim ball.", max:100 },
  { k:"gram", t:"Grammatika", s:"Darslardagi qoidalar. Tez javob qo‘shimcha ball beradi.", max:100 },
  { k:"build", t:"Gap yig‘ish", s:"Bo‘laklarni to‘g‘ri tartibda bosing. Tarjima yordam beradi, lekin vaqt qisqa.", max:100 },
  { k:"err", t:"Xatoni top", s:"Uchta gapdan bittasi to‘g‘ri. Ona tilida gapiradigan odamdek bir qarashda ko‘ring.", max:100 },
  { k:"voice", t:"Notiq", s:"Gapni ovoz chiqarib o‘qing, sayt eshitib baholaydi. Mikrofon kerak.", max:100 }
];
const BONUS = { fair:30, clean:50 };
const JOKER_MIN = 70;

function rounds(){
  return LVL_IDS.flatMap(v => {
    const L = LV(v), out = [];
    for (let k = 1; k * ROUND_N <= L.length; k++) out.push({ id: C.id + "-" + v + "-" + k, lvl: v, k, lessons: L.slice((k - 1) * ROUND_N, k * ROUND_N) });
    return out;
  });
}
const roundOf = id => rounds().find(r => r.id === id);
const roundReady = r => isAdmin() || (lvlOpen(r.lvl) && r.lessons.every(l => lessonPct(l) === 100));
const RT = id => (S.tour = S.tour || {})[id];
const rName = r => `${r.lvl} · ${r.k}-raund`;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

/* --- savollar --- */
const cleanT = s => normRu(s).replace(/[^\p{L}\p{N}\s]/gu, "").replace(/\s+/g, " ").trim();
function lgQuestions(r){
  const W = r.lessons.flatMap(l => l.W), D = r.lessons.flatMap(l => l.D);
  const sent = D.filter(d => { const n = d.ru.split(" ").length; return n >= 3 && n <= 9; });
  const short = D.filter(d => { const n = d.ru.split(" ").length; return n >= 2 && n <= 6; });
  const wordsOk = W.filter(w => !/\.\.\.|…|\//.test(w.plain) && w.plain.length <= 14);
  const ear = sample(sent, 6).map(d => ({ kind:"choice", audio:d.ru, limit:12, prompt:"", options: shuffle([d.uz].concat(sample(sent.filter(x => x.uz !== d.uz), 3).map(x => x.uz))), answer:d.uz }));
  const dict = sample(wordsOk.filter(w => w.plain.split(" ").length <= 2), 5).map(w => ({ kind:"type", audio:w.ru, limit:20, prompt:"", answer:w.plain, hint:w.uz }));
  const gram = sample(r.lessons.flatMap(l => l.test), 6).map(t => ({ kind:"choice", limit:15, prompt:esc(t.q), options:shuffle(t.o), answer:t.o[0] }));
  const build = sample(sent.filter(d => { const n = d.ru.split(" ").length; return n >= 4 && n <= 8; }), 4).map(d => ({ kind:"order", limit:30, prompt:esc(d.uz), answer:d.ru }));
  const ms = r.lessons.flatMap(l => l.grammar.mistakes || []);
  const err = sample(ms, Math.min(5, ms.length)).map(m => {
    const other = sample(ms.filter(x => x !== m && x[0] !== m[1]), 1).map(x => x[0]);
    return { kind:"choice", limit:12, prompt:"Qaysi gap to‘g‘ri?", options:shuffle([m[1], m[0]].concat(other)), answer:m[1] };
  });
  const voice = sample(short.length >= 4 ? short : sent, 4).map(d => SR ? { kind:"voice", limit:15, prompt:esc(d.ru), sub:esc(d.uz), answer:d.ru } : { kind:"type", audio:d.ru, limit:25, prompt:"", answer:d.ru, hint:d.uz });
  return { blitz: shuffle(W), ear, dict, gram, build, err, voice };
}

/* --- tinglash (Notiq) --- */
function listenOnce(ms){
  return new Promise(res => {
    let r; try { r = new SR(); } catch(e){ return res(null); }
    r.lang = C.tag; r.interimResults = false; r.maxAlternatives = 3;
    let done = false;
    const fin = v => { if (done) return; done = true; try { r.abort(); } catch(e){} res(v); };
    r.onresult = e => fin([...e.results[0]].map(a => a.transcript));
    r.onerror = e => fin(e.error === "not-allowed" || e.error === "service-not-allowed" ? false : []);
    r.onend = () => fin([]);
    try { r.start(); } catch(e){ fin(null); }
    setTimeout(() => fin([]), ms);
  });
}
function sim(a, b){ a = cleanT(a); b = cleanT(b); if (!a || !b) return 0; return 1 - lev(a, b) / Math.max(a.length, b.length); }

/* --- ishlash vaqtidagi holat --- */
let LG = null;
document.addEventListener("visibilitychange", () => {
  if (!document.hidden || !LG) return;
  LG.T.leaves = (LG.T.leaves || 0) + 1; save();
  if (LG.onLeave) LG.onLeave();
  setTimeout(() => toast("Boshqa oynaga o‘tdingiz: savol 0 ball. Bu natijada ko‘rinadi.", "gold"), 300);
});
const timerHTML = s => `<div class="lg-timer"><i style="animation-duration:${s}s"></i></div>`;

function lgAsk(box, q, head){
  return new Promise(res => {
    if (!LG) return;
    let done = false, t0 = 0, tid = 0;
    const finish = (frac, el) => {
      if (done) return; done = true; clearTimeout(tid); if (LG) LG.onLeave = null;
      const left = t0 ? Math.max(0, q.limit * 1000 - (Date.now() - t0)) / (q.limit * 1000) : 0;
      const bar = $(".lg-timer i", box); if (bar) bar.style.animationPlayState = "paused";
      setTimeout(() => res({ frac, left }), frac === 1 ? 450 : 1300);
    };
    LG.onLeave = () => { const t = $("#lgFb", box); if (t) t.textContent = "Boshqa oynaga o‘tildi: 0 ball"; finish(0); };
    const optsHTML = () => `<div class="opts">${q.options.map((o, i) => `<button class="opt" data-o="${i}">${esc(o)}</button>`).join("")}</div>`;
    box.innerHTML = `${head}<div class="qcard lg-q">
      ${q.audio ? `<div class="lg-ear"><button class="spk" id="lgPlay">${I.play}<span>Yana tinglash</span></button><span class="fc-tr" id="lgWait">Tinglang…</span></div>` : ""}
      ${q.prompt ? `<div class="qtext">${q.prompt}${q.sub ? `<small>${q.sub}</small>` : ""}</div>` : ""}
      <div id="lgBody"></div><p class="lg-fb" id="lgFb" role="status"></p><div id="lgT"></div></div>`;
    const body = $("#lgBody", box), fb = $("#lgFb", box);
    const start = () => {
      if (done) return;
      t0 = Date.now(); $("#lgT", box).innerHTML = timerHTML(q.limit);
      const w = $("#lgWait", box); if (w) w.textContent = "";
      tid = setTimeout(() => { fb.textContent = "Vaqt tugadi. To‘g‘ri javob: " + q.answer; lock(); finish(0); }, q.limit * 1000);
      if (q.kind === "type"){ const i = $("#lgIn", box); i.disabled = false; i.focus(); }
      if (q.kind === "choice") $$(".opt", box).forEach(b => b.disabled = false);
    };
    const lock = () => $$("button, input", body).forEach(x => x.disabled = true);
    if (q.kind === "choice"){
      body.innerHTML = optsHTML();
      $$(".opt", body).forEach(b => { b.disabled = true; b.onclick = () => {
        const ok = q.options[+b.dataset.o] === q.answer; lock();
        b.classList.add(ok ? "right" : "wrong");
        if (!ok) $$(".opt", body).forEach(x => { if (q.options[+x.dataset.o] === q.answer) x.classList.add("right"); });
        finish(ok ? 1 : 0);
      }; });
    } else if (q.kind === "type"){
      body.innerHTML = `<form id="lgF" autocomplete="off"><input class="tin" id="lgIn" lang="${C.id}" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${C.typeLbl}…" disabled><button class="btn primary wide" style="margin-top:10px">Tekshirish</button></form>${keyboardHTML()}`;
      const inp = $("#lgIn", box); inp.onpaste = e => e.preventDefault(); inp.ondrop = e => e.preventDefault();
      bindKeyboard(inp);
      $("#lgF", box).onsubmit = e => {
        e.preventDefault(); if (!t0 || done) return;
        const a = cleanT(inp.value), want = cleanT(q.answer), d = lev(a, want);
        const frac = a === want ? 1 : (a && d <= Math.max(1, Math.floor(want.length * 0.15)) ? 0.5 : 0);
        inp.classList.add(frac === 1 ? "right" : "wrong"); inp.disabled = true;
        fb.innerHTML = frac === 1 ? "To‘g‘ri!" : (frac ? "Deyarli: " : "To‘g‘ri javob: ") + esc(q.answer) + (q.hint ? ` <span class="fc-tr">(${esc(q.hint)})</span>` : "");
        finish(frac);
      };
    } else if (q.kind === "order"){
      const tokens = q.answer.split(" "), pool = shuffle(tokens.map((t, i) => ({ t, i })));
      let picked = [];
      const draw = () => {
        body.innerHTML = `<div class="lg-line">${picked.map((p, j) => `<button class="chip" data-u="${j}">${esc(p.t)}</button>`).join("") || '<span class="fc-tr">Bo‘laklarni tartib bilan bosing</span>'}</div>
          <div class="lg-pool">${pool.map((p, j) => picked.includes(p) ? "" : `<button class="chip" data-p="${j}">${esc(p.t)}</button>`).join("")}</div>
          <button class="btn primary wide" id="lgOk" ${picked.length === tokens.length ? "" : "disabled"}>Tayyor</button>`;
        $$("[data-p]", body).forEach(b => b.onclick = () => { if (done || !t0) return; picked.push(pool[+b.dataset.p]); draw(); });
        $$("[data-u]", body).forEach(b => b.onclick = () => { if (done) return; picked.splice(+b.dataset.u, 1); draw(); });
        $("#lgOk", body).onclick = () => {
          const ok = picked.map(p => cleanT(p.t)).join(" ") === tokens.map(cleanT).join(" ");
          lock(); fb.innerHTML = ok ? "To‘g‘ri!" : "To‘g‘ri tartib: " + esc(q.answer); finish(ok ? 1 : 0);
        };
      };
      draw();
    } else if (q.kind === "voice"){
      body.innerHTML = `<button class="btn primary wide" id="lgMic">${I.mic} Gapirish</button><p class="fc-tr" id="lgHeard"></p>`;
      let tries = 0;
      $("#lgMic", body).onclick = async () => {
        if (done) return; const b = $("#lgMic", body); b.disabled = true; b.innerHTML = '<span class="recdot"></span> Eshityapman…';
        const alts = await listenOnce(Math.max(2000, q.limit * 1000 - (Date.now() - t0) - 300));
        if (done) return;
        if (alts === false || alts === null){ fb.textContent = "Mikrofon ishlamadi. Brauzerga mikrofon ruxsatini bering."; b.disabled = false; b.innerHTML = I.mic + " Yana urinish"; return; }
        const best = Math.max(0, ...alts.map(a => sim(a, q.answer)));
        $("#lgHeard", body).textContent = alts[0] ? "Eshitildi: «" + alts[0] + "»" : "Hech narsa eshitilmadi.";
        tries++;
        if (best >= 0.8){ fb.textContent = "Zo‘r talaffuz!"; finish(1); }
        else if (tries < 2 && best < 0.8){ fb.textContent = best >= 0.55 ? "Yaqin! Yana bir marta aniqroq ayting." : "Tushunilmadi. Yana bir marta."; b.disabled = false; b.innerHTML = I.mic + " Yana urinish"; }
        else { fb.textContent = best >= 0.55 ? "Qisman tushunildi: yarim ball." : "Tushunilmadi."; finish(best >= 0.55 ? 0.5 : 0); }
      };
    }
    if (q.audio){
      const play = () => speak(q.audio, null, "f");
      $("#lgPlay", box).onclick = play;
      play().then(start);
    } else start();
  });
}

function lgBlitz(box, words, head){
  return new Promise(res => {
    if (!LG) return;
    let pts = 0, combo = 0, i = 0, n = 0, ok = 0, over = false;
    const end = Date.now() + 60000;
    const finish = () => { if (over) return; over = true; clearInterval(clk); if (LG) LG.onLeave = null; res({ pts: Math.max(0, Math.min(150, Math.round(pts))), info: `${ok} / ${n} to‘g‘ri` }); };
    LG.onLeave = () => { pts -= 10; combo = 0; };
    box.innerHTML = `${head}<div class="qcard lg-q"><div class="lg-blitz"><b id="bzT">60</b><span id="bzP">0 ball</span><span id="bzC" class="lg-combo"></span></div><div id="bzQ"></div></div>`;
    const clk = setInterval(() => { if (!LG || !$("#bzT")) return finish(); const s = Math.max(0, Math.ceil((end - Date.now()) / 1000)); $("#bzT").textContent = s; if (s <= 0) finish(); }, 200);
    const next = () => {
      if (over) return;
      const w = words[i++ % words.length], opts = shuffle(distract(w, "ru", 3, words));
      $("#bzQ").innerHTML = `<div class="qtext">${esc(w.uz)}</div><div class="opts">${opts.map((o, j) => `<button class="opt" data-o="${j}">${esc(o)}</button>`).join("")}</div>`;
      $$("#bzQ .opt").forEach(b => b.onclick = () => {
        if (over) return; n++;
        const good = opts[+b.dataset.o] === w.ru;
        $$("#bzQ .opt").forEach(x => x.disabled = true);
        b.classList.add(good ? "right" : "wrong");
        if (good){ ok++; combo++; pts += 4 * (combo >= 6 ? 3 : combo >= 3 ? 2 : 1); } else { combo = 0; pts -= 2; }
        $("#bzP").textContent = Math.max(0, Math.round(pts)) + " ball";
        $("#bzC").textContent = combo >= 6 ? "KOMBO ×3" : combo >= 3 ? "KOMBO ×2" : "";
        setTimeout(next, good ? 180 : 650);
      });
    };
    next();
  });
}

/* --- raqiblar (profillardan) --- */
function rivalsFor(id){
  const me = CL.user() ? CL.user().id : "";
  const ps = (rankCache ? rankCache.ps : []).filter(p => p.id !== me && !(HIDDEN || []).includes(p.id));
  return ps.map(p => ({ name: p.name, t: (p.tour || {})[id] })).filter(x => x.t && x.t.done);
}
const stageSum = (t, upto) => STAGES.slice(0, upto).reduce((a, s) => a + ((t.stages || {})[s.k] || 0), 0);

/* --- ko‘rinish --- */
function viewLiga(){
  const r = roundOf(route.id);
  if (!r) return go({ v:"home" }, false);
  app.innerHTML = `${backBtn("Yo‘l xaritasi")}<div class="thead"><div class="eyebrow">Liga · ${r.lvl} mavsumi</div><h1>${r.k}-raund</h1>
    <p>${r.lessons.map(l => `${l.n}. ${esc(l.title)}`).join(" · ")}</p></div><div id="lg" class="lg"></div>`;
  bindBack();
  const box = $("#lg"), T = RT(r.id);
  if (!roundReady(r)){ box.innerHTML = `<div class="empty"><h3>Raund hali yopiq</h3><p>Avval shu uchta darsni 100% tugating. Keyin raund ochiladi va hamma bir xil sharoitda bellashadi.</p></div>`; return; }
  if (T && T.done) return lgResult(box, r);

  box.innerHTML = `<div class="cardbox lg-rules"><h3>7 bosqich · bitta urinish</h3>
    <ol class="lg-stages">${STAGES.map(s => `<li><b>${s.t}</b><span>${s.s}</span><em>${s.max} gacha</em></li>`).join("")}</ol>
    <h3>Joker ×2</h3><p>Raundda bitta joker bor. Bosqich boshlanishidan oldin qo‘yasiz: shu bosqichda ${JOKER_MIN} va undan ko‘p ball olsangiz, ball ikki barobar bo‘ladi. Kam olsangiz, bosqich 0 ball. Qaysi bosqichga tavakkal qilasiz?</p>
    <h3>Bonuslar</h3><p><b>Halol o‘yin +${BONUS.fair}</b>: raund davomida boshqa oyna yoki ilovaga bir marta ham o‘tmasangiz.<br><b>Toza raund +${BONUS.clean}</b>: hamma bosqichda 60 dan yuqori ball.</p>
    <h3>Qoidalar</h3><p>Har savolga vaqt beriladi, tarjimonga qarashga ulgurmaysiz. Boshqa oynaga o‘tsangiz, o‘sha savol 0 ball va bu hammaga ko‘rinadi. Matnni nusxalash va qo‘yish o‘chirilgan. Boshlaganingizdan keyin raundni qayta o‘ynab bo‘lmaydi. Tinch joy va quloqchin tavsiya qilinadi.</p>
    <h3>Mavsum</h3><p>Raund g‘olibi +100 XP va kubok oladi. O‘rinlar mavsum ochkosini beradi: 1-o‘rin ${PLACE_PTS[0]}, 2-o‘rin ${PLACE_PTS[1]}, 3-o‘rin ${PLACE_PTS[2]}, qatnashgan 1. Har kim raund ballining o‘ndan birini XP sifatida oladi.</p>
    <div id="lgBest"></div>
    <button class="btn primary wide" id="lgGo">Raundni boshlash</button></div>`;
  loadR.then(() => { const b = $("#lgBest"); if (b) b.innerHTML = best(); });
  $("#lgGo").onclick = () => {
    if (!confirm("Raund bir marta o‘ynaladi. Hozir boshlaysizmi?")) return;
    S.tour = S.tour || {}; S.tour[r.id] = { at: new Date().toISOString(), stages:{}, leaves:0, joker:null }; save();
    loadR.then(() => lgRun(box, r));
  };
}

async function lgRun(box, r){
  const T = RT(r.id), Q = lgQuestions(r);
  const leader = rivalsFor(r.id).sort((a, b) => b.t.total - a.t.total)[0];
  LG = { T, onLeave:null };
  box.classList.add("lg-run");
  box.oncontextmenu = e => e.preventDefault();
  try {
    for (let si = 0; si < STAGES.length; si++){
      const st = STAGES[si];
      if (T.stages[st.k] !== undefined) continue;
      if (T.cur === st.k){ T.stages[st.k] = 0; T.cur = null; save(); continue; } // to‘xtab qolgan bosqich
      const mine = stageSum(T, si);
      const race = leader ? `<div class="lg-race"><span>Siz <b>${mine}</b></span><span>${esc(leader.name)} <b>${stageSum(leader.t, si)}</b></span></div>` : "";
      const joker = await new Promise(res => {
        box.innerHTML = `<div class="lg-stage"><div class="eyebrow">${si + 1} / ${STAGES.length} bosqich</div><h2>${st.t}</h2><p>${st.s}</p>${race}
          <button class="btn primary wide" id="sGo">Boshlash</button>
          ${T.joker ? `<p class="fc-tr">Joker ${STAGES.find(s => s.k === T.joker).t} bosqichida ishlatilgan.</p>` : `<button class="btn wide lg-jk" id="sJk">Joker ×2 bilan boshlash</button><p class="fc-tr">${JOKER_MIN}+ ball: ikki barobar. Kam bo‘lsa: 0.</p>`}</div>`;
        $("#sGo").onclick = () => res(false);
        const j = $("#sJk"); if (j) j.onclick = () => res(true);
      });
      if (joker){ T.joker = st.k; }
      T.cur = st.k; save();
      const head = `<div class="qmeta"><span>${st.t}${joker ? ' <span class="pill warn">Joker ×2</span>' : ""}</span><span>${si + 1} / ${STAGES.length}</span></div>`;
      let pts;
      if (st.k === "blitz") pts = (await lgBlitz(box, Q.blitz, head)).pts;
      else {
        const qs = Q[st.k]; let sum = 0;
        for (let i = 0; i < qs.length; i++){
          const res = await lgAsk(box, qs[i], head.replace(`${si + 1} / ${STAGES.length}`, `${i + 1} / ${qs.length}`));
          sum += (100 / qs.length) * res.frac * (0.6 + 0.4 * res.left);
        }
        pts = Math.round(sum);
      }
      const raw = pts;
      if (joker) pts = raw >= JOKER_MIN ? raw * 2 : 0;
      T.stages[st.k] = pts; T.raw = Object.assign(T.raw || {}, { [st.k]: raw }); T.cur = null; save();
      await new Promise(res => {
        box.innerHTML = `<div class="lg-stage"><div class="eyebrow">${st.t}</div><div class="lg-big">${pts}</div>
          <p>${joker ? (raw >= JOKER_MIN ? `Joker o‘ynadi! ${raw} × 2` : `Joker kuydi: ${raw} ball edi, ${JOKER_MIN} kerak edi.`) : "ball"}</p>
          ${leader ? `<div class="lg-race"><span>Siz <b>${stageSum(T, si + 1)}</b></span><span>${esc(leader.name)} <b>${stageSum(leader.t, si + 1)}</b></span></div>` : ""}
          <button class="btn primary wide" id="sNx">${si + 1 < STAGES.length ? "Keyingi bosqich" : "Natija"}</button></div>`;
        $("#sNx").onclick = res;
      });
    }
  } finally { LG = null; box.classList.remove("lg-run"); }
  const sum = STAGES.reduce((a, s) => a + (T.stages[s.k] || 0), 0);
  T.bonus = { fair: (T.leaves || 0) === 0 ? BONUS.fair : 0, clean: STAGES.every(s => ((T.raw || {})[s.k] ?? T.stages[s.k] ?? 0) >= 60) ? BONUS.clean : 0 };
  T.total = sum + T.bonus.fair + T.bonus.clean; T.done = true; T.date = todayStr(); save();
  addXP(Math.round(T.total / 10));
  pushNow().then(() => (CL.configured && CL.user()) ? loadRank() : null).catch(() => null).then(() => lgResult(box, r));
}

/* raund jadvali: o‘rinlar, kubok, bosqich qirollari */
function roundTable(r){
  const me = CL.user() ? CL.user().id : "me";
  const ps = rankCache ? rankCache.ps.filter(p => !(isAdmin() && p.id === me)) : [];
  const players = ps.filter(p => !(HIDDEN || []).includes(p.id));
  const mineT = RT(r.id);
  let rows = ps.map(p => ({ id: p.id, name: p.name, t: p.id === me ? mineT : (p.tour || {})[r.id], hid: (HIDDEN || []).includes(p.id) }));
  if (!rows.find(x => x.id === me) && mineT) rows.push({ id: me, name: S.name || loginName() || "Siz", t: mineT, hid: true });
  const done = rows.filter(x => x.t && x.t.done).sort((a, b) => b.t.total - a.t.total);
  const ranked = done.filter(x => !x.hid);
  const allIn = players.length > 1 && players.every(p => { const t = p.id === me ? mineT : (p.tour || {})[r.id]; return t && t.done; });
  const kings = {};
  if (ranked.length > 1) STAGES.forEach(s => { const b = ranked.slice().sort((a, c) => ((c.t.raw || {})[s.k] ?? c.t.stages[s.k]) - ((a.t.raw || {})[s.k] ?? a.t.stages[s.k]))[0]; if (b && ((b.t.raw || {})[s.k] ?? b.t.stages[s.k]) > 0) (kings[b.id] = kings[b.id] || []).push(s.t); });
  const waiting = players.filter(p => !done.find(x => x.id === p.id)).map(p => p.name);
  return { done, ranked, allIn, kings, waiting, champ: allIn && ranked[0] ? ranked[0] : null };
}

const BOARDS = [["week","Hafta","XP"],["words","So‘zlar","so‘z"],["streak","Seriya","kun"],["lessons","Darslar","dars"],["xp","Jami","XP"]];
let board = "week", rankCache = null;
function adjust(p){
  const wk = weekKey(), prev = addDays(wk, -7);
  const week = p.week_key === wk ? p.week_xp : 0;
  const last = p.week_key === wk ? p.last_week_xp : p.week_key === prev ? p.week_xp : 0;
  const today = p.day === todayStr() && p.today_xp > 0;
  const streakNow = (p.day === todayStr() || p.day === addDays(todayStr(), -1)) ? p.streak : 0;
  return Object.assign({}, p, { week, last, today, streakNow, tour: p.tour || (p.state || {}).tour || {} });
}
async function loadRank(){
  const [ps, ds] = await Promise.all([CL.profiles(), CL.duels()]);

function drawRank(){
  const R = $("#rk"); if (!R || !rankCache) return;
  const me = CL.user().id, { ds, rs } = rankCache;
  const hid = id => HIDDEN.includes(id);
  /* admin reytingda ko‘rinmaydi; yashirin a’zo faqat o‘ziga va adminga ko‘rinadi (buni server ham tekshiradi) */
  const ps = rankCache.ps.filter(p => !(isAdmin() && p.id === me));
  const players = ps.filter(p => !hid(p.id));
  const val = p => ({ week:p.week, words:p.words, streak:p.streakNow, lessons:p.lessons, xp:p.xp })[board];
  const rows = ps.slice().sort((a, b) => val(b) - val(a) || b.xp - a.xp);
  const unit = BOARDS.find(b => b[0] === board)[2];
  const champ = players.slice().sort((a, b) => b.last - a.last)[0];
  const goal = Math.max(1, players.length) * 350, sum = players.reduce((a, p) => a + p.week, 0);
  const todayN = players.filter(p => p.today).length;
  const canDuel = !ROLE && !hid(me);
  const nameOf = id => (ps.find(p => p.id === id) || {}).name || "?";
  const res = id => rs.filter(r => r.duel_id === id);
  const mine = ds.filter(d => d.creator === me || d.opponent === me);
  const duelRow = d => {
    const other = d.creator === me ? d.opponent : d.creator;
    const r = res(d.id), my = r.find(x => x.user_id === me), th = r.find(x => x.user_id === other);
    let status;
    if (!my) status = `<button class="btn sm primary" data-play="${d.id}">O‘ynash</button>`;

  };
  R.innerHTML = `
    ${champ && champ.last > 0 ? `<div class="today" style="margin-top:0"><h2>${I.trophy.replace("<svg", '<svg width="20" height="20" style="vertical-align:-4px"')} O‘tgan hafta g‘olibi: ${esc(champ.name)}</h2><p class="sub">${champ.last} XP. Bu hafta kim uni quvib o‘tadi?</p></div>` : ""}

    <div class="freeze">Bu hafta ${canDuel ? "hammamiz birga" : "guruh birga"} ${goal} XP to‘plashi kerak. Bugun ${todayN} / ${players.length} kishi o‘qidi.</div>
    ${isAdmin() ? `<div class="freeze">Siz adminsiz: reytingda ko‘rinmaysiz, natijalaringiz hech kimga yuborilmaydi.</div>` : ROLE === "observer" ? `<div class="freeze">Siz guruhni ko‘rasiz, lekin guruh sizni ko‘rmaydi. Natijalaringiz faqat sizga ko‘rinadi.</div>` : ""}
    <div class="tabs" style="grid-template-columns:repeat(5,1fr);margin-top:14px;position:static" role="tablist">${BOARDS.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${board === k}" data-b="${k}">${l}</button>`).join("")}</div>
    <ol class="lb">${rows.map((p, i) => `<li class="${p.id === me ? "me" : ""}"><span class="pos">${i + 1}</span><span class="nm"><b>${esc(p.name)}${p.id === me ? " (siz)" : ""}${hid(p.id) ? ' <span class="pill">yashirin</span>' : ""}</b><small>${p.today ? '<span class="kdot k"></span> bugun o‘qidi' : '<span class="kdot"></span> bugun hali o‘qimadi'}${p.a1_passed ? " · A1 ✓" : ""}</small></span><span class="vl">${val(p)}<small>${unit}</small></span></li>`).join("")}</ol>

      ${mine.length ? `<div style="margin-top:10px">${mine.map(duelRow).join("")}</div>` : ""}</div>` : ""}
    <button class="btn ghost wide" id="refresh">Yangilash</button>`;
  $$("[data-b]").forEach(b => b.onclick = () => { board = b.dataset.b; drawRank(); });
  $$("[data-liga]").forEach(b => b.onclick = () => go({ v:"liga", id:b.dataset.liga }));
  $("#refresh").onclick = () => viewRank();
  $$("[data-vs]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try {
      const ls = studied().map(l => l.id);
      const d = await CL.createDuel({ opponent: b.dataset.vs, seed: Math.floor(Math.random() * 2147483647), lessons: ls.length ? ls : [C.lessons[0].id] });
      go({ v:"duel", d });
    } catch(e){ b.disabled = false; toast("Duel yaratilmadi: " + e.message); }
  });
  $$("[data-play]").forEach(b => b.onclick = () => go({ v:"duel", d: ds.find(x => x.id === +b.dataset.play) }));
}
function seeded(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function duelQuestions(d){
  const R = Math.random; Math.random = seeded(d.seed);
  try {
    const ls = (d.lessons || []).map(id => LESSON_ALL[id]).filter(Boolean);
    const pool = (ls.length ? ls : [C.lessons[0]]).flatMap(l => l.W);
    return sample(pool, 10).map((w, i) => qVocab(w, ["ru2uz","uz2ru","listen","ru2uz","uz2ru"][i % 5], pool));
  } finally { Math.random = R; }
}
function viewDuel(){
  const d = route.d;
  const opp = rankCache && (rankCache.ps.find(p => p.id === (d.creator === CL.user().id ? d.opponent : d.creator)) || {}).name;

  const t0 = Date.now();
  runQuiz($("#q"), { questions: duelQuestions(d), onFinish: (sc) => {

    CL.submitResult({ duel_id: d.id, score: sc, ms }).then(() => toast("Natija yuborildi")).catch(e => toast("Natija yuborilmadi: " + e.message));
    return `Vaqt: ${Math.round(ms / 1000)} soniya. Raqibingiz o‘ynagach, natija reytingda chiqadi.`;
  }, after: () => { history_.length = 0; go({ v:"rank" }, false); }, retry: () => toast("Duelni faqat bir marta o‘ynash mumkin.") });
}

    <div class="row"><button class="btn sm" id="exp">Kodni olish</button><button class="btn sm ghost" id="imp">Kodni kiritish</button></div>
    <div class="field" id="codeBox" hidden><textarea id="code" rows="4" spellcheck="false"></textarea><div class="row"><button class="btn sm primary" id="copy">Nusxalash</button><button class="btn sm primary" id="load" hidden>Yuklash</button></div></div></div>
  <div class="section-h"><h2>Ovoz manbalari</h2></div>
  <div class="cardbox prose"><p>Saytdagi ovozlar avvalo haqiqiy odamlarning ochiq litsenziyali yozuvlaridan olinadi:</p>
    <ul><li><a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a> (Vikilug‘at talaffuzlari) va <a href="https://lingualibre.org" target="_blank" rel="noopener">Lingua Libre</a>: so‘zlar, CC BY-SA.</li>
    <li><a href="https://tatoeba.org" target="_blank" rel="noopener">Tatoeba</a>: gaplar, faqat ochiq litsenziyali yozuvlar (CC BY va boshqalar).</li>
    <li><a href="https://youglish.com" target="_blank" rel="noopener">YouGlish</a>: iboralarning YouTube videolaridagi jonli talaffuzi. Kino lavhalari va videolar YouTube pleerida o‘ynaydi, saytga hech narsa nusxalanmaydi: <a href="https://www.youtube.com/t/terms" target="_blank" rel="noopener">YouTube shartlari</a>, <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google maxfiylik siyosati</a>.</li></ul>
    <p>Har bir yozuv ijro etilganda muallifi ekranda ko‘rsatiladi. Jonli yozuv topilmasa, brauzerning sintez ovozi ishlatiladi.</p></div>
  <div class="section-h"><h2>Boshidan boshlash</h2></div>
  <div class="cardbox"><p>Barcha natijalar o‘chiriladi.</p><button class="btn sm bad" id="rst">Taraqqiyotni o‘chirish</button><div id="rstC"></div></div>`;
  $("#nm").onchange = e => { S.name = e.target.value.trim(); save(); };
  $("#gl").onchange = e => { S.goal = +e.target.value; save(); };
  $("#s_live").onchange = e => { S.settings.live = e.target.checked; TIL.audio.setSettings(S.settings); save(); };
  $("#s_slow").onchange = e => { S.settings.slow = e.target.checked; TIL.audio.setSettings(S.settings); save(); };
  $("#s_tr").onchange = e => { S.settings.translit = e.target.checked; save(); };
  $("#toGuide").onclick = () => go({ v:"guide" });
  if ($("#logout")) $("#logout").onclick = async () => { await pushNow(); CL.logout(); location.reload(); };
  if ($("#toLogin")) $("#toLogin").onclick = () => go({ v:"login" });
  $("#toCert").onclick = () => go({ v:"cert" });
  $("#exp").onclick = () => { $("#codeBox").hidden = false; $("#code").value = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); $("#copy").hidden = false; $("#load").hidden = true; $("#code").select(); };
  $("#imp").onclick = () => { $("#codeBox").hidden = false; $("#code").value = ""; $("#copy").hidden = true; $("#load").hidden = false; $("#code").focus(); };
  $("#copy").onclick = () => { const t = $("#code"); navigator.clipboard && navigator.clipboard.writeText(t.value).then(() => toast("Nusxalandi")).catch(() => { t.select(); toast("Belgilandi: nusxalang"); }); if (!navigator.clipboard){ t.select(); } };
  $("#load").onclick = () => { try { const d = JSON.parse(decodeURIComponent(escape(atob($("#code").value.trim())))); S = Object.assign(fresh(), d); save(); toast("Taraqqiyot yuklandi"); viewProfile(); } catch(e){ toast("Kod noto‘g‘ri. To‘liq nusxalanganini tekshiring."); } };
  $("#rst").onclick = () => { $("#rstC").innerHTML = `<p style="margin-top:10px"><b>Rostdan ham hammasini o‘chirasizmi?</b></p><div class="row"><button class="btn sm bad" id="rstY">Ha, o‘chirish</button><button class="btn sm ghost" id="rstN">Yo‘q</button></div>`;
    $("#rstY").onclick = () => { S = fresh(); save(); toast("Taraqqiyot o‘chirildi"); go({ v:"home" }, false); };
    $("#rstN").onclick = () => $("#rstC").innerHTML = ""; };
}

/* ===================== QO‘LLANMA ===================== */
function viewGuide(){
  app.innerHTML = `${backBtn()}<div class="thead"><div class="eyebrow">Qo‘llanma</div><h1>Qanday o‘qish kerak</h1><p>${C.name.replace(/i$/, "i")}da erkin gapirish uchun halol yo‘l xaritasi.</p></div>
  <article class="cardbox prose">
    <h3>Har kuni 30–60 daqiqa</h3>
    <ol><li><b>10 daqiqa:</b> takrorlash (Takrorlash bo‘limi). Buni hech qachon o‘tkazib yubormang.</li>
    <li><b>15–20 daqiqa:</b> yangi dars: so‘zlar, grammatika, dialog.</li>
    <li><b>10 daqiqa:</b> mashq va uy vazifasi.</li>
    <li><b>10–20 daqiqa:</b> tinglash: dialoglarni sekin va tez tinglang, «Kino lavhalari» bo‘limida filmlardagi jonli nutqni eshiting.</li></ol>
    <h3>Darajalar: qayerga qancha vaqt</h3>
    <div class="cmp-wrap"><table class="cefr"><thead><tr><th>Daraja</th><th>Nima qila olasiz</th><th>Taxminan</th></tr></thead><tbody>
      <tr><td><b>A1</b></td><td>Tanishish, do‘kon, yo‘l so‘rash, shifokorga murojaat</td><td>2–3 oy</td></tr>
      <tr><td><b>A2</b></td><td>Ish, ijara, telefonda oddiy suhbat</td><td>+3–4 oy</td></tr>
      <tr><td><b>B1</b></td><td>Mamlakatda mustaqil yashash, ishdagi uchrashuvlar</td><td>+6–9 oy</td></tr>
      <tr><td><b>B2</b></td><td>Filmlar subtitr bilan, erkin suhbat</td><td>+9–12 oy</td></tr>
      <tr><td><b>C1</b></td><td>Filmlarni ona tilidagidek tushunish</td><td>2–3 yil kunlik mashg‘ulot</td></tr></tbody></table></div>
    <p>Bu muddatlar har kuni shug‘ullansangiz to‘g‘ri. Hech bir ilova yolg‘iz o‘zi erkin gapirishga olib chiqmaydi. Kerakli uch narsa: <b>so‘z va grammatika</b> (bu sayt), <b>ko‘p tinglash va o‘qish</b>, <b>jonli suhbat</b>.</p>
    <h3>Do‘stlar bilan mashg‘ulot</h3>
    <ul><li>Haftasiga 1–2 marta uchrashing. Har bir uy vazifasi oxirida 5 ta suhbat savoli bor.</li>
    <li>Rolli o‘yin: darsdagi dialogni rollarga bo‘lib o‘qing, keyin o‘z so‘zlaringiz bilan qayta o‘ynang.</li>
    <li>Kim ko‘proq XP va seriya to‘pladi? Haftalik nazorat natijalarini solishtiring.</li></ul>
    ${C.tips}
  </article>`;
  bindBack();
}

if (CL.configured && !CL.user()) route = { v:"login" };
render();
if (CL.user()) loadRole().then(() => { pushNow(); if (route.v === "rank" && rankCache) drawRank(); });
})();

</script>
