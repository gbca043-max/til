<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TIL: rus tili noldan</title>
<meta name="description" content="O‘zbek tilida so‘zlashuvchilar uchun rus tilini noldan o‘rganish: darslar, kartochkalar, uy vazifalari, imtihonlar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: telefon uchun bitta tor ustun, pastda tab-bar. Ranglar: Registon koshinlari (lojuvard + feruza), mukofotlar uchun za’faron. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --surface-2:#F7F8FC; --ink:#151E38; --muted:#5B6683; --line:#DDE2EE;
  --lapis:#2342A3; --lapis-soft:#E6EBFA; --on-lapis:#FFFFFF;
  --turq:#0F8279; --turq-soft:#DCF2EF;
  --saffron:#B8740F; --saffron-soft:#FBEFD9;
  --bad:#C0392F; --bad-soft:#FBE5E2; --good:#1A7F45; --good-soft:#DFF2E6;
  --g-m:#2F5BD8; --g-f:#C23A6B; --g-n:#2A8A4A; --g-pl:#8A5A12;
  --shadow:0 1px 2px rgba(21,30,56,.06),0 4px 16px rgba(21,30,56,.06);
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1222; --surface:#161D33; --surface-2:#1B2340; --ink:#E6EBF7; --muted:#9AA5C3; --line:#2A3456;
  --lapis:#8EA6FF; --lapis-soft:#22305E; --on-lapis:#0D1222;
  --turq:#45CFC3; --turq-soft:#123D3B;
  --saffron:#F2B54C; --saffron-soft:#3D2E12;
  --bad:#FF8A80; --bad-soft:#41201F; --good:#6DDC98; --good-soft:#163723;
  --g-m:#8FB0FF; --g-f:#FF8DB4; --g-n:#7EDB9C; --g-pl:#E8B865;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1222; --surface:#161D33; --surface-2:#1B2340; --ink:#E6EBF7; --muted:#9AA5C3; --line:#2A3456;
  --lapis:#8EA6FF; --lapis-soft:#22305E; --on-lapis:#0D1222;
  --turq:#45CFC3; --turq-soft:#123D3B;
  --saffron:#F2B54C; --saffron-soft:#3D2E12;
  --bad:#FF8A80; --bad-soft:#41201F; --good:#6DDC98; --good-soft:#163723;
  --g-m:#8FB0FF; --g-f:#FF8DB4; --g-n:#7EDB9C; --g-pl:#E8B865;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--lapis)}
:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
.tile-strip{height:8px;background:
  linear-gradient(135deg,var(--lapis) 25%,transparent 25%) 0 0/16px 16px,
  linear-gradient(225deg,var(--turq) 25%,transparent 25%) 0 0/16px 16px,
  linear-gradient(45deg,var(--turq) 25%,transparent 25%) 0 0/16px 16px,
  linear-gradient(315deg,var(--lapis) 25%,var(--lapis-soft) 25%) 0 0/16px 16px}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 6px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand svg{width:30px;height:30px;color:var(--lapis)}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.02em;display:block;text-align:left}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700;text-align:left;white-space:nowrap}
.langs{display:flex;gap:6px}
.lang{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:800}
.lang[aria-pressed="true"]{background:var(--lapis);border-color:var(--lapis);color:var(--on-lapis)}
.lang.soon{color:var(--muted);border-style:dashed}

/* bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,calc(50% - 320px)) calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;font-weight:800;color:var(--muted);border-radius:10px;position:relative}
.tabbar svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--lapis);background:var(--lapis-soft)}
.tabbar .cnt{position:absolute;top:2px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-block:10px 0}
.stat{background:var(--surface);border-radius:14px;padding:10px;box-shadow:var(--shadow);min-width:0}
.stat .v{font-family:var(--f-display);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.stat .v svg{width:16px;height:16px;flex:none}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.25}
.stat.streak .v{color:var(--saffron)} .stat.xp .v{color:var(--lapis)} .stat.lvl .v{color:var(--turq)} .stat.words .v{color:var(--good)}
.goal{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);margin-top:8px}
.goal .gbar{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.goal .gbar i{display:block;height:100%;background:var(--saffron);border-radius:8px}
.goal b{font-size:13px;white-space:nowrap}
.goal span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.freeze{font-size:12.5px;color:var(--muted);margin-top:6px}

.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-block:26px 10px}
.section-h h2{font-size:15px;font-weight:700}
.section-h span{font-size:13px;color:var(--muted)}

/* today plan */
.today{background:var(--lapis);color:var(--on-lapis);border-radius:18px;padding:16px;margin-top:14px;display:grid;gap:10px}
.today h2{font-size:16px}
.today .sub{font-size:13.5px;opacity:.9;margin:0}
.todo{display:grid;gap:6px}
.todo button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.14);color:inherit;font-weight:700;font-size:14.5px}
:root[data-theme="dark"] .todo button{background:rgba(13,18,34,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .todo button{background:rgba(13,18,34,.18)}}
.todo button .ck{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;flex:none;display:grid;place-items:center;font-size:13px}
.todo button.done{opacity:.7}
.todo button.done .ck{background:currentColor}
.todo button.done .ck::after{content:"";width:8px;height:4px;border-left:2.5px solid var(--lapis);border-bottom:2.5px solid var(--lapis);transform:rotate(-45deg) translate(1px,-1px)}
.todo button small{display:block;font-weight:600;opacity:.85;font-size:12.5px}
.todo button span{min-width:0}

/* level road */
.road{position:relative;display:grid;gap:0;padding-left:4px}
.lvl-h{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.lvl-h .tag{font-family:var(--f-display);font-weight:700;font-size:14px;background:var(--turq);color:var(--surface);border-radius:10px;padding:4px 10px}
.lvl-h.locked .tag{background:var(--line);color:var(--muted)}
.lvl-h b{font-size:14px}
.lvl-h span{font-size:12.5px;color:var(--muted);display:block;font-weight:600}
.stop{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;position:relative;padding:6px 0;background:none;border:0;text-align:left;width:100%}
.stop::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:3px;background:var(--line)}
.stop:first-of-type::before{top:50%}
.stop.last::before{bottom:50%}
.stop .dot{position:relative;z-index:1;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--surface);border:2.5px solid var(--line);color:var(--muted)}
.stop.done .dot{background:var(--good);border-color:var(--good);color:var(--surface)}
.stop.next .dot{background:var(--lapis);border-color:var(--lapis);color:var(--on-lapis);box-shadow:0 0 0 5px var(--lapis-soft)}
.stop.part .dot{border-color:var(--turq);color:var(--turq)}
.stop.exam .dot{border-radius:50%;border-color:var(--saffron);color:var(--saffron)}
.stop.exam.done .dot{background:var(--saffron);color:var(--surface)}
.stop .card{background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.stop.next .card{outline:2px solid var(--lapis)}
.stop h3{font-size:14px;font-weight:700}
.stop .ru{font-size:12.5px;color:var(--muted)}
.stop .meta{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:12px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.stop .chev{width:18px;height:18px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;width:70px}
.bar i{display:block;height:100%;background:var(--turq)}
.locked-box{background:var(--surface-2);border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--muted)}
.locked-box b{color:var(--ink)}
.pill{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--saffron-soft);color:var(--saffron);border-color:transparent}

.cardbox{background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.cardbox h3{font-size:15px;margin-bottom:4px}
.cardbox p{margin:0 0 8px;font-size:14px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:12px 14px;border:1px solid var(--line)}

/* lesson */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font-weight:800;font-size:14px;padding:8px 0 0}
.back svg{width:18px;height:18px}
.thead{margin-block:6px 12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--turq);font-weight:800}
.thead h1{font-size:23px;font-weight:700;margin-top:2px}
.thead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.cando{display:grid;gap:4px;margin:10px 0 0;padding:0;list-style:none;font-size:13.5px}
.cando li{display:flex;gap:8px;align-items:flex-start}
.cando li::before{content:"";flex:none;width:16px;height:16px;margin-top:3px;border-radius:50%;background:var(--turq-soft);box-shadow:inset 0 0 0 4px var(--turq-soft),inset 0 0 0 8px var(--turq)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:var(--surface);padding:4px;border-radius:14px;box-shadow:var(--shadow);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs.t3{grid-template-columns:repeat(3,1fr)}
.tab{border:0;background:none;border-radius:10px;padding:8px 2px;font-size:12px;font-weight:800;color:var(--muted);min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px}
.tab i{font-style:normal;font-size:10px;line-height:1;color:var(--good)}
.tab[aria-selected="true"]{background:var(--lapis-soft);color:var(--lapis)}
.panel{margin-top:16px}

/* gender */
.g-m{color:var(--g-m)} .g-f{color:var(--g-f)} .g-n{color:var(--g-n)} .g-pl{color:var(--g-pl)}
.gtag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;border:1.5px solid currentColor;vertical-align:middle;font-family:var(--f-body);letter-spacing:0}

/* flashcards */
.deckinfo{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:10px;font-variant-numeric:tabular-nums;gap:8px;flex-wrap:wrap}
.fc{perspective:1200px;height:340px;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:10px;border:1.5px solid var(--line);overflow:auto}
.fc-face.back{transform:rotateY(180deg);background:var(--surface-2)}
.fc-word{font-family:var(--f-display);font-size:clamp(24px,7vw,34px);font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.fc-tr{font-size:14px;color:var(--muted);font-weight:700}
.fc-uz{font-size:clamp(20px,6vw,26px);font-weight:800;color:var(--turq)}
.fc-ex{font-size:15.5px;font-weight:700}
.fc-ex i{display:block;color:var(--muted);font-style:normal;font-size:14px;font-weight:500;margin-top:2px}
.fc-hint{font-size:12px;color:var(--muted);font-weight:700}
.box-dots{display:flex;gap:4px}
.box-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.box-dots i.on{background:var(--turq)}
.spk{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 14px;background:var(--lapis-soft);color:var(--lapis);font-weight:800;font-size:14px;text-decoration:none}
.spk svg{width:18px;height:18px;flex:none}
.spk.sm{padding:6px 10px;font-size:12.5px}
.spk.alt{background:var(--turq-soft);color:var(--turq)}
.spk.playing{outline:2px solid var(--turq)}
.spkrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.btn{border:0;border-radius:14px;padding:13px 12px;font-weight:800;font-size:15px;background:var(--surface);box-shadow:var(--shadow);text-decoration:none;color:inherit;display:inline-block;text-align:center}
.btn.primary{background:var(--lapis);color:var(--on-lapis)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.mid{background:var(--saffron-soft);color:var(--saffron)}
.btn.good{background:var(--good-soft);color:var(--good)}
.btn.ghost{background:transparent;box-shadow:none;border:1.5px solid var(--line)}
.btn.wide{width:100%;margin-top:12px}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn small{display:block;font-size:11px;font-weight:700;opacity:.85}
.btn:disabled{opacity:.45;cursor:default}
.empty{text-align:center;background:var(--surface);border-radius:20px;padding:28px 20px;box-shadow:var(--shadow)}
.empty h3{font-size:18px;margin-bottom:6px}
.empty p{color:var(--muted);margin:0 0 6px}

/* questions */
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:800;margin-bottom:8px;font-variant-numeric:tabular-nums}
.qprog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.qprog i{display:block;height:100%;background:var(--lapis);transition:width .3s}
.qcard{background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.qkind{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--turq)}
.qtext{font-size:19px;font-weight:800;margin:6px 0 14px;overflow-wrap:anywhere}
.qtext small{display:block;font-size:14px;color:var(--muted);font-weight:600;margin-top:4px}
.qtext .big{font-family:var(--f-display);font-size:28px;font-weight:700}
.opts{display:grid;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;font-weight:700;font-size:15.5px;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--lapis)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.tin{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:18px;font-weight:700;background:var(--surface-2)}
.tin:focus{border-color:var(--lapis);outline:none}
.tin.right{border-color:var(--good);background:var(--good-soft)} .tin.wrong{border-color:var(--bad);background:var(--bad-soft)}
.built{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;margin-bottom:12px}
.built.right{border-color:var(--good);border-style:solid} .built.wrong{border-color:var(--bad);border-style:solid}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.tok{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;font-weight:700;font-size:15.5px;box-shadow:0 1px 0 var(--line)}
.tok.used{visibility:hidden}
.built .tok{background:var(--lapis-soft);border-color:transparent;color:var(--lapis)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:grid;gap:8px;align-content:start;min-width:0}
.mt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:700;font-size:14.5px;text-align:left;min-height:46px;overflow-wrap:anywhere}
.mt.sel{border-color:var(--lapis);background:var(--lapis-soft)}
.mt.done{border-color:transparent;background:var(--good-soft);color:var(--good);opacity:.7}
.mt.err{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:14.5px}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)} .fb.mid{background:var(--saffron-soft)}
.fb b{display:block} .fb.good b{color:var(--good)} .fb.bad b{color:var(--bad)} .fb.mid b{color:var(--saffron)}
.fb i{font-style:normal;display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.result{text-align:center;background:var(--surface);border-radius:20px;padding:26px 20px;box-shadow:var(--shadow)}
.result .big{font-family:var(--f-display);font-size:46px;font-weight:700;color:var(--lapis);font-variant-numeric:tabular-nums}
.result p{color:var(--muted);margin:4px 0}

/* cyrillic keyboard */
.kbtoggle{margin-top:8px}
.kb{margin-top:10px;display:grid;gap:5px;user-select:none}
.kb .r{display:flex;gap:4px;justify-content:center}
.kb button{flex:1;max-width:44px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 0;font-weight:700;font-size:15px;box-shadow:0 1px 0 var(--line)}
.kb button.w{max-width:none;flex:2;font-size:12.5px}
.kb button:active{background:var(--lapis-soft)}

/* grammar */
.gram{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.gram h3{font-size:18px;margin-bottom:8px}
.gram p{margin:0 0 12px;max-width:65ch}
.gram h4{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--turq);margin:20px 0 8px;font-family:var(--f-body);font-weight:800}
.cmp-wrap{overflow-x:auto}
.cmp{width:100%;border-collapse:collapse;font-size:14.5px}
.cmp th{text-align:left;font-size:12px;color:var(--muted);font-weight:800;padding:6px 8px;border-bottom:1.5px solid var(--line)}
.cmp td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}

table:[["bir rubl","один <mark>рубль</mark>"],["uch rubl","три <mark>рубля</mark>"],["o‘n rubl","десять <mark>рублей</mark>"],["ikki dollar","два <mark>доллара</mark>"],["yuz dollar","сто <mark>долларов</mark>"],["yigirma bir yil","двадцать один <mark>год</mark>"]],
tip:"<b>Esda tuting:</b> 11–14 doim «5» guruhida: одиннадцать рубл<b>ей</b>, двенадцать доллар<b>ов</b>. <br>Yosh ham shunday: 21 <b>год</b>, 22 <b>года</b>, 25 <b>лет</b>.",
mistakes:[["пять рубль","пять рублей","5 dan keyin -ей."],["два рублей","два рубля","2, 3, 4 dan keyin -я."],["Сколько это стоит деньги?","Сколько это стоит?","«стоит» o‘zi narxni bildiradi."]]},
dialog:{scene:"Bozor. Malika olma uchun savdolashyapti.", a:"Продавец", b:"Малика", lines:`b|Здравствуйте! Сколько стоят яблоки?|Assalomu alaykum! Olma necha pul?
a|Сто пятьдесят рублей килограмм.|Kilosi bir yuz ellik rubl.
b|Сто пятьдесят? Ой, это дорого!|Bir yuz ellikmi? Voy, qimmat-ku!
a|Дорого? Попробуйте! Очень вкусные.|Qimmatmi? Tatib ko‘ring! Juda shirin.
b|М-м, вкусно... А сто рублей?|Mm, mazali... Yuz rublga bermaysizmi?
a|Сто двадцать, и всё!|Bir yuz yigirma, vassalom!
b|Ладно. Дайте два килограмма.|Mayli. Ikki kilo bering.
a|Вот, пожалуйста. Двести сорок рублей.|Mana, marhamat. Ikki yuz qirq rubl.
b|Можно картой?|Karta bilan bo‘ladimi?
a|Нет, только наличные.|Yo‘q, faqat naqd.
b|Вот... У меня только тысяча.|Mana... Menda faqat minglik bor.
a|Ох! Ну ладно. Вот сдача: семьсот шестьдесят.|Uh! Mayli endi. Mana qaytim: yetti yuz oltmish.`},

grammar:{title:"Fe’l tuslanishi: ishla-MAN → работа-Ю",
intro:"Yaxshi xabar: rus fe’llari o‘zbek fe’llari kabi <b>shaxsga qarab qo‘shimcha oladi</b>. O‘zbekchada ishla<b>man</b>, ishla<b>san</b>, ishla<b>ydi</b>... Ruschada ham fe’l oxiri o‘zgaradi. -ать bilan tugaydigan fe’llar (работать, делать, знать, читать, думать) bir xil tuslanadi:",
table:[["men ishla<mark>yman</mark>","я работа<mark>ю</mark>"],["sen ishla<mark>ysan</mark>","ты работа<mark>ешь</mark>"],["u ishla<mark>ydi</mark>","он / она работа<mark>ет</mark>"],["biz ishla<mark>ymiz</mark>","мы работа<mark>ем</mark>"],["siz ishla<mark>ysiz</mark>","вы работа<mark>ете</mark>"],["ular ishla<mark>ydi</mark>","они работа<mark>ют</mark>"]],
tip:"<b>Inkor juda oson:</b> o‘zbekchada -ma- qo‘shimchasi (ishla<b>ma</b>yman), ruschada fe’l oldidan <b>не</b>: я <b>не</b> работаю. <br><b>Kasb bilan:</b> «Kim bo‘lib ishlaysiz?» = Кем вы работаете? Javob oddiy: Я врач / Я программист.",
mistakes:[["Я работать в банке.","Я работаю в банке.","Fe’lni shaxsga moslang: я → -ю."],["Он работаю.","Он работает.","он → -ет."],["Я работаю не.","Я не работаю.","не fe’ldan oldin keladi."]]},
dialog:{scene:"To‘y. Bir stolda ikki notanish yigit o‘tiribdi.", a:"Сергей", b:"Бекзод", lines:`a|Привет! Я Сергей. Ты друг Тимура?|Salom! Men Sergeyman. Temurning do‘stimisan?

a|А кем ты работаешь?|Kim bo‘lib ishlaysan?
b|Я программист. Работаю дома.|Dasturchiman. Uyda ishlayman.
a|Дома? Вот это да! Не в офисе?|Uydami? Voy-bo‘! Ofisda emasmi?
b|Нет. Утром кофе, потом работаю. Удобно!|Yo‘q. Ertalab qahva, keyin ishlayman. Qulay!
a|Слушай, а у меня компьютер не работает...|Qara, mening kompyuterim ishlamayapti...
b|Ну вот, опять! А ты кем работаешь?|Ana xolos, yana boshlandi! Sen-chi, kim bo‘lib ishlaysan?
a|Я врач. Работаю в больнице. Много работаю.|Shifokorman. Kasalxonada ishlayman. Ko‘p ishlayman.
b|Врач? Отлично! А у меня спина болит...|Shifokormisan? Zo‘r! Mening belim og‘riyapti...
a|Ха! Понял. Сегодня мы не работаем, да?|Ha-ha! Tushundim. Bugun ishlamaymiz, xo‘pmi?
b|Да! Сегодня мы отдыхаем!|Xo‘p! Bugun dam olamiz!`},

grammar:{title:"Vaqt: soat yetti-DA → В семь часов; -ся = o‘zbekcha -in-",
intro:"O‘zbek tilida vaqt <b>-da</b> qo‘shimchasi bilan: soat yetti<b>da</b>, dushanba <b>kuni</b>. Rus tilida so‘z oldidan <b>в</b> qo‘yiladi: <b>в</b> семь часов, <b>в</b> понедельник. Kunlar oxiri ba’zan o‘zgaradi: среда → в сред<b>у</b>, пятница → в пятниц<b>у</b>, суббота → в суббот<b>у</b> (ayol jinsidagi -а → -у).<br><br><b>-ся qo‘shimchasi</b> o‘zbekchadagi o‘zlik nisbati kabi: yuv<b>in</b>moq = умывать<b>ся</b>, kiy<b>in</b>moq = одевать<b>ся</b>. Harakat o‘zingizga qaratilgan.",
table:[["soat yetti<mark>da</mark>","<mark>в</mark> семь часов"],["dushanba <mark>kuni</mark>","<mark>в</mark> понедельник"],["juma <mark>kuni</mark>","<mark>в</mark> пятниц<mark>у</mark>"],["ertalab / kechqurun","утр<mark>ом</mark> / вечер<mark>ом</mark>"],["yuv<mark>in</mark>aman","умываю<mark>сь</mark>"],["kiy<mark>in</mark>ish","одевать<mark>ся</mark>"]],
tip:"<b>Soat so‘zi ham sonlarga bo‘ysunadi:</b> 1 час, 2–4 час<b>а</b>, 5–12 час<b>ов</b>. Shuning uchun: в два часа, в восемь часов.<br><b>-ся yoki -сь?</b> Undoshdan keyin -ся (одеваться), unlidan keyin -сь (одеваюсь).",
mistakes:[["в утро","утром","ertalab = утром (oldida в yo‘q)."],["в пятница","в пятницу","в + kun: -а → -у."],["Я умываю.","Я умываюсь.","O‘zingizni yuvsangiz, -сь kerak."]]},
dialog:{scene:"Juma kechqurun. Kirill do‘stiga qo‘ng‘iroq qilyapti.", a:"Кирилл", b:"Шахзод", lines:`a|Шахзод, привет! Ты свободен в субботу?|Shahzod, salom! Shanba kuni bo‘shmisan?

grammar:{title:"Bormoq: идти (piyoda) va ехать (transportda); qayerga? → в Москв-У",
intro:"O‘zbek tilida bitta «bormoq» fe’li bor. Rus tilida ikkita: <b>идти</b> (piyoda) va <b>ехать</b> (biror transportda). Ruslar bunga juda e’tibor beradi.<br><br><b>Qayerga?</b> O‘zbekchada <b>-ga</b>: Moskva<b>ga</b>. Ruschada <b>в / на</b> + tushum kelishigi (6-darsdagi -у!): в Москв<b>у</b>, на работ<b>у</b>. Erkak jinsidagi so‘zlar o‘zgarmaydi: в банк, в Ташкент.",
table:[["men (piyoda) boraman","я <mark>иду</mark>, ты идёшь, он идёт, мы идём, вы идёте, они идут"],["men (transportda) boraman","я <mark>еду</mark>, ты едешь, он едет, мы едем, вы едете, они едут"],["Moskva<mark>ga</mark>","<mark>в</mark> Москв<mark>у</mark>"],["ish<mark>ga</mark>","<mark>на</mark> работ<mark>у</mark>"],["Toshkent<mark>ga</mark>","<mark>в</mark> Ташкент"],["Moskva<mark>da</mark> (qayerda?)","в Москв<mark>е</mark>"]],
tip:"<b>Где? va Куда? ni adashtirmang:</b> Где ты? — В Москве (qayerda). Куда ты едешь? — В Москву (qayerga). O‘zbekchada ham ikki xil: -da va -ga.",

dialog:{scene:"Vokzal kassasi. Farhod kechikyapti, poyezd jo‘nashiga besh daqiqa qoldi.", a:"Кассир", b:"Фарход", lines:`b|Здравствуйте! Один билет до Казани. Быстро, пожалуйста!|Assalomu alaykum! Qozongacha bitta chipta. Tezroq, iltimos!
a|Не торопитесь. Куда едете? В Казань?|Shoshmang. Qayerga ketyapsiz? Qozongami?
b|Да, в Казань! Поезд в десять.|Ha, Qozonga! Poyezd soat o‘nda.
a|В десять? Сейчас девять пятьдесят пять!|O‘ndami? Hozir to‘qqizu ellik besh-ku!
b|Ой! Я опаздываю! Туда и обратно, пожалуйста.|Voy! Kechikyapman! Borish-qaytish, iltimos.
a|Ваш паспорт, пожалуйста.|Pasportingiz, iltimos.
b|Паспорт... Паспорт... Где мой паспорт?!|Pasport... Pasport... Pasportim qayerda?!
a|Молодой человек, вот он. У вас в руке.|Yigitcha, mana-ku u. Qo‘lingizda turibdi.
b|Ой, спасибо! Сколько стоит?|Voy, rahmat! Qancha turadi?
a|Пять тысяч рублей. Вот ваш билет.|Besh ming rubl. Mana chiptangiz.
b|Спасибо! А куда идти?|Rahmat! Qayoqqa boray?
a|Не идите, бегите! Направо!|Yurmang, yuguring! O‘ngga!`},

grammar:{title:"Boshim og‘riyapti → У меня болит голова",
intro:"O‘zbek tilida egalik qo‘shimchasini qo‘shamiz: bosh<b>im</b> og‘riyapti. Rus tilida «mening boshim» demaymiz, balki <b>«menda og‘riyapti bosh»</b> deymiz: <b>У меня болит голова</b>.<br>• bitta narsa: <b>болит</b> (голова, зуб, живот)<br>• ko‘plik: <b>болят</b> (глаза, ноги, зубы)<br><br>Bu «у меня» 8-darsdagi «у меня есть» bilan bir xil. Boshqa shaxslar: у него болит..., у ребёнка болит...",
table:[["bosh<mark>im</mark> og‘riyapti","<mark>у меня</mark> болит голова"],["tish<mark>im</mark> og‘riyapti","<mark>у меня</mark> болит зуб"],["ko‘zlar<mark>im</mark> og‘riyapti","<mark>у меня</mark> болят глаза"],["bolaning qorni og‘riyapti","<mark>у ребёнка</mark> болит живот"],["menga dori kerak","<mark>мне нужно</mark> лекарство"]],
tip:"<b>Мне плохо / Мне лучше</b>: o‘zbekchadagi «menga yomon» kabi. Ahvol haqida doim <b>мне</b>: мне холодно (sovuqyapman), мне жарко (isib ketdim).<br><b>Favqulodda raqam:</b> Rossiyada <b>112</b> (yagona qutqaruv xizmati), tez yordam <b>103</b>.",
mistakes:[["Моя голова болит.","У меня болит голова.","Grammatik to‘g‘ri, lekin ruslar «у меня» deydi."],["У меня болит глаза.","У меня болят глаза.","Ko‘plik → болят."],["Я плохо.","Мне плохо.","Ahvol: мне."]]},
dialog:{scene:"Poliklinika. Otabek «hamma yerim og‘riyapti» deb kelgan.", a:"Врач", b:"Отабек", lines:`a|Здравствуйте! Садитесь. Что у вас болит?|Assalomu alaykum! O‘tiring. Qayeringiz og‘riyapti?
b|Доктор, мне очень плохо. Всё болит!|Doktor, ahvolim juda yomon. Hamma yerim og‘riyapti!
a|Всё? А конкретно?|Hamma yeringizmi? Aniqrog‘i?
b|Голова болит. Живот болит. И глаза болят.|Boshim og‘riyapti. Qornim og‘riyapti. Ko‘zlarim ham og‘riyapti.
a|Температура есть?|Isitma bormi?
b|Нет... Тридцать шесть и шесть.|Yo‘q... O‘ttiz olti-yu olti.
a|Кашель? Насморк?|Yo‘tal? Tumov?
b|Нет. Но мне очень плохо!|Yo‘q. Lekin ahvolim juda yomon!
a|Хм. Скажите, а что у вас завтра?|Hmm. Ayting-chi, ertaga nima bor?
b|Завтра? Ну... экзамен. А что?|Ertagami? Ha endi... imtihon. Nima edi?
a|Всё понятно. Вам нужно не лекарство, а учебник!|Hammasi tushunarli. Sizga dori emas, darslik kerak!
b|Ой... Знаете, мне уже лучше.|Voy... Bilasizmi, endi yaxshiroqman.`},

grammar:{title:"Sifatlar jinsga moslashadi: красный, красная, красное, красные",
intro:"O‘zbek tilida sifat o‘zgarmaydi: qizil mashina, qizil ko‘ylak. Rus tilida sifat <b>otning jinsiga</b> moslashadi (2-darsdagi мой/моя/моё kabi):<br>• erkak: <b>-ый / -ий / -ой</b> → красн<b>ый</b> шарф, син<b>ий</b> костюм<br>• ayol: <b>-ая / -яя</b> → красн<b>ая</b> куртка, син<b>яя</b> куртка<br>• o‘rta: <b>-ое / -ее</b> → красн<b>ое</b> платье, син<b>ее</b> небо<br>• ko‘plik: <b>-ые / -ие</b> → красн<b>ые</b> брюки",
table:[["qizil kurtka","красн<mark>ая</mark> куртка"],["qizil ko‘ylak (ayollar)","красн<mark>ое</mark> платье"],["qora palto","чёрн<mark>ое</mark> пальто"],["oq ko‘ylak (erkaklar)","бел<mark>ая</mark> рубашка"],["ko‘k shim","син<mark>ие</mark> брюки"]],

dialog:{scene:"Kiyim do‘koni. Tashqarida qahraton qish, Nigora esa chiroyli kurtka istaydi.", a:"Продавец", b:"Нигора", lines:`b|Здравствуйте! Мне нужна тёплая куртка.|Assalomu alaykum! Menga issiq kurtka kerak.

b|Отлично! Всё красное!|Zo‘r! Hammasi qizil bo‘ladi!
a|Ну... Зимой вас точно все видят!|Hmm... Qishda sizni hamma uzoqdan ko‘radi!`},

grammar:{title:"der, die, das: nemis tilida so‘zlarning jinsi bor",
intro:"O‘zbek tilida otlarning jinsi yo‘q: ota, ona, bola. Nemis tilida esa har bir ot oldida <b>artikl</b> turadi:<br>• <b>der</b> — erkak jinsi: der Vater, der Sohn<br>• <b>die</b> — ayol jinsi: die Mutter, die Familie<br>• <b>das</b> — o‘rta jins: das Kind, das Foto<br>• ko‘plik doim <b>die</b>: die Eltern, die Kinder<br>Odamlarda jins tabiiy, lekin narsalarda ko‘pincha mantiq yo‘q. Shuning uchun har bir otni <b>artikli bilan</b> yodlang, xuddi ism va familiya kabi.<br><br><b>«mening»</b> ham artiklga qaraydi: der, das → <b>mein</b>; die va ko‘plik → <b>mein<mark>e</mark></b>.",
table:[["otam","<mark>der</mark> Vater → <mark>mein</mark> Vater"],["onam","<mark>die</mark> Mutter → <mark>meine</mark> Mutter"],["bolam","<mark>das</mark> Kind → <mark>mein</mark> Kind"],["ota-onam","<mark>die</mark> Eltern → <mark>meine</mark> Eltern"],["mening ikkita farzandim <mark>bor</mark>","Ich <mark>habe</mark> zwei Kinder"],["opang <mark>bor</mark>mi?","<mark>Hast</mark> du eine Schwester?"]],
tip:"<b>Yodlash usuli:</b> kartochkalarga der so‘zlarni ko‘k, die so‘zlarni qizil, das so‘zlarni yashil rangda yozing. Ko‘p hollarda <b>-e</b> bilan tugaydigan so‘zlar <b>die</b> (die Tante, die Familie, die Schule).<br><b>haben</b> (bor bo‘lmoq): ich habe, du hast, er/sie hat, wir haben, ihr habt, sie/Sie haben. O‘zbekcha «mening akam <b>bor</b>» → nemischa «men akaga <b>egaman</b>»: Ich habe einen Bruder. (der so‘zlar bu yerda <b>einen</b> bo‘ladi, buni 6-darsda o‘rganamiz.)",
mistakes:[["meine Vater","mein Vater","der Vater: mein (-e qo‘shilmaydi)."],["mein Mutter","meine Mutter","die Mutter: meine."],["Ich bin 25 Jahre.","Ich bin 25 Jahre alt.","Yoshni aytganda oxirida alt keladi."]]},
dialog:{scene:"Tushlik payti. Dilnoza hamkasbi Jonasga telefondagi oilaviy suratni ko‘rsatyapti.", a:"Jonas", b:"Dilnoza", lines:`b|Jonas, schau mal! Das ist meine Familie.|Jonas, qara! Bu mening oilam.

b|Nein! Das ist meine Mutter.|Yo‘q! Bu mening onam.

b|Danke! Und das ist mein Vater.|Rahmat! Bu esa otam.
a|Und die Kinder hier? Deine Geschwister?|Bu bolalar-chi? Uka-singillaringmi?
b|Das ist mein Bruder. Und das ist mein Sohn.|Bu ukam. Bu esa o‘g‘lim.
a|Moment mal... Dein Sohn? Du bist verheiratet?|Shoshma... O‘g‘lingmi? Sen turmush qurganmisan?

a|Und wie alt ist dein Sohn?|O‘g‘ling necha yoshda?

a|Tja, wie meine Schwester. Und sie ist dreißig!|E, xuddi opamga o‘xshar ekan. Opam esa o‘ttiz yoshda!`},

grammar:{title:"21 = einundzwanzig («bir va yigirma») va ko‘plik",
intro:"O‘zbek tilida «yigirma bir» deymiz: avval o‘nlik, keyin birlik. Nemis tilida 21 dan 99 gacha <b>teskari</b>: avval birlik, keyin <b>und</b> (va), keyin o‘nlik: <b>einundzwanzig</b> = «bir va yigirma». Hammasi bitta so‘z bo‘lib yoziladi.<br><br><b>Ko‘plik:</b> o‘zbek tilida hamma so‘zga <b>-lar</b> qo‘shiladi. Nemis tilida bir nechta yo‘l bor, shuning uchun otni ko‘pligi bilan birga yodlang:<br>• <b>-e</b>: der Tag → die Tag<b>e</b><br>• <b>-(e)n</b>: die Frau → die Frau<b>en</b><br>• <b>-er</b>: das Kind → die Kind<b>er</b><br>• <b>-s</b>: das Foto → die Foto<b>s</b><br>• o‘zgarmaydi: der Lehrer → die Lehrer<br>Ko‘plikning artikli doim <b>die</b>.<br><br><b>Diqqat:</b> o‘zbek tilida sondan keyin birlik keladi (ikki bola), nemis tilida esa <b>ko‘plik</b>: zwei Kind<b>er</b>.",
table:[["yigirma bir","<mark>einund</mark>zwanzig (1 + 20)"],["o‘ttiz besh","<mark>fünfund</mark>dreißig (5 + 30)"],["ikki bola","zwei Kind<mark>er</mark>"],["uch kun","drei Tag<mark>e</mark>"],["ikki ayol","zwei Frau<mark>en</mark>"],["besh yevro","fünf <mark>Euro</mark> (o‘zgarmaydi)"]],
tip:"<b>Istisnolar:</b> sech<b>zehn</b> (s tushadi), sieb<b>zehn</b> (en tushadi), drei<b>ßig</b> (ß bilan), lekin ein<b>und</b>zwanzig (eins emas). <br><b>Narx:</b> 2,50 € = zwei Euro fünfzig. Euro va Cent ko‘plikda o‘zgarmaydi. <br><b>Wie viel?</b> narx va sanalmaydigan narsalar uchun, <b>wie viele?</b> sanaladigan narsalar uchun: Wie viele Kinder?",

grammar:{title:"Fe’l tuslanishi: yasha-YMAN → wohn-E",
intro:"Yaxshi xabar: nemis fe’llari ham o‘zbek fe’llari kabi <b>shaxsga qarab qo‘shimcha oladi</b>. O‘zbekchada yasha<b>yman</b>, yasha<b>ysan</b>, yasha<b>ydi</b>... Nemis tilida avval <b>negizni</b> topamiz: fe’ldan <b>-en</b> ni olib tashlaymiz (wohn-en → wohn), keyin qo‘shimcha qo‘shamiz: <b>-e, -st, -t, -en, -t, -en</b>.",
table:[["men yasha<mark>yman</mark>","ich wohn<mark>e</mark>"],["sen yasha<mark>ysan</mark>","du wohn<mark>st</mark>"],["u yasha<mark>ydi</mark>","er / sie wohn<mark>t</mark>"],["biz yasha<mark>ymiz</mark>","wir wohn<mark>en</mark>"],["sizlar yasha<mark>ysizlar</mark>","ihr wohn<mark>t</mark>"],["ular yasha<mark>ydi</mark> / Siz yasha<mark>ysiz</mark>","sie / Sie wohn<mark>en</mark>"]],
tip:"<b>arbeiten:</b> negiz -t bilan tugasa, talaffuz oson bo‘lishi uchun <b>e</b> qo‘shiladi: du arbeit<b>e</b>st, er arbeit<b>e</b>t, ihr arbeit<b>e</b>t.<br><b>Kasb:</b> o‘zbekchadagidek artiklsiz: Men o‘qituvchiman = Ich bin Lehrer. Ayol uchun <b>-in</b>: Lehrer → Lehrer<b>in</b>, Arzt → Ärzt<b>in</b>, Koch → Köch<b>in</b> (ba’zan umlaut qo‘shiladi). «... bo‘lib ishlayman» = Ich arbeite <b>als</b> Fahrer.<br><b>Inkor:</b> o‘zbekchada -ma- fe’l ichida (ishla<b>ma</b>yman), nemischada <b>nicht</b> fe’ldan keyin: Ich arbeite <b>nicht</b>.",
mistakes:[["Ich bin ein Lehrer.","Ich bin Lehrer.","Kasbni aytganda artikl ishlatilmaydi."],["Er arbeitt.","Er arbeitet.","Negiz -t bilan tugasa, -et qo‘shiladi."],["Sie ist Lehrer.","Sie ist Lehrerin.","Ayol uchun -in qo‘shimchasi."]]},
dialog:{scene:"Gamburgda qo‘shnining tug‘ilgan kuni. Bekzod Thomas bilan endi tanishdi.", a:"Thomas", b:"Bekzod", lines:`a|Und, Bekzod? Was bist du von Beruf?|Xo‘sh, Bekzod, kasbing nima?
b|Ich bin Programmierer.|Men dasturchiman.
a|Echt? Wo arbeitest du?|Rostdanmi? Qayerda ishlaysan?
b|Tja... im Moment nicht. Ich suche Arbeit.|E... hozircha hech qayerda. Ish qidiryapman.
a|Ach so. Aber du sprichst schon gut Deutsch!|Shunaqami. Lekin nemischani yaxshi gapirasan-ku!
b|Danke, ich lerne viel. Und was machst du?|Rahmat, ko‘p o‘qiyapman. Sen-chi, nima ish qilasan?
a|Ich bin Chef. Ich habe eine Firma.|Men boshliqman. O‘z firmam bor.
b|Oh, interessant! Was macht die Firma?|Voy, qiziq! Firma nima bilan shug‘ullanadi?
a|Software. Und wir suchen... einen Programmierer!|Dasturiy ta’minot. Va biz... dasturchi qidiryapmiz!
b|Moment mal... Ist das ein Witz?|Shoshma... Hazillashyapsanmi?
a|Nein! Komm am Montag ins Büro!|Yo‘q! Dushanba kuni ofisga kel!
b|Super! Äh... und wo ist das Büro?|Zo‘r! Ee... ofis qayerda o‘zi?`},

grammar:{title:"Ich stehe um 7 Uhr AUF: fe’l bo‘lagi gap oxiriga ketadi",
intro:"<b>1. Fe’l doim 2-o‘rinda.</b> O‘zbek tilida fe’l gap oxirida turadi. Nemis tilida darak gapda fe’l doim <b>ikkinchi</b> o‘rinda. Agar gap vaqt bilan boshlansa, ega fe’ldan keyinga o‘tadi: Ich arbeite am Montag → <b>Am Montag arbeite ich.</b><br><br><b>2. Ajraladigan fe’llar.</b> aufstehen = <b>auf</b> + stehen. Hozirgi zamonda old qo‘shimcha (auf, an, ein, fern) <b>gap oxiriga</b> ketadi. Bu o‘zbek tiliga o‘xshaydi: o‘zbekchada ham fe’l oxirida: «Men soat yettida o‘rnimdan <b>turaman</b>» → Ich stehe um 7 Uhr <b>auf</b>.<br><br><b>3. Vaqt:</b> soat ...da = <b>um</b> ... Uhr; hafta kuni va kun qismi = <b>am</b>: am Montag, am Abend.",
table:[["Men dushanba kuni ishlayman","Ich arbeite <mark>am</mark> Montag"],["Dushanba kuni men ishlayman","<mark>Am Montag</mark> <mark>arbeite</mark> ich"],["soat sakkiz<mark>da</mark>","<mark>um</mark> acht Uhr"],["soat sakkiz yarim (8:30)","<mark>halb neun</mark>"],["Soat yettida <mark>turaman</mark>","Ich <mark>stehe</mark> um 7 Uhr <mark>auf</mark>"],["Kechqurun televizor <mark>ko‘raman</mark>","Am Abend <mark>sehe</mark> ich <mark>fern</mark>"]],
tip:"<b>halb</b> keyingi soatga qarab aytiladi: halb neun = «to‘qqizgacha yarim» = 8:30. Yana: Viertel nach acht = 8:15, Viertel vor neun = 8:45.<br><b>Diqqat:</b> ba’zi fe’llar tuslanganda o‘zgaradi: er f<b>ä</b>ngt an, er s<b>ie</b>ht fern, er schl<b>ä</b>ft, er f<b>ä</b>hrt.<br><b>morgen</b> (kichik harf) = ertaga, <b>der Morgen</b> (katta harf) = tong.",
mistakes:[["Am Montag ich arbeite.","Am Montag arbeite ich.","Fe’l doim 2-o‘rinda."],["Ich aufstehe um 7 Uhr.","Ich stehe um 7 Uhr auf.","Ajraladigan old qo‘shimcha gap oxiriga ketadi."],["Es ist halb acht. (8:30)","Es ist halb neun. (8:30)","halb = keyingi soatgacha yarim."]]},

grammar:{title:"Ich möchte EINEN Tee: faqat der so‘zlar o‘zgaradi",
intro:"O‘zbek tilida «nimani?» savoliga javob beruvchi so‘zga <b>-ni</b> qo‘shiladi: choy<b>ni</b> ichaman. Nemis tilida ham shunday holat bor (Akkusativ). Yaxshi xabar: o‘zgarish faqat <b>erkak jinsidagi (der)</b> so‘zlarda ko‘rinadi:<br>• der → <b>den</b>, ein → <b>einen</b>, kein → <b>keinen</b><br>• die, das va ko‘plik <b>o‘zgarmaydi</b>: eine Suppe, ein Wasser.<br><br>Buyurtma berishda uchta tayyor ibora: <b>Ich möchte...</b> (xohlayman), <b>Ich hätte gern...</b> (bersangiz, eng xushmuomala), <b>Ich nehme...</b> (olaman). Ulardan keyin doim shu shakl keladi.<br><br><b>kein</b> = otning inkori («...yo‘q, ...emas»): Ich esse <b>kein</b> Fleisch.",
table:[["bitta choy xohlayman (der Tee)","Ich möchte <mark>einen</mark> Tee"],["bitta sho‘rva olaman (die Suppe)","Ich nehme <mark>eine</mark> Suppe"],["bitta suv bersangiz (das Wasser)","Ich hätte gern <mark>ein</mark> Wasser"],["qahva<mark>ni</mark> olaman","Ich nehme <mark>den</mark> Kaffee"],["shakar xohlamayman","Ich möchte <mark>keinen</mark> Zucker"],["go‘sht yemayman","Ich esse <mark>kein</mark> Fleisch"]],
tip:"<b>möchten tuslanishi:</b> ich möchte, du möchtest, er/sie möcht<b>e</b> (-t yo‘q!), wir möchten, ihr möchtet, sie/Sie möchten.<br><b>Kafeda:</b> hisobni so‘rash uchun <b>Die Rechnung, bitte!</b> yoki <b>Ich möchte bezahlen.</b> Ofitsiant ko‘pincha so‘raydi: <b>Zusammen oder getrennt?</b> (hammasini birga yoki alohida-alohida to‘laysizmi?). Germaniyada odatda 5–10% choychaqa (Trinkgeld) qoldiriladi.",

grammar:{title:"Qayerda? bank-DA → in der Bank; Qayerga? vokzal-GA → zum Bahnhof",
intro:"O‘zbek tilida joyni qo‘shimcha bilan aytamiz: bank<b>da</b>, vokzal<b>ga</b>. Nemis tilida qo‘shimcha o‘rniga <b>old ko‘makchi</b> (in, an, zu, neben) ishlatiladi, artikl esa o‘zgaradi (Dativ):<br>• <b>der</b> → <b>dem</b>, <b>das</b> → <b>dem</b>, <b>die</b> → <b>der</b><br><br>Ko‘pincha ular qo‘shilib ketadi:<br>• in + dem = <b>im</b> (im Hotel, im Zentrum)<br>• an + dem = <b>am</b> (am Bahnhof, am Marktplatz)<br>• zu + dem = <b>zum</b> (zum Bahnhof), zu + der = <b>zur</b> (zur Post)<br><br><b>Qayerda?</b> → in, an, neben. <b>Qayerga?</b> (odam yoki bino oldiga) → zu: zum / zur.",
table:[["bank<mark>da</mark>","<mark>in der</mark> Bank"],["mehmonxona<mark>da</mark>","<mark>im</mark> Hotel (in dem)"],["vokzal <mark>yonida</mark>","<mark>am</mark> Bahnhof (an dem)"],["vokzal<mark>ga</mark>","<mark>zum</mark> Bahnhof (zu dem)"],["pochta<mark>ga</mark>","<mark>zur</mark> Post (zu der)"],["bankning <mark>yonida</mark>","<mark>neben der</mark> Bank"]],
tip:"<b>Hurmat bilan buyruq:</b> fe’l birinchi, keyin Sie: <b>Gehen Sie</b> geradeaus! <b>Rufen Sie</b> die Polizei! O‘zbekchadagi «yuring», «chaqiring» shakliga mos keladi. <br><b>Yo‘l so‘rashning eng oson yo‘li:</b> Entschuldigung, wo ist ...? yoki Wie komme ich zum / zur ...? Artiklni bilmasangiz, shunchaki «Entschuldigung, Bahnhof?» desangiz ham tushunishadi.",
mistakes:[["Wie komme ich zu Bahnhof?","Wie komme ich zum Bahnhof?","der Bahnhof → zu dem = zum."],["Ich bin in Apotheke.","Ich bin in der Apotheke.","Artikl tushib qolmaydi: die → in der."],["Sie gehen geradeaus, bitte!","Gehen Sie bitte geradeaus!","Buyruqda fe’l birinchi turadi."]]},
dialog:{scene:"Myunxen ko‘chasi. Aziz dorixona qidiryapti va yo‘lovchi ayoldan so‘raydi.", a:"Aziz", b:"Frau Becker", lines:`a|Entschuldigung! Ist hier in der Nähe eine Apotheke?|Kechirasiz! Shu atrofda dorixona bormi?
b|Eine Apotheke? Hmm... Ja, am Bahnhof.|Dorixona? Hmm... Ha, vokzal yonida.
a|Und wie komme ich zum Bahnhof?|Vokzalga qanday boraman?
b|Gehen Sie hier geradeaus. Dann an der Ampel links.|Shu yerdan to‘g‘riga yuring. Keyin svetoforda chapga.
a|Geradeaus, links... Okay.|To‘g‘riga, chapga... Xo‘p.
b|Dann rechts. Die Apotheke ist neben der Bank.|Keyin o‘ngga. Dorixona bankning yonida.
a|Moment, bitte. Geradeaus, links, rechts...|Bir daqiqa. To‘g‘riga, chapga, o‘ngga...
b|Oder... Oh! Moment mal!|Yoki... Voy! Shoshing!
a|Was ist los?|Nima bo‘ldi?
b|Sehen Sie dort? Gegenüber! Das ist eine Apotheke!|Anavini ko‘ryapsizmi? Ro‘parada! Ana dorixona!
a|Ach, wirklich! Direkt hier! Danke schön!|Voy, rostdan! Shundoqqina shu yerda ekan! Katta rahmat!
b|Bitte! Tja... ich brauche eine Brille.|Arzimaydi! Ha-a... menga ko‘zoynak kerak ekan.`},

grammar:{title:"Bor → es gibt einen / eine / ein; yo‘q → kein",
intro:"O‘zbek tilida «Kvartirada balkon <b>bor</b>» deymiz. Nemis tilida buning uchun <b>es gibt</b> ishlatiladi: <b>Es gibt</b> einen Balkon. Savolda tartib almashadi: <b>Gibt es</b> einen Balkon?<br><br>es gibt dan keyin ot <b>Akkusativ</b>da bo‘ladi. Faqat erkak jinsidagi (der) so‘zlar o‘zgaradi:<br>• der → ein → <b>einen</b>: einen Balkon, einen Aufzug<br>• die → <b>eine</b> (o‘zgarmaydi): eine Küche<br>• das → <b>ein</b> (o‘zgarmaydi): ein Bad<br><br><b>Yo‘q</b> bo‘lsa, ein o‘rniga <b>kein</b>: keinen Balkon, keine Waschmaschine, kein Bad.",
table:[["balkon <mark>bor</mark>","<mark>es gibt einen</mark> Balkon"],["kir yuvish mashinasi <mark>bor</mark>","es gibt <mark>eine</mark> Waschmaschine"],["vannaxona <mark>bor</mark>","es gibt <mark>ein</mark> Bad"],["lift <mark>yo‘q</mark>","es gibt <mark>keinen</mark> Aufzug"],["lift <mark>bormi</mark>?","<mark>gibt es</mark> einen Aufzug?"],["kvartira <mark>katta</mark>","die Wohnung <mark>ist groß</mark>"]],
tip:"<b>Sifat ist dan keyin o‘zgarmaydi</b>, xuddi o‘zbekchadagi kabi: Die Wohnung ist groß. Das Zimmer ist groß. Die Zimmer sind groß. <br><b>Qavatlar:</b> Germaniyada pastki qavat <b>das Erdgeschoss</b> deyiladi, shuning uchun <b>erster Stock</b> bizdagi 2-qavat. <br><b>Kaltmiete / Warmmiete:</b> warm = kommunal to‘lovlar (isitish, suv) bilan birga.",
mistakes:[["Es gibt ein Balkon.","Es gibt einen Balkon.","der Balkon → Akkusativ: einen."],["Es gibt nicht einen Aufzug.","Es gibt keinen Aufzug.","Otni inkor qilish: kein."],["Die Wohnung ist große.","Die Wohnung ist groß.","ist dan keyin sifat qo‘shimchasiz."]]},
dialog:{scene:"Dilshod e’londagi kvartira bo‘yicha uy egasiga qo‘ng‘iroq qilyapti.", a:"Dilshod", b:"Frau Schmidt", lines:`b|Schmidt, hallo?|Allo, Shmidt eshitaman.
a|Guten Tag! Ist die Wohnung noch frei?|Assalomu alaykum! Kvartira hali bo‘shmi?
b|Ja, noch frei. Zwei Zimmer, Küche, Bad.|Ha, hali bo‘sh. Ikki xona, oshxona, hammom.
a|Gibt es einen Balkon?|Balkon bormi?
b|Ja! Und die Küche ist neu.|Ha! Oshxona ham yangi.
a|Super! Und wie hoch ist die Miete?|Zo‘r! Ijara haqi qancha?
b|Vierhundert Euro, warm.|To‘rt yuz yevro, kommunal xizmatlar bilan.
a|Nur vierhundert? Echt? Das ist aber billig!|Atigi to‘rt yuz? Rostdanmi? Juda arzon-ku!
b|Na ja... die Wohnung ist im sechsten Stock.|E-e... kvartira oltinchi qavatda.
a|Kein Problem. Es gibt doch einen Aufzug, oder?|Muammo emas. Lift bor-ku, to‘g‘rimi?
b|Tja... nein. Es gibt keinen Aufzug.|Ha-a... yo‘q. Lift yo‘q.
a|Oh nein! Und mein Sofa?|Voy! Unda divanim nima bo‘ladi?`},

grammar:{title:"Avtobus-DA → mit dem Bus; fahren → du fährst",
intro:"O‘zbek tilida transportni <b>-da</b> bilan aytamiz: avtobus<b>da</b>, metro<b>da</b>. Nemis tilida <b>mit</b> («bilan») + Dativ ishlatiladi. Artikl 7-darsdagidek o‘zgaradi:<br>• der / das → <b>dem</b>: mit dem Bus, mit dem Auto<br>• die → <b>der</b>: mit der U-Bahn, mit der Straßenbahn<br><br><b>fahren</b> va <b>nehmen</b> fe’llari du va er/sie/es shaklida o‘zakdagi unlini o‘zgartiradi:<br>• fahren: du f<b>ä</b>hrst, er f<b>ä</b>hrt<br>• nehmen: du n<b>imm</b>st, er n<b>imm</b>t",

tip:"<b>gehen yoki fahren?</b> gehen = piyoda, fahren = transportda: Ich <b>gehe</b> zu Fuß. Ich <b>fahre</b> mit dem Bus. <br><b>Shahar va mamlakatga:</b> <b>nach</b> + nom: nach Berlin, nach Usbekistan. <br><b>Ajraladigan fe’llar:</b> umsteigen, aussteigen: oldidagi qism gap oxiriga ketadi: Ich <b>steige</b> hier <b>aus</b>.",

grammar:{title:"Modal fe’llar: Ich muss zum Arzt GEHEN — asosiy fe’l oxirida",
intro:"O‘zbek tilida fe’l gap oxirida turadi: «Men shifokorga <b>borishim kerak</b>». Nemis tilida ham shunga o‘xshash: modal fe’l (<b>müssen</b> kerak, <b>können</b> olmoq, <b>dürfen</b> mumkin) ikkinchi o‘rinda, asosiy fe’l esa noaniq shaklda <b>gap oxirida</b>:<br>Ich <b>muss</b> heute zum Arzt <b>gehen</b>.<br><br>Tuslanishi:<br>• müssen: ich <b>muss</b>, du musst, er <b>muss</b>, wir müssen, Sie müssen<br>• können: ich <b>kann</b>, du kannst, er <b>kann</b>, wir können, Sie können<br>• dürfen: ich <b>darf</b>, du darfst, er <b>darf</b>, wir dürfen, Sie dürfen<br><br><b>Og‘riq haqida:</b> Ich habe Kopf<b>schmerzen</b> yoki Mein Kopf <b>tut weh</b>.",
table:[["Shifokorga <mark>borishim kerak</mark>.","Ich <mark>muss</mark> zum Arzt <mark>gehen</mark>."],["Bugun <mark>ishlay olmayman</mark>.","Ich <mark>kann</mark> heute nicht <mark>arbeiten</mark>."],["Sport <mark>qilsam bo‘ladimi</mark>?","<mark>Darf</mark> ich Sport <mark>machen</mark>?"],["U yotib <mark>turishi kerak</mark>.","Er <mark>muss</mark> im Bett <mark>bleiben</mark>."],["bosh<mark>im</mark> og‘riyapti","<mark>Ich habe</mark> Kopf<mark>schmerzen</mark>. / Mein Kopf <mark>tut weh</mark>."],["ko‘zlar<mark>im</mark> og‘riyapti","Meine Augen <mark>tun weh</mark>."]],
tip:"<b>ich = er:</b> modal fe’llarda ich va er/sie shakli bir xil, -t yo‘q: ich muss, er muss; ich kann, er kann. <br><b>Germaniyada:</b> shifokorga avval <b>Termin</b> olinadi (telefon yoki internet orqali), qabulda <b>Versichertenkarte</b> (sug‘urta kartasi) so‘raladi. Favqulodda holat: <b>112</b>. Kechasi va dam olish kunlari navbatchi shifokor: <b>116 117</b>.",
mistakes:[["Ich muss gehen zum Arzt.","Ich muss zum Arzt gehen.","Asosiy fe’l oxirida, o‘zbekchadagi kabi."],["Er musst arbeiten.","Er muss arbeiten.","er/sie: qo‘shimchasiz, ich kabi."],["Meine Augen tut weh.","Meine Augen tun weh.","Ko‘plik → tun."]]},
dialog:{scene:"Shifokor qabulida. Otabek shamollagan, lekin shanba kuni muhim futbol o‘yini bor.", a:"Frau Dr. Klein", b:"Otabek", lines:`a|Guten Tag, Herr Karimov. Was fehlt Ihnen?|Assalomu alaykum, Karimov janoblari. Sizni nima bezovta qilyapti?
b|Ach, alles! Der Kopf, der Hals, der Rücken...|Voy, hamma joyim! Boshim, tomog‘im, belim...
a|Haben Sie auch Fieber?|Isitmangiz ham bormi?
b|Ja, achtunddreißig Grad. Und Husten.|Ha, o‘ttiz sakkiz daraja. Yo‘tal ham bor.
a|Eine Erkältung. Sie müssen drei Tage im Bett bleiben.|Shamollash. Uch kun yotib dam olishingiz kerak.
b|Drei Tage? Kann ich nicht arbeiten?|Uch kun? Ishlay olmaymanmi?
a|Nein, das dürfen Sie nicht.|Yo‘q, mumkin emas.
b|Kein Problem! Aber am Samstag spiele ich Fußball.|Muammo yo‘q! Lekin shanba kuni futbol o‘ynayman.
a|Fußball? Auf keinen Fall! Sie sind krank!|Futbol? Aslo mumkin emas! Siz kasalsiz!
b|Aber Frau Doktor, das ist das Finale!|Lekin doktor, bu final-ku!
a|Nein. Aber fernsehen dürfen Sie. Gute Besserung!|Yo‘q. Lekin televizorda ko‘rishingiz mumkin. Tezroq tuzaling!
b|Oh nein... Na gut. Danke.|Eh... Mayli. Rahmat.`},

grammar:{title:"Haydovchi BO‘LIB, akam BILAN → водител-ЕМ, с брат-ОМ (vositachi kelishik)",
intro:"O‘zbek tilida «haydovchi <b>bo‘lib</b> ishlayman», «akam <b>bilan</b> ishlayman» deymiz. Rus tilida ikkalasi uchun bitta kelishik bor: <b>vositachi kelishik</b> (творительный падеж). Savollari: <b>кем?</b> (kim bo‘lib?) va <b>с кем? с чем?</b> (kim bilan? nima bilan?).<br><br><b>Oxirlar:</b><br>• erkak va o‘rta jins → <b>-ом / -ем</b>: опыт → с опыт<b>ом</b>, водитель → водител<b>ем</b><br>• ayol jinsi → <b>-ой / -ей</b>: сестра → с сестр<b>ой</b>, уборщица → уборщиц<b>ей</b><br>• ko‘plik → <b>-ами / -ями</b>: с друзь<b>ями</b>, с деть<b>ми</b> (istisno)<br><br>Bu kelishik <b>работать, быть, стать, заниматься, интересоваться, пользоваться</b> fe’llaridan keyin ham keladi.",
table:[["haydovchi <mark>bo‘lib</mark> ishlayman","работаю водител<mark>ем</mark>"],["farrosh <mark>bo‘lib</mark> ishlaydi (ayol)","работает уборщиц<mark>ей</mark>"],["tajriba <mark>bilan</mark>","<mark>с</mark> опыт<mark>ом</mark>"],["opam <mark>bilan</mark>","<mark>с</mark> сестр<mark>ой</mark>"],["do‘stlarim <mark>bilan</mark>","<mark>с</mark> друзь<mark>ями</mark>"],["men <mark>bilan</mark> / u <mark>bilan</mark>","<mark>со мной</mark> / <mark>с ним</mark>, <mark>с ней</mark>"],["<mark>kim bo‘lib</mark>? <mark>kim bilan</mark>?","<mark>кем</mark>? <mark>с кем</mark>?"]],
tip:"<b>Olmoshlar:</b> со мной (men bilan), с тобой (sen bilan), с ним / с ней (u bilan), с нами (biz bilan), с вами (siz bilan), с ними (ular bilan). <br><b>Imlo qoidasi:</b> ц, ж, ш, ч, щ dan keyin urg‘usiz bo‘lsa <b>-ей / -ем</b>: уборщиц<b>ей</b>, сиделк<b>ой</b> esa oddiy -ой.",
mistakes:[["Я работаю водитель.","Я работаю водителем.","«kim bo‘lib» → vositachi kelishik: -ем."],["Я живу с брат.","Я живу с братом.","с dan keyin -ом."],["Пойдёшь с я?","Пойдёшь со мной?","«men bilan» → со мной."]]},

grammar:{title:"Kvartira HAQIDA, beshinchi qavat-DA → о квартир-Е, на пят-ОМ этаж-Е",
intro:"A1 da «qayerda?» ni o‘rgandingiz: в банк<b>е</b>, на работ<b>е</b>. Bu predlojniy kelishik (предложный падеж). Endi uni chuqurroq o‘rganamiz.<br><br><b>1. «haqida» = о + predlojniy.</b> O‘zbekchada «haqida» so‘zdan <b>keyin</b> keladi, ruschada «о» <b>oldin</b>: kvartira haqida → <b>о</b> квартир<b>е</b>. Unli bilan boshlansa: <b>об</b> аренде, <b>об</b> этом.<br><b>2. Sifatlar ham o‘zgaradi:</b> erkak va o‘rta jins → <b>-ом / -ем</b> (на пят<b>ом</b> этаже), ayol jinsi → <b>-ой / -ей</b> (в нов<b>ой</b> квартире).<br><b>3. Ko‘plikda:</b> <b>-ах / -ях</b>: в дом<b>ах</b>, о сосед<b>ях</b>, в стар<b>ых</b> дом<b>ах</b>.",
table:[["kvartira <mark>haqida</mark> gaplashdik","говорили <mark>о</mark> квартир<mark>е</mark>"],["ijara <mark>haqida</mark>","<mark>об</mark> аренд<mark>е</mark>"],["nechanchi qavat<mark>da</mark>?","на как<mark>ом</mark> этаж<mark>е</mark>?"],["beshinchi qavat<mark>da</mark>","на пят<mark>ом</mark> этаж<mark>е</mark>"],["yangi kvartira<mark>da</mark>","в нов<mark>ой</mark> квартир<mark>е</mark>"],["eski uy<mark>lar</mark>da","в стар<mark>ых</mark> дом<mark>ах</mark>"],["men <mark>haqimda</mark> / u <mark>haqida</mark>","<mark>обо мне</mark> / <mark>о нём</mark>, <mark>о ней</mark>"]],
tip:"<b>Olmoshlar:</b> обо мне (men haqimda), о тебе, о нём (erkak), о ней (ayol), о нас, о вас, о них. <br><b>Qavat tartibi:</b> на первом, втором, третьем, четвёртом, пятом этаже. <br><b>Foydali ibora:</b> «Давайте поговорим о цене» = Keling, narx haqida gaplashaylik.",
mistakes:[["Мы говорили о квартира.","Мы говорили о квартире.","о dan keyin -е."],["на какой этаже","на каком этаже","Sifat ham predlojniy kelishikda: -ом."],["о аренде","об аренде","Unli oldidan о → об."]]},
dialog:{scene:"Sankt-Peterburg, eski uy, lift yo‘q. Jasur beshinchi qavatga zo‘rg‘a chiqib keldi. Uy egasi Valentina Petrovna kvartirani juda maqtayapti.", a:"Валентина Петровна", b:"Жасур", lines:`a|Ну вот, проходите! Квартира светлая, с мебелью.|Mana, kiring! Kvartira yorug‘, mebelli.

b|Понятно. Сколько стоит аренда?|Tushunarli. Ijara qancha turadi?
a|Тридцать пять тысяч. Плюс коммуналка и залог.|O‘ttiz besh ming. Ustiga kommunal va garov puli.

a|Ерунда. Сосед сверху один раз забыл о кране.|Arzimas narsa. Tepadagi qo‘shni bir marta jo‘mrakni unutgan.
b|Один раз?|Bir martami?
a|Ну... в этом месяце один.|Xo‘sh... shu oyda bir marta.
b|Валентина Петровна, давайте поговорим о цене.|Valentina Petrovna, kelingki, narx haqida gaplashaylik.
a|Цена хорошая! И о тараканах мы не говорим.|Narx yaxshi! Suvaraklar haqida esa gapirmaymiz.
b|О каких тараканах?!|Qanaqa suvaraklar haqida?!`},

grammar:{title:"Oyim-GA yubordim → отправил мам-Е (jo‘nalish kelishigi)",
intro:"O‘zbek tilida «kimga?» — <b>-ga</b>: oyim<b>ga</b>, akam<b>ga</b>. Rus tilida bu <b>jo‘nalish kelishigi</b> (дательный падеж). Savoli: <b>кому?</b> (kimga?).<br><br><b>Oxirlar:</b><br>• erkak va o‘rta jins → <b>-у / -ю</b>: брат → брат<b>у</b>, учитель → учител<b>ю</b><br>• ayol jinsi → <b>-е</b>: мама → мам<b>е</b>, сестра → сестр<b>е</b> (-ия → <b>-ии</b>, -ь → <b>-и</b>: дочь → дочер<b>и</b>)<br>• ko‘plik → <b>-ам / -ям</b>: родител<b>ям</b>, родственник<b>ам</b><br><br><b>Olmoshlar:</b> мне, тебе, ему, ей, нам, вам, им. Siz ularni bilasiz: <b>мне</b> 25 лет, <b>мне</b> нужно, <b>мне</b> нравится — hammasi so‘zma-so‘z «<b>menga</b>».",
table:[["oyim<mark>ga</mark> yubordim","отправил мам<mark>е</mark>"],["akam<mark>ga</mark> o‘tkazdim","перевёл брат<mark>у</mark>"],["<mark>kimga</mark>?","<mark>кому</mark>?"],["<mark>menga</mark> kerak","<mark>мне</mark> надо / <mark>мне</mark> нужно"],["<mark>unga</mark> (erkak / ayol)","<mark>ему</mark> / <mark>ей</mark>"],["shifokor<mark>ga</mark> (oldiga) boraman","иду <mark>к</mark> врач<mark>у</mark>"],["qarindoshlarim<mark>ga</mark>","родственник<mark>ам</mark>"]],
tip:"<b>O‘zbekchada bitta -ga, ruschada uch xil:</b><br>• joyga: <b>в</b> банк, <b>в</b> Москву (A1)<br>• odamga (biror narsa berish): мам<b>е</b>, брат<b>у</b><br>• odamning oldiga borish: <b>к</b> врачу, <b>к</b> маме. <br>«Я иду к маме» = oyimning oldiga boryapman.",
mistakes:[["Я отправил деньги мама.","Я отправил деньги маме.","kimga? → ayol jinsi: -е."],["Я нужно в банк.","Мне нужно в банк.","«menga kerak» → мне."],["Я иду в врачу.","Я иду к врачу.","Odamning oldiga → к."]]},
dialog:{scene:"Moskva, oy oxiri, maosh tushgan kun. Bankda odam ko‘p. Rustam onasiga pul yubormoqchi edi, lekin bankomat kartasini yutib yubordi. Maslahatchi Alina yordamga yugurib keldi.", a:"Алина", b:"Рустам", lines:`b|Девушка! Помогите! Банкомат съел мою карту!|Qizim! Yordam bering! Bankomat kartamni yutib yubordi!
a|Спокойно. Вы ввели неправильный пин-код?|Tinchlaning. PIN-kodni noto‘g‘ri kiritdingizmi?
b|Три раза... А мне срочно надо отправить деньги маме!|Uch marta... Menga esa oyimga shoshilinch pul yuborish kerak!
a|Маме? В Узбекистан?|Oyingizgami? O‘zbekistongami?
b|Да! У неё завтра день рождения.|Ha! Ertaga uning tug‘ilgan kuni.
a|Ничего страшного. Паспорт с собой? Переведём в кассе.|Hechqisi yo‘q. Pasport yoningizdami? Kassada o‘tkazamiz.
b|Ой, спасибо! А комиссия большая?|Voy, rahmat! Komissiyasi kattami?
a|Один процент. Сколько переводим?|Bir foiz. Qancha o‘tkazamiz?
b|Десять тысяч. Нет, пятнадцать! Маме не жалко.|O‘n ming. Yo‘q, o‘n besh! Oyimga ayamayman.
a|Хорошо. И новый пин-код никому не говорите!|Yaxshi. Yangi PIN-kodni esa hech kimga aytmang!
b|Конечно! Никому! Один-два-три-четыре... Ой.|Albatta! Hech kimga! Bir-ikki-uch-to‘rt... Voy.`},

grammar:{title:"Ayt-ING, bos-ING → Скаж-ИТЕ, нажм-ИТЕ (buyruq mayli)",
intro:"O‘zbek tilida buyruq: ayt (sen) → ayt<b>ing</b> (siz). Rus tilida xuddi shunday: скаж<b>и</b> (sen) → скаж<b>ите</b> (siz). Buyruq mayli (повелительное наклонение) ko‘rsatma, iltimos va maslahat uchun.<br><br><b>Qanday yasaladi?</b> «ты» shaklidan oxirini olib tashlab:<br>• undoshdan keyin → <b>-и / -ите</b>: ты скаж-ешь → скаж<b>и</b>, скаж<b>ите</b>; ты нажм-ёшь → нажм<b>и</b>, нажм<b>ите</b><br>• unlidan keyin → <b>-й / -йте</b>: ты чита-ешь → чита<b>й</b>, чита<b>йте</b><br><br><b>«...aylik»</b> = <b>давайте</b> + biz shakli: давайте провер<b>им</b> (tekshiraylik), давайте позвон<b>им</b>.<br><b>«...mang»</b> = <b>не</b> + buyruq: не кладите трубку, не звоните ночью.",
table:[["Ayt<mark>ing</mark>, iltimos","Скаж<mark>ите</mark>, пожалуйста"],["Qo‘ng‘iroq qil<mark>ing</mark>","Позвон<mark>ите</mark>"],["Bos<mark>ing</mark> / bos (sen)","Нажм<mark>ите</mark> / нажм<mark>и</mark>"],["Kutib tur<mark>ing</mark>","Подожд<mark>ите</mark>"],["O‘qi<mark>ng</mark> / o‘qi","Чита<mark>йте</mark> / чита<mark>й</mark>"],["Tekshir<mark>aylik</mark>!","<mark>Давайте</mark> провер<mark>им</mark>!"],["Go‘shakni qo‘y<mark>mang</mark>!","<mark>Не</mark> клад<mark>ите</mark> трубку!"]],
tip:"<b>Пожалуйста</b> ni qo‘shing: ruslar buyruqni shu so‘z bilan yumshatadi. «Скажите, пожалуйста...» — eng muloyim boshlanish (o‘zbekcha «Ayting-chi...»). <br><b>Do‘stga:</b> давай (sen), <b>bir nechta odamga yoki rasmiy:</b> давайте.",
mistakes:[["Скажете, пожалуйста, где...","Скажите, пожалуйста, где...","Скажете = aytasiz (kelasi zamon). Buyruq -ите bilan."],["Давайте проверяем.","Давайте проверим.","давайте + kelasi zamon biz shakli: проверим."],["Не позвоните мне ночью!","Не звоните мне ночью!","«-mang» uchun odatda не + звоните."]]},
dialog:{scene:"Moskva, savdo markazidagi aloqa saloni, kechki soat to‘qqiz. Nilufar yangi telefon sotib oldi, lekin u yonmayapti. Sotuvchi Artyom kun bo‘yi charchagan.", a:"Артём", b:"Нилуфар", lines:`b|Молодой человек! Помогите! Телефон не включается!|Yigit! Yordam bering! Telefon yonmayapti!
a|Так. Нажмите и держите эту кнопку.|Xo‘sh. Mana bu tugmani bosib turing.
b|Нажала. Держу. Ничего!|Bosdim. Ushlab turibman. Hech narsa!
a|Подождите... А вы его зарядили?|Shoshmang... Siz uni quvvatladingizmi?
b|Зарядила? А надо? Он же новый!|Quvvatladimmi? Kerakmidi? U axir yangi-ku!
a|Новый, но пустой. Давайте зарядим вместе.|Yangi, lekin bo‘sh. Keling, birga quvvatlaymiz.
b|Ой... Ладно. И сим-карту вставьте, пожалуйста.|Voy... Mayli. SIM-kartani ham qo‘yib bering, iltimos.
a|Конечно. Какой тариф хотите?|Albatta. Qaysi tarifni xohlaysiz?
b|Самый дешёвый. Но с безлимитным интернетом!|Eng arzonini. Lekin cheksiz internet bilan!
a|Девушка, так не бывает.|Qizim, bunaqasi bo‘lmaydi.
b|Бывает! Позовите начальника. Я подожду.|Bo‘ladi! Boshlig‘ingizni chaqiring. Men kutib turaman.
a|Начальник — это я. Ладно... Безлимит в подарок.|Boshliq menman. Mayli... Cheksiz internet sovg‘a.`},

grammar:{title:"Keldi, ketdi, chiqdi → ПРИшёл, Ушёл, ВЫшел (old qo‘shimchali harakat fe’llari)",
intro:"O‘zbek tilida yo‘nalishni ko‘makchi fe’l bilan aytamiz: <b>kirib keldi</b>, <b>chiqib ketdi</b>, <b>o‘tib ketdi</b>. Rus tilida esa fe’lning <b>oldiga</b> qo‘shimcha (приставка) qo‘yiladi:<br>• <b>при-</b> = kelmoq: прийти, приехать<br>• <b>у-</b> = ketmoq: уйти, уехать<br>• <b>пере-</b> = o‘tmoq, ko‘chmoq: перейти улицу, переехать в Москву<br>• <b>вы-</b> = chiqmoq, tushmoq: выйти из метро<br>• <b>за-</b> = kirib o‘tmoq: зайти в магазин<br>• <b>до-</b> = yetib bormoq: дойти до метро<br>• <b>про-</b> = o‘tib ketmoq: проехать остановку<br><br><b>идти</b> qo‘shimcha bilan <b>-йти</b> bo‘ladi (прийти, уйти, выйти). O‘tgan zamonda: при<b>шёл</b>, у<b>шёл</b>, вы<b>шел</b>; ayol: при<b>шла</b>, у<b>шла</b>, вы<b>шла</b>.",

grammar:{title:"Arzon-ROQ → дешевле; eng arzon → самый дешёвый",
intro:"O‘zbek tilida <b>-roq</b> qo‘shamiz: arzon → arzon<b>roq</b>. Rus tilida ko‘pincha <b>-ее</b> qo‘shiladi: тёплый → <b>теплее</b>, быстрый → <b>быстрее</b>, интересный → <b>интереснее</b>.<br>Lekin eng kerakli so‘zlar boshqacha yasaladi, ularni yod oling:<br>• хороший → <b>лучше</b>, плохой → <b>хуже</b><br>• большой → <b>больше</b>, маленький → <b>меньше</b><br>• дорогой → <b>дороже</b>, дешёвый → <b>дешевле</b><br>• короткий → <b>короче</b>, длинный → <b>длиннее</b><br><br>O‘zbekcha <b>-dan</b> (anavi<b>dan</b> arzon) o‘rniga <b>чем</b> ishlatiladi: дешевле, <b>чем</b> та. <b>Eng</b> = <b>самый</b>, u jinsga moslashadi: самый, самая, самое, самые.",

tip:"<b>По- = «sal, bir oz»:</b> do‘konda ruslar «<b>подешевле</b>» (sal arzonrog‘i), «<b>побольше</b>» (sal kattarog‘i) deydi: Есть что-нибудь подешевле?<br><b>Qiyosiy shakl jinsga qarab o‘zgarmaydi:</b> этот свитер дешевле, эта куртка дешевле, эти джинсы дешевле.<br><b>Qaytarish:</b> Rossiyada nuqsonsiz kiyimni ham odatda 14 kun ichida chek bilan almashtirish yoki qaytarish mumkin. Chekni tashlab yubormang!",

grammar:{title:"-ся fe’llari va «menga kerak / mumkin emas» → мне надо / нельзя",
intro:"A1 da <b>-ся</b> o‘zbekcha <b>-in-</b>, <b>-l-</b> ekanini ko‘rdik (умываться = yuvinmoq). Shifoxonada bunday fe’llar juda ko‘p:<br>• лечить (birovni davolamoq) → лечить<b>ся</b> (o‘zi davolanmoq)<br>• записать (yozib qo‘ymoq) → записать<b>ся</b> (qabulga yozilmoq)<br>• голова кружит<b>ся</b> (bosh aylanyapti)<br>Unlidan keyin <b>-сь</b>: я лечу<b>сь</b>, я записала<b>сь</b>.<br><br><b>Чувствовать себя</b> — so‘zma-so‘z «<b>o‘zini</b> his qilmoq», xuddi o‘zbekchadagidek! <b>себя</b> = o‘zini.<br><br><b>Мне надо / можно / нельзя + infinitiv</b> o‘zbekcha «men<b>ga</b> ... kerak / mumkin / mumkin emas» bilan bir xil tuzilgan: <b>мне</b>, <b>вам</b>, <b>ему</b>, <b>ей</b>, <b>ребёнку</b>.",
table:[["Shifokor bemorni <mark>davolaydi</mark>","Врач <mark>лечит</mark> больного"],["Men uyda <mark>davolanyapman</mark>","Я <mark>лечусь</mark> дома"],["O‘zingizni qanday his qilyapsiz?","Как вы <mark>себя чувствуете</mark>?"],["Bosh<mark>im aylanyapti</mark>","У меня <mark>кружится</mark> голова"],["Men<mark>ga</mark> tahlil topshirish <mark>kerak</mark>","<mark>Мне надо</mark> сдать анализ"],["Siz<mark>ga</mark> qahva ichish <mark>mumkin emas</mark>","<mark>Вам нельзя</mark> пить кофе"],["Ertaga ishlasam <mark>bo‘ladimi</mark>?","<mark>Мне можно</mark> завтра работать?"]],
tip:"<b>надо = нужно</b>, ikkalasi ham «kerak» (fe’l bilan). Ot bilan esa jinsga moslashadi: мне <b>нужен</b> врач, мне <b>нужна</b> медсестра, мне <b>нужно</b> лекарство, мне <b>нужны</b> капли.<br><b>Polis:</b> ishlayotgan chet elliklarda odatda <b>ДМС</b> (ixtiyoriy tibbiy sug‘urta) polisi bo‘ladi. Shoshilinch tez yordam esa hamma uchun bepul.",
mistakes:[["Я чувствую хорошо.","Я чувствую себя хорошо.","«себя» (o‘zimni) tushib qolmasin."],["Я лечу дома.","Я лечусь дома.","O‘zingiz davolanayotgan bo‘lsangiz: -сь. «Я лечу» = men (birovni) davolayman yoki uchyapman."],["Я нельзя курить.","Мне нельзя курить.","нельзя, можно, надо bilan «мне, вам» ishlatiladi."]]},
dialog:{scene:"Yekaterinburg, poliklinika, terapevt xonasi. Sherzod bir haftadan beri boshi aylanib yuribdi. Ko‘zlari qizargan, qo‘lida qahva stakani.", a:"Ирина Викторовна", b:"Шерзод", lines:`a|Проходите, садитесь. На что жалуетесь?|Kiring, o‘tiring. Nimadan shikoyat qilyapsiz?
b|Голова кружится. И слабость, всё время.|Boshim aylanyapti. Doim holsizman.
a|Давно? Температура была?|Ancha bo‘ldimi? Isitma chiqdimi?
b|Неделю. Температуры нет, я мерил.|Bir hafta bo‘ldi. Isitma yo‘q, o‘lchab ko‘rdim.
a|Давайте измерим давление... Хм. Низкое.|Keling, bosimni o‘lchaymiz... Hmm. Past.
b|Это плохо? Мне надо сдать анализы?|Bu yomonmi? Tahlil topshirishim kerakmi?
a|Сдадите. А сколько часов вы спите?|Topshirasiz. Necha soat uxlaysiz o‘zi?
b|Ну... часа четыре. Я работаю на двух работах.|Endi... to‘rt soatcha. Ikki joyda ishlayman.
a|Понятно. Кофе пьёте? Энергетики?|Tushunarli. Qahva ichasizmi? Energetik-chi?
b|Конечно! Без них я не могу.|Albatta! Ularsiz turolmayman.
a|Так. Кофе нельзя, энергетики нельзя. Вам надо спать.|Shunday. Qahva mumkin emas, energetik mumkin emas. Sizga uxlash kerak.
b|Доктор, сон — это самое дорогое лекарство!|Doktor, uyqu eng qimmat dori-ku!`},

grammar:{title:"Kimni? Do‘st-NI taklif qildim → пригласил друг-А",
intro:"6-darsda <b>Nimani?</b> savolini o‘rgandik: вод<b>у</b>, рыб<b>у</b>. Endi <b>Kimni?</b> — odamlar va hayvonlar (jonli otlar). O‘zbekcha <b>-ni</b> rus tilida shunday bo‘ladi:<br>• erkak, undosh bilan tugaydi: <b>+а / +я</b> → друг → друг<b>а</b>, брат → брат<b>а</b>, учитель → учител<b>я</b>, Алишер → Алишер<b>а</b><br>• <b>-а / -я</b> bilan tugaydi (erkak ham, ayol ham): <b>-у / -ю</b> → мам<b>у</b>, сестр<b>у</b>, пап<b>у</b>, Дильноз<b>у</b><br>• olmoshlar: <b>меня, тебя, его, её, нас, вас, их</b><br><br>Diqqat: <b>jonsiz</b> erkak otlar o‘zgarmaydi: купил подарок, торт. Faqat jonlilar -а oladi: пригласил друг<b>а</b>.",
table:[["Do‘st<mark>imni</mark> taklif qildim","Я пригласил друг<mark>а</mark>"],["Aka<mark>mni</mark> tabrikladim","Я поздравил брат<mark>а</mark>"],["Oyi<mark>mni</mark> bayram bilan tabriklayman","Поздравляю мам<mark>у</mark> с праздником"],["<mark>Sizni</mark> Yangi yil bilan tabriklaymiz","Поздравляем <mark>вас</mark> с Новым годом"],["Alisher<mark>ni</mark> ham chaqiramizmi?","Позовём Алишер<mark>а</mark> тоже?"],["<mark>Ularni</mark> mehmonga taklif qildik","Мы пригласили <mark>их</mark> в гости"],["Sovg‘a<mark>ni</mark> oldim (jonsiz)","Я купил подар<mark>ок</mark> (o‘zgarmaydi)"]],
tip:"<b>Kimni nima bilan tabriklaymiz?</b> поздравлять <b>кого</b> + <b>с чем</b>: поздравляю маму <b>с</b> праздник<b>ом</b>, <b>с</b> днём рождения, <b>с</b> Новым годом.<br><b>Ayol ismi undosh bilan tugasa</b> (Нилуфар, Гульнур), o‘zgarmaydi: пригласил Нилуфар.<br><b>Madaniyat:</b> Rossiyada gul <b>toq</b> sonda sovg‘a qilinadi (3, 5, 7). Juft son (2, 4) faqat dafn marosimiga olib boriladi!",
mistakes:[["Я пригласил друг.","Я пригласил друга.","Jonli erkak ot «kimni?» savolida -а oladi."],["Поздравляю маму на праздник.","Поздравляю маму с праздником.","Tabriklash: «с» + ot (-ом, -ем)."],["Я поздравил она.","Я поздравил её.","Kimni? → её, его, их."]]},
dialog:{scene:"Moskva, 31-dekabr, kechki soat oltida. Nodira oshxonada palov damlayapti, Rustam esa telefonda kimgadir «albatta keling!» deyapti.", a:"Нодира", b:"Рустам", lines:`a|Рустам, ты пригласил Сергея Петровича?|Rustam, Sergey Petrovichni taklif qildingmi?

a|А брата позвал? Ойбека?|Ukangni chaqirdingmi? Oybekni?
b|Ойбека, его друга и... их подруг.|Oybekni, uning do‘stini va... ularning dugonalarini.

grammar:{title:"Fe’l turi: o‘qidim / o‘qib chiqdim → читал / прочитал",
intro:"O‘zbek tilida natijani ko‘makchi fe’l bilan bildiramiz: o‘qi<b>dim</b> → o‘qi<b>b chiqdim</b>, qil<b>dim</b> → qil<b>ib bo‘ldim</b>. Rus tilida buning uchun ko‘p fe’llarning <b>ikki turi</b> (вид) bor:<br>• <b>nomukammal</b> (НСВ): jarayon, takror, odat → смотреть, делать, читать, играть<br>• <b>mukammal</b> (СВ): natija, bir martalik ish → <b>по</b>смотреть, <b>с</b>делать, <b>про</b>читать, <b>сы</b>грать<br><br>Signal so‘zlar: <b>каждый день, часто, обычно, весь вечер, долго</b> → nomukammal; <b>уже, наконец, до конца, за два часа</b> → mukammal.",
table:[["Kecha butun kech serial <mark>ko‘rdim</mark> (jarayon)","Вчера весь вечер я <mark>смотрел</mark> сериал"],["Serialni oxirigacha <mark>ko‘rib chiqdim</mark> (natija)","Я <mark>посмотрел</mark> сериал до конца"],["Uy vazifasini <mark>qilyapman</mark>","Я <mark>делаю</mark> домашнее задание"],["Uy vazifasini <mark>qilib bo‘ldim</mark>","Я <mark>сделал</mark> домашнее задание"],["Har shanba futbol <mark>o‘ynayman</mark>","Каждую субботу я <mark>играю</mark> в футбол"],["Kitobni nihoyat <mark>o‘qib chiqdim</mark>","Наконец я <mark>прочитал</mark> книгу"],["Idishlarni <mark>yuvayotgan edim</mark>, lekin tugatmadim","Я <mark>мыл</mark> посуду, но не помыл"]],
tip:"<b>Juftlar ko‘pincha old qo‘shimcha bilan farqlanadi:</b> смотреть → <b>по</b>смотреть, делать → <b>с</b>делать, читать → <b>про</b>читать, играть → <b>сы</b>грать, мыть → <b>по</b>мыть. Ba’zan butunlay boshqacha: покупать → купить, решать → решить.<br><b>Savolda ham farq bor:</b> «Что ты делал вчера?» — jarayon haqida (nima bilan band eding?). «Ты сделал уроки?» — natija bormi?",

grammar:{title:"Kelasi zamon: буду работать va сделаю",
intro:"O‘zbek tilida «ishlay<b>man</b>» ham hozirgi, ham kelasi zamonni bildiradi. Rus tilida kelasi zamonning <b>ikki shakli</b> bor (10-darsdagi fe’l turlariga bog‘liq):<br>• <b>nomukammal</b> fe’l: <b>буду + infinitiv</b> → я <b>буду работать</b> (ishlayman: jarayon, uzoq vaqt)<br>• <b>mukammal</b> fe’l: oddiy tuslanadi, <b>буду</b>siz → я <b>сделаю</b> (qilib qo‘yaman: natija), я <b>вернусь</b> (qaytaman)<br><br><b>быть</b> tuslanishi: я <b>буду</b>, ты <b>будешь</b>, он/она <b>будет</b>, мы <b>будем</b>, вы <b>будете</b>, они <b>будут</b>.",
table:[["Ertaga kun bo‘yi ish<mark>layman</mark>","Завтра я весь день <mark>буду работать</mark>"],["Yozda dengizda dam ol<mark>amiz</mark>","Летом мы <mark>будем отдыхать</mark> на море"],["Xavotir olma, hammasini qilib <mark>qo‘yaman</mark>","Не волнуйся, я всё <mark>сделаю</mark>"],["Pul yig‘ib, uy <mark>quraman</mark>","Я накоплю деньги и <mark>построю</mark> дом"],["Bir yildan keyin uyga <mark>qaytaman</mark>","Через год я <mark>вернусь</mark> домой"],["Ota-onam xursand <mark>bo‘ladi</mark>","Родители <mark>будут</mark> рады"],["Kechqurun qo‘ng‘iroq <mark>qilasanmi</mark>?","Ты <mark>позвонишь</mark> вечером?"]],
tip:"<b>Reja haqida</b> yana shunday deyish mumkin: <b>я собираюсь / планирую / хочу + infinitiv</b> (o‘zbekcha <b>-moqchiman</b>): Я собираюсь поехать домой.<br><b>Mukammal fe’lning «hozirgi» ko‘rinishi aslida kelasi zamon:</b> сделаю, куплю, позвоню. Shuning uchun «Я позвоню» = «Qo‘ng‘iroq qilaman» (keyinroq), hozir emas!",

grammar:{title:"Qo‘shma gaplar: потому что, если, что, который",
intro:"O‘zbek tilida ergash gapni qo‘shimchalar bilan yasaymiz va u <b>oldin</b> keladi: <b>vaqting bo‘lsa</b>, qo‘ng‘iroq qil; <b>Moskvada yashaydigan</b> do‘stim. Rus tilida esa <b>bog‘lovchi</b> ishlatiladi, gap tartibi oddiy qoladi va bog‘lovchidan oldin <b>vergul</b> qo‘yiladi:<br>• <b>потому что</b> = chunki<br>• <b>если</b> = agar, -sa<br>• <b>что</b> = -ki, -ligini, ekanini<br>• <b>который</b> = -gan, -digan (jinsga moslashadi: который, которая, которое, которые)",
table:[["Bormayman, <mark>chunki</mark> charchadim","Я не пойду, <mark>потому что</mark> устал"],["Vaqting bo‘l<mark>sa</mark>, qo‘ng‘iroq qil","<mark>Если</mark> будет время, позвони"],["U haq ekan<mark>ligini</mark> bilaman","Я знаю, <mark>что</mark> он прав"],["Moskvada yasha<mark>ydigan</mark> do‘stim","Мой друг, <mark>который</mark> живёт в Москве"],["Kecha kel<mark>gan</mark> qiz","Девушка, <mark>которая</mark> пришла вчера"],["Qimmat edi, <mark>shuning uchun</mark> olmadim","Было дорого, <mark>поэтому</mark> я не купил"]],
tip:"<b>если + kelasi zamon:</b> o‘zbekcha «ertaga vaqtim bo‘l<b>sa</b>» → «если завтра у меня <b>будет</b> время». Kelajak haqida gapirsangiz, <b>если</b>dan keyin ham kelasi zamon ishlatiladi.<br><b>Почему? — Потому что...</b> Savol <b>почему</b> (nega), javob <b>потому что</b> (chunki). Yozuvda: почему — bitta so‘z, потому что — ikki so‘z.",

grammar:{title:"Kutishim kerak EDI → Ich MUSSTE warten: modal fe’llar o‘tgan zamonda",
intro:"O‘zbek tilida modal ma’noni o‘tgan zamonga o‘tkazish uchun <b>edi</b> qo‘shamiz: borishim kerak → borishim kerak <b>edi</b>; bormoqchiman → bormoqchi <b>edim</b>. Nemis tilida modal fe’lning o‘zi o‘zgaradi: <b>-te</b> qo‘shiladi va umlaut (ü, ö) <b>yo‘qoladi</b>:<br>• müssen → <b>musste</b> (kerak edi)<br>• können → <b>konnte</b> (qila oldim / qila olmadim)<br>• wollen → <b>wollte</b> (...moqchi edim)<br>• dürfen → <b>durfte</b> (mumkin edi, ruxsat bor edi)<br><br>Gap tartibi A1dagidek: modal fe’l <b>ikkinchi</b> o‘rinda, asosiy fe’l noaniq shaklda <b>gap oxirida</b>: Ich <b>musste</b> drei Stunden <b>warten</b>.<br><br>Tuslanishi: ich musste, du musst<b>est</b>, er/sie musste, wir musst<b>en</b>, ihr musst<b>et</b>, sie/Sie musst<b>en</b>.",
table:[["Uch soat kutishim <mark>kerak bo‘ldi</mark>.","Ich <mark>musste</mark> drei Stunden <mark>warten</mark>."],["Xodimni tushun<mark>a olmadim</mark>.","Ich <mark>konnte</mark> den Beamten nicht <mark>verstehen</mark>."],["Faqat savol bermoq<mark>chi edim</mark>.","Ich <mark>wollte</mark> nur eine Frage <mark>stellen</mark>."],["Ichkariga kirish <mark>mumkin emas edi</mark>.","Wir <mark>durften</mark> nicht <mark>reingehen</mark>."],["men / u (bir xil, qo‘shimchasiz)","ich <mark>musste</mark> / er <mark>musste</mark>"],["sen / biz / siz","du <mark>musstest</mark> / wir <mark>mussten</mark> / Sie <mark>mussten</mark>"]],
tip:"<b>Perfekt emas, Präteritum!</b> Modal fe’llar ham, haben va sein kabi, so‘zlashuvda qisqa o‘tgan zamonda ishlatiladi: murakkab «Ich habe warten müssen» o‘rniga oddiy <b>Ich musste warten</b> deng.<br><b>Germaniyada:</b> yangi kvartiraga ko‘chganingizdan keyin <b>14 kun ichida</b> Bürgeramtda ro‘yxatdan o‘tish (Anmeldung) majburiy. Buning uchun uy egasidan <b>Wohnungsgeberbestätigung</b> (uy egasi tasdiqnomasi) kerak. Ausländerbehördedagi qabul oldindan, ko‘pincha internet orqali olinadi; hujjatlarning <b>asl nusxasi va nusxasini</b> olib boring.",

grammar:{title:"…, WEIL ich Geld BRAUCHE: ergash gapda fe’l oxirida, o‘zbekchadagi kabi",
intro:"O‘zbek tilida sabab aytganda fe’l doim oxirida: «Pul <b>kerak bo‘lgani</b> uchun ish qidiryapman». Nemis tilida oddiy gapda tuslangan fe’l 2-o‘rinda turadi, lekin <b>weil</b> (chunki, ...gani uchun) va <b>dass</b> (...ki, ...ganini) dan keyingi ergash gapda fe’l <b>gap oxiriga</b> ketadi — xuddi o‘zbekchadagidek!<br>• Ich brauche Geld. → ..., <b>weil</b> ich Geld <b>brauche</b>.<br>• Die Stelle ist gut. → Ich glaube, <b>dass</b> die Stelle gut <b>ist</b>.<br><br>Ergash gap oldidan doim <b>vergul</b> qo‘yiladi. Modal fe’l bo‘lsa, u eng oxirida, asosiy fe’ldan keyin: ..., weil ich morgen arbeiten <b>muss</b>. Ajraladigan fe’l esa yana qo‘shilib ketadi: ..., weil ich um 5 Uhr <b>aufstehe</b>.",
table:[["Pul <mark>kerak bo‘lgani uchun</mark> ish qidiryapman.","Ich suche Arbeit, <mark>weil</mark> ich Geld <mark>brauche</mark>."],["Kecha kelmadim, chunki kasal <mark>edim</mark>.","Ich war nicht da, <mark>weil</mark> ich krank <mark>war</mark>."],["Tajribam <mark>borligini</mark> bilaman.","Ich weiß, <mark>dass</mark> ich Erfahrung <mark>habe</mark>."],["Bu ishni olaman deb umid <mark>qilaman</mark>.","Ich hoffe, <mark>dass</mark> ich die Stelle <mark>bekomme</mark>."],["Ertaga kela <mark>olishimni</mark> aytdim.","Ich habe gesagt, <mark>dass</mark> ich morgen kommen <mark>kann</mark>."],["Soat beshda <mark>turganim uchun</mark> charchayman.","Ich bin müde, <mark>weil</mark> ich um fünf Uhr <mark>aufstehe</mark>."]],
tip:"<b>Warum? → Weil...</b> Savolga qisqa javobni weil bilan boshlash mumkin: «Warum möchten Sie hier arbeiten?» — «<b>Weil</b> ich Erfahrung <b>habe</b>.»<br><b>denn</b> ham «chunki» degani, lekin undan keyin oddiy tartib: ..., <b>denn</b> ich <b>brauche</b> Geld.<br><b>Germaniyada:</b> Lebenslauf odatda 1–2 sahifa bo‘ladi, rasm shart emas. Brutto va netto maosh orasidagi farq katta (soliq va sug‘urtalar). Eng kam ish haqi (<b>Mindestlohn</b>) qonun bilan belgilangan — shartnomani imzolashdan oldin tekshiring.",
mistakes:[["..., weil ich brauche Geld.","..., weil ich Geld brauche.","weil dan keyin tuslangan fe’l gap oxiriga ketadi."],["Ich denke dass er kommt.","Ich denke, dass er kommt.","dass va weil oldidan doim vergul qo‘yiladi."],["..., dass ich kann morgen kommen.","..., dass ich morgen kommen kann.","Modal fe’l eng oxirida, asosiy fe’ldan keyin."]]},
dialog:{scene:"Myunxendagi restoran, ertalab soat to‘qqiz. Madina oshpaz lavozimiga suhbatga keldi. Oshxona tomondan negadir tutun hidi kelyapti.", a:"Herr Krause", b:"Madina", lines:`a|Frau Rahimova? Kommen Sie rein! Setzen Sie sich.|Rahimova xonim? Kiring! O‘tiring.
b|Danke! Guten Morgen, Herr Krause.|Rahmat! Xayrli tong, Krauze janoblari.
a|Also, warum möchten Sie bei uns arbeiten?|Xo‘sh, nega bizda ishlamoqchisiz?
b|Weil ich sehr gern koche. Und Ihr Restaurant ist toll.|Chunki ovqat pishirishni juda yaxshi ko‘raman. Restoraningiz ham zo‘r.
a|Haben Sie Erfahrung?|Tajribangiz bormi?
b|Ja, sechs Jahre. In Taschkent und in Augsburg.|Ha, olti yil. Toshkentda va Augsburgda.
a|Gut. Und was ist Ihre größte Schwäche?|Yaxshi. Eng zaif tomoningiz nima?
b|Hmm... Ich glaube, dass ich zu viel koche.|Hmm... Menimcha, haddan tashqari ko‘p ovqat pishiraman.
a|Zu viel? Das ist kein Problem. Können Sie Schicht arbeiten?|Juda ko‘p? Bu muammo emas. Smenada ishlay olasizmi?
b|Natürlich. Entschuldigung... riecht es hier nach Rauch?|Albatta. Kechirasiz... bu yerda tutun hidi kelyaptimi?
a|Oh nein, meine Suppe! Der Koch hat gestern gekündigt...|Voy, sho‘rvam! Oshpaz kecha ishdan ketgan edi...
b|Dann denke ich, dass ich sofort anfange!|Unda, menimcha, ishni hoziroq boshlayman!`},
