let kbOpen = false;
const KB_ROWS = C.kb;
function keyboardHTML(){
  return `<button class="chip kbtoggle" id="kbT" aria-pressed="${kbOpen}">⌨ Klaviatura</button>
  <div class="kb" id="kb" ${kbOpen ? "" : "hidden"}>${KB_ROWS.map(r => `<div class="r">${[...r].map(ch => `<button type="button" data-k="${ch}">${ch}</button>`).join("")}</div>`).join("")}
  <div class="r">${C.kbExtra.map(ch => `<button type="button" class="w" data-k="${ch}">${ch}</button>`).join("")}<button type="button" class="w" data-k=" ">bo‘sh joy</button><button type="button" class="w" data-k="⌫">⌫ o‘chirish</button></div></div>`;
}
function bindKeyboard(input){
  const T = $("#kbT"); if (!T) return;
  T.onclick = () => { kbOpen = !kbOpen; $("#kb").hidden = !kbOpen; T.setAttribute("aria-pressed", kbOpen); };
  $$("#kb [data-k]").forEach(b => b.onclick = () => {
    const k = b.dataset.k; if (input.disabled) return;
    const s = input.selectionStart ?? input.value.length, e = input.selectionEnd ?? input.value.length;
    if (k === "⌫"){ if (s === e && s > 0) { input.value = input.value.slice(0, s-1) + input.value.slice(e); input.setSelectionRange(s-1, s-1); } else { input.value = input.value.slice(0, s) + input.value.slice(e); input.setSelectionRange(s, s); } }
    else { input.value = input.value.slice(0, s) + k + input.value.slice(e); input.setSelectionRange(s+1, s+1); }
  });
}

function runQuiz(root, cfg){
  const qs = cfg.questions.filter(Boolean);
  let i = 0, score = 0;
  const draw = () => {
    if (i >= qs.length){
      const p = Math.round(score / qs.length * 100);
      const msg = cfg.onFinish ? cfg.onFinish(score, qs.length) : "";
      const extra = cfg.extra ? cfg.extra()(p) : "";
      root.innerHTML = `<div class="result"><div class="big">${p}%</div><p>${score} / ${qs.length} to‘g‘ri</p><p><b>${esc(msg || "")}</b></p>
        <div class="row" style="justify-content:center;margin-top:12px">${cfg.after ? '<button class="btn primary" id="afterBtn">Davom etish</button>' : ""}<button class="btn ghost" id="retryBtn">Qayta boshlash</button></div></div>${extra}`;
      const rb = $("#retryBtn", root); if (rb) rb.onclick = cfg.retry || (() => { i = 0; score = 0; draw(); });
      const ab = $("#afterBtn", root); if (ab) ab.onclick = cfg.after;
      if (cfg.bindExtra) cfg.bindExtra(root);
      renderNav();
      return;
    }
    const q = qs[i];
    root.innerHTML = `<div class="qmeta"><span>${i+1} / ${qs.length}</span><span>${score} to‘g‘ri</span></div>
      <div class="qprog"><i style="width:${i / qs.length * 100}%"></i></div>
      <div class="qcard"><div class="qkind">${esc(q.label || "")}</div>
        <div class="qtext">${q.prompt || ""}</div>
        ${q.audio ? `<div class="row" style="margin:-4px 0 14px">${spkBtn(q.audio, "Tinglash", "sm")}${q.sentence ? spkBtn(q.audio, "Sekin", "sm alt slowone") : ""}</div>` : ""}
        <div id="body"></div><div id="fb"></div></div>`;
    $$(".slowone", root).forEach(b => b.addEventListener("click", e => { e.stopPropagation(); const prev = S.settings.slow; TIL.audio.setSettings({ slow:true }); speak(q.audio, b).finally(() => TIL.audio.setSettings({ slow:prev })); }, true));
    if (q.audio && q.autoplay) setTimeout(() => speak(q.audio), 150);
    const body = $("#body", root), fb = $("#fb", root);
    const next = (ok, half) => {
      if (ok) { score += 1; addXP(half ? 1 : 2); }
      if (q.word) grade(q.word, ok, !!half);
      const nb = document.createElement("button"); nb.className = "btn primary wide"; nb.textContent = i + 1 < qs.length ? "Davom etish" : "Natijani ko‘rish";
      nb.onclick = () => { i++; draw(); }; fb.appendChild(nb); nb.focus({ preventScroll:true });
      if (q.audioAfter) speak(q.audioAfter);
    };
    const feedback = (cls, title, body2) => { fb.innerHTML = `<div class="fb ${cls}"><b>${title}</b>${body2 ? `<i>${body2}</i>` : ""}</div>`; };

    if (q.kind === "choice"){
      const opts = q.keepOrder ? q.options : shuffle(q.options);
      body.innerHTML = `<div class="opts">${opts.map(o => `<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
      $$(".opt", body).forEach(b => b.onclick = () => {
        const ok = b.dataset.o === q.answer;
        $$(".opt", body).forEach(x => { x.disabled = true; if (x.dataset.o === q.answer) x.classList.add("right"); });
        if (!ok) b.classList.add("wrong");
        feedback(ok ? "good" : "bad", ok ? "To‘g‘ri!" : "Noto‘g‘ri. To‘g‘ri javob: " + esc(q.answer), q.explain ? esc(q.explain) : "");
        next(ok);
      });
    }
    if (q.kind === "type"){
      body.innerHTML = `<form id="tf" autocomplete="off"><input class="tin" id="tin" lang="${C.id}" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${C.typeLbl}…" aria-label="Javob">
        <button class="btn primary wide" type="submit">Tekshirish</button></form>${keyboardHTML()}`;
      const inp = $("#tin", body); bindKeyboard(inp);
      if (!kbOpen) setTimeout(() => inp.focus({ preventScroll:true }), 50);
      $("#tf", body).onsubmit = e => {
        e.preventDefault(); if (inp.disabled) return;
        const a = normRu(inp.value), b = normRu(q.answer);
        if (!a) return;
        inp.disabled = true; $("#tf button", body).remove();
        const d = lev(a, b), tol = b.length <= 6 ? 1 : Math.max(2, Math.round(b.length * 0.12));
        if (a === b){ inp.classList.add("right"); feedback("good", "To‘g‘ri!", esc(q.answer) + (q.explain ? " — " + esc(q.explain) : "")); next(true); }
        else if (d <= tol && (isDe ? /[a-z]/ : /[а-я]/).test(a)){ inp.classList.add("right"); feedback("mid", "Deyarli to‘g‘ri! Imloga e’tibor bering:", esc(q.answer)); next(true, true); }
        else {
          inp.classList.add("wrong");
          feedback("bad", "To‘g‘ri javob: " + esc(q.answer), (!isDe && /[a-z]/i.test(a) ? "Lotin harflarida yozdingiz. Kirill harflaridan foydalaning. " : "") + (q.explain ? esc(q.explain) : ""));
          if (q.selfCheck){
            const sb = document.createElement("button"); sb.className = "btn ghost sm"; sb.style.marginTop = "8px"; sb.textContent = "Mening javobim ham to‘g‘ri (boshqa so‘zlar bilan)";
            sb.onclick = () => { score += 1; addXP(1); sb.remove(); toast("Qabul qilindi. Javobni o‘zingiz tekshirdingiz."); };
            fb.appendChild(sb);
          }
          next(false);
        }
      };
    }
    if (q.kind === "build"){
      const toks = q.answer.split(" ");
      const bank = shuffle(toks.map((t, k) => ({ t, k })));
      const chosen = [];
      body.innerHTML = `<div class="built" id="built" aria-label="Siz tuzgan gap"></div><div class="bank" id="bank">${bank.map(b => `<button class="tok" data-k="${b.k}">${esc(b.t)}</button>`).join("")}</div><button class="btn primary wide" id="chk" disabled>Tekshirish</button>`;
      const built = $("#built", body), chk = $("#chk", body);
      const redraw = () => { built.innerHTML = chosen.map((c, j) => `<button class="tok" data-j="${j}">${esc(c.t)}</button>`).join(""); $$("#bank .tok", body).forEach(b => b.classList.toggle("used", chosen.some(c => c.k === +b.dataset.k))); chk.disabled = chosen.length !== toks.length;
        $$("[data-j]", built).forEach(b => b.onclick = () => { if (chk.dataset.done) return; chosen.splice(+b.dataset.j, 1); redraw(); }); };
      $$("#bank .tok", body).forEach(b => b.onclick = () => { if (chk.dataset.done || b.classList.contains("used")) return; chosen.push(bank.find(x => x.k === +b.dataset.k)); redraw(); });
      chk.onclick = () => {
        chk.dataset.done = 1; chk.remove();
        const ok = normRu(chosen.map(c => c.t).join(" ")) === normRu(q.answer);
        built.classList.add(ok ? "right" : "wrong");
        feedback(ok ? "good" : "bad", ok ? "To‘g‘ri!" : "To‘g‘ri tartib:", ok ? "" : esc(q.answer));
        next(ok);
      };
    }
    if (q.kind === "match"){
      const L = shuffle(q.pairs.map((p, k) => ({ t:p[0], k }))), R = shuffle(q.pairs.map((p, k) => ({ t:p[1], k })));
      let sel = null, errs = 0, left = q.pairs.length;
      body.innerHTML = `<div class="match"><div class="col">${L.map(x => `<button class="mt" data-side="L" data-k="${x.k}">${esc(x.t)}</button>`).join("")}</div><div class="col">${R.map(x => `<button class="mt" data-side="R" data-k="${x.k}">${esc(x.t)}</button>`).join("")}</div></div>`;
      $$(".mt", body).forEach(b => b.onclick = () => {
        if (b.classList.contains("done")) return;
        if (b.dataset.side === "L") speak(q.pairs[+b.dataset.k][0]);
        if (!sel || sel.dataset.side === b.dataset.side){ $$(".mt.sel", body).forEach(x => x.classList.remove("sel")); sel = b; b.classList.add("sel"); return; }
        if (sel.dataset.k === b.dataset.k){ [sel, b].forEach(x => { x.classList.remove("sel"); x.classList.add("done"); x.disabled = true; }); left--; sel = null;
          if (!left){ const ok = errs <= 1; feedback(ok ? "good" : "bad", ok ? "Hammasi to‘g‘ri!" : `Tugadi, lekin ${errs} ta xato bilan.`); next(ok); } }
        else { errs++; const a = sel, c = b; [a, c].forEach(x => x.classList.add("err")); setTimeout(() => [a, c].forEach(x => x.classList.remove("err","sel")), 500); sel = null; }
      });
    }
  };
  draw();
}

function studied(){ return C.lessons.filter(l => { const st = S.lessons[l.id]; return st && (st.cards || st.practice || st.grammar); }); }

  if (!ls.length){ W.innerHTML = `<div class="empty"><h3>Avval darslarni boshlang</h3><p>Nazorat o‘tilgan mavzulardan tuziladi.</p></div>`; return; }

function weeklyHistory(){

/* ===================== GURUH: REYTING VA DUELLAR ===================== */
const BOARDS = [["week","Hafta","XP"],["words","So‘zlar","so‘z"],["streak","Seriya","kun"],["lessons","Darslar","dars"],["xp","Jami","XP"]];
let board = "week", rankCache = null;
function adjust(p){
  const wk = weekKey(), prev = addDays(wk, -7);
  const week = p.week_key === wk ? p.week_xp : 0;
  const last = p.week_key === wk ? p.last_week_xp : p.week_key === prev ? p.week_xp : 0;
  const today = p.day === todayStr() && p.today_xp > 0;
  const streakNow = (p.day === todayStr() || p.day === addDays(todayStr(), -1)) ? p.streak : 0;
  return Object.assign({}, p, { week, last, today, streakNow });
}
async function loadRank(){
  const [ps, ds] = await Promise.all([CL.profiles(), CL.duels()]);
  const rs = await CL.results(ds.map(d => d.id));
  rankCache = { ps: ps.map(adjust), ds, rs, at: Date.now() };
  return rankCache;
}
function viewRank(){
  if (!CL.configured){
    app.innerHTML = `<div class="thead"><div class="eyebrow">Guruh</div><h1>Reyting</h1><p>Do‘stlar bilan musobaqa: kim ko‘proq o‘qidi, kim ko‘proq so‘z bildi.</p></div>
    <div class="empty"><h3>Guruh rejimi hali sozlanmagan</h3><p>Admin saytga Supabase manzili va kalitini qo‘shgach, bu yerda reyting va duellar paydo bo‘ladi. Ko‘rsatma README faylida.</p></div>`;
    return;
  }
  if (!CL.user()){
    app.innerHTML = `<div class="thead"><div class="eyebrow">Guruh</div><h1>Reyting</h1></div><div class="empty"><h3>Reytingni ko‘rish uchun guruhga kiring</h3><p>Ism va PIN kodni admin beradi.</p><button class="btn primary" id="toLogin">Kirish</button></div>`;
    $("#toLogin").onclick = () => go({ v:"login" });

  app.innerHTML = `<div class="thead"><div class="eyebrow">Guruh</div><h1>Reyting</h1><p>Haftalik reyting XP bo‘yicha: kim ko‘p mehnat qilsa, o‘sha g‘olib. Yangi boshlagan ham yuta oladi.</p></div><div id="rk"><div class="empty"><p>Yuklanmoqda…</p></div></div>`;
  pushNow().then(loadRank).then(drawRank).catch(e => { const el = $("#rk"); if (el) el.innerHTML = `<div class="empty"><h3>Reytingni yuklab bo‘lmadi</h3><p>${esc(e.message)}. Internetni tekshirib, qayta oching.</p></div>`; });
}
function drawRank(){
  const R = $("#rk"); if (!R || !rankCache) return;
  const me = CL.user().id, { ds, rs } = rankCache;
  const hid = id => HIDDEN.includes(id);
  /* admin reytingda ko‘rinmaydi; yashirin a’zo faqat o‘ziga va adminga ko‘rinadi (buni server ham tekshiradi) */
  const ps = rankCache.ps.filter(p => !(isAdmin() && p.id === me));
  const players = ps.filter(p => !hid(p.id));
  const val = p => ({ week:p.week, words:p.words, streak:p.streakNow, lessons:p.lessons, xp:p.xp })[board];
  const rows = ps.slice().sort((a, b) => val(b) - val(a) || b.xp - a.xp);
  const unit = BOARDS.find(b => b[0] === board)[2];
  const champ = players.slice().sort((a, b) => b.last - a.last)[0];
  const goal = Math.max(1, players.length) * 350, sum = players.reduce((a, p) => a + p.week, 0);
  const todayN = players.filter(p => p.today).length;
  const canDuel = !ROLE && !hid(me);
  const nameOf = id => (ps.find(p => p.id === id) || {}).name || "?";
  const res = id => rs.filter(r => r.duel_id === id);
  const mine = ds.filter(d => d.creator === me || d.opponent === me);
  const duelRow = d => {
    const other = d.creator === me ? d.opponent : d.creator;
    const r = res(d.id), my = r.find(x => x.user_id === me), th = r.find(x => x.user_id === other);
    let status;
    if (!my) status = `<button class="btn sm primary" data-play="${d.id}">O‘ynash</button>`;
    else if (!th) status = `<span class="pill">Siz: ${my.score}/10 · raqib kutilmoqda</span>`;
    else { const win = my.score > th.score || (my.score === th.score && my.ms < th.ms); const draw = my.score === th.score && my.ms === th.ms;
      status = `<span class="pill ${draw ? "" : win ? "ok" : "warn"}">${my.score}:${th.score} · ${draw ? "durang" : win ? "g‘alaba" : "mag‘lubiyat"}</span>`; }
    return `<div class="switch"><span>${I.swords.replace("<svg", '<svg width="16" height="16" style="vertical-align:-3px"')} ${esc(nameOf(other))}<small class="fc-tr" style="display:block">${fmtDate(d.created_at.slice(0, 10))}</small></span>${status}</div>`;
  };
  R.innerHTML = `
    ${champ && champ.last > 0 ? `<div class="today" style="margin-top:0"><h2>${I.trophy.replace("<svg", '<svg width="20" height="20" style="vertical-align:-4px"')} O‘tgan hafta g‘olibi: ${esc(champ.name)}</h2><p class="sub">${champ.last} XP. Bu hafta kim uni quvib o‘tadi?</p></div>` : ""}
    <div class="goal" style="margin-top:12px"><b>Guruh maqsadi</b><div class="gbar"><i style="width:${Math.min(100, sum / goal * 100)}%"></i></div><span>${sum} / ${goal} XP</span></div>
    <div class="freeze">Bu hafta ${canDuel ? "hammamiz birga" : "guruh birga"} ${goal} XP to‘plashi kerak. Bugun ${todayN} / ${players.length} kishi o‘qidi.</div>
    ${isAdmin() ? `<div class="freeze">Siz adminsiz: reytingda ko‘rinmaysiz, natijalaringiz hech kimga yuborilmaydi.</div>` : ROLE === "observer" ? `<div class="freeze">Siz guruhni ko‘rasiz, lekin guruh sizni ko‘rmaydi. Natijalaringiz faqat sizga ko‘rinadi.</div>` : ""}
    <div class="tabs" style="grid-template-columns:repeat(5,1fr);margin-top:14px;position:static" role="tablist">${BOARDS.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${board === k}" data-b="${k}">${l}</button>`).join("")}</div>
    <ol class="lb">${rows.map((p, i) => `<li class="${p.id === me ? "me" : ""}"><span class="pos">${i + 1}</span><span class="nm"><b>${esc(p.name)}${p.id === me ? " (siz)" : ""}${hid(p.id) ? ' <span class="pill">yashirin</span>' : ""}</b><small>${p.today ? '<span class="kdot k"></span> bugun o‘qidi' : '<span class="kdot"></span> bugun hali o‘qimadi'}${p.a1_passed ? " · A1 ✓" : ""}</small></span><span class="vl">${val(p)}<small>${unit}</small></span></li>`).join("")}</ol>
    ${canDuel ? `<div class="section-h"><h2>Duellar</h2><span>10 savol, bir xil test</span></div>
    <div class="cardbox"><p>Do‘stingizni chaqiring: ikkalangizga bir xil 10 ta savol tushadi. Ko‘p to‘g‘ri javob bergan yutadi, teng bo‘lsa tezrog‘i.</p>
      <div class="row">${players.filter(p => p.id !== me).map(p => `<button class="chip" data-vs="${p.id}">${I.swords}${esc(p.name)}</button>`).join("") || '<span class="fc-tr">Guruhda boshqa a’zo hali yo‘q.</span>'}</div>
      ${mine.length ? `<div style="margin-top:10px">${mine.map(duelRow).join("")}</div>` : ""}</div>` : ""}
    <button class="btn ghost wide" id="refresh">Yangilash</button>`;
  $$("[data-b]").forEach(b => b.onclick = () => { board = b.dataset.b; drawRank(); });
  $("#refresh").onclick = () => viewRank();
  $$("[data-vs]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try {
      const ls = studied().map(l => l.id);
      const d = await CL.createDuel({ opponent: b.dataset.vs, seed: Math.floor(Math.random() * 2147483647), lessons: ls.length ? ls : [C.lessons[0].id] });
      go({ v:"duel", d });
    } catch(e){ b.disabled = false; toast("Duel yaratilmadi: " + e.message); }
  });
  $$("[data-play]").forEach(b => b.onclick = () => go({ v:"duel", d: ds.find(x => x.id === +b.dataset.play) }));
}
function seeded(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function duelQuestions(d){
  const R = Math.random; Math.random = seeded(d.seed);
  try {
    const ls = (d.lessons || []).map(id => LESSON_ALL[id]).filter(Boolean);
    const pool = (ls.length ? ls : [C.lessons[0]]).flatMap(l => l.W);
    return sample(pool, 10).map((w, i) => qVocab(w, ["ru2uz","uz2ru","listen","ru2uz","uz2ru"][i % 5], pool));
  } finally { Math.random = R; }
}
function viewDuel(){
  const d = route.d;
  const opp = rankCache && (rankCache.ps.find(p => p.id === (d.creator === CL.user().id ? d.opponent : d.creator)) || {}).name;
  app.innerHTML = `${backBtn("Reyting")}<div class="thead"><div class="eyebrow">Duel</div><h1>${opp ? "Siz va " + esc(opp) : "Duel"}</h1><p>10 savol. Vaqt ham hisoblanadi.</p></div><div id="q"></div>`;
  bindBack();
  const t0 = Date.now();
  runQuiz($("#q"), { questions: duelQuestions(d), onFinish: (sc) => {
    const ms = Date.now() - t0;
    CL.submitResult({ duel_id: d.id, score: sc, ms }).then(() => toast("Natija yuborildi")).catch(e => toast("Natija yuborilmadi: " + e.message));
    return `Vaqt: ${Math.round(ms / 1000)} soniya. Raqibingiz o‘ynagach, natija reytingda chiqadi.`;
  }, after: () => { history_.length = 0; go({ v:"rank" }, false); }, retry: () => toast("Duelni faqat bir marta o‘ynash mumkin.") });
}

    $("#rstY").onclick = () => { S = fresh(); save(); toast("Taraqqiyot o‘chirildi"); go({ v:"home" }, false); };
    $("#rstN").onclick = () => $("#rstC").innerHTML = ""; };
}

if (CL.configured && !CL.user()) route = { v:"login" };
render();
