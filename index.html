grammar:{title:"Stol-DA yoki stol-GA? auf dem Tisch / auf den Tisch",
intro:"O‘zbek tilida <b>qayerda?</b> → -da (stol<b>da</b>), <b>qayerga?</b> → -ga (stol<b>ga</b>). Nemis tilida predlog o‘zgarmaydi (<b>in, auf, an, unter, über, vor, hinter, neben, zwischen</b>), lekin artikl o‘zgaradi:<br>• <b>Wo?</b> (qayerda? — joy, holat) → <b>Dativ</b>: der/das → <b>dem</b>, die → <b>der</b>, ko‘plik → <b>den</b><br>• <b>Wohin?</b> (qayerga? — harakat) → <b>Akkusativ</b>: der → <b>den</b>, die → die, das → das<br><br>Fe’l juftlari ham yordam beradi:<br>• <b>stellen</b> (tik qo‘ymoq) → natija: <b>stehen</b> (tik turmoq)<br>• <b>legen</b> (yotqizib qo‘ymoq) → natija: <b>liegen</b> (yotmoq)<br>• <b>hängen</b> — osmoq ham, osilib turmoq ham<br><br>Qisqartmalar: in dem = <b>im</b>, in das = <b>ins</b>, an dem = <b>am</b>.",
table:[["Shkaf devor <mark>yonida</mark> turibdi. (qayerda?)","Der Schrank <mark>steht</mark> an <mark>der</mark> Wand."],["Shkafni devor<mark>ga</mark> qo‘yaman. (qayerga?)","Ich <mark>stelle</mark> den Schrank an <mark>die</mark> Wand."],["Telefon stol<mark>da</mark> yotibdi.","Das Handy <mark>liegt</mark> auf <mark>dem</mark> Tisch."],["Telefonni stol<mark>ga</mark> qo‘y.","<mark>Leg</mark> das Handy auf <mark>den</mark> Tisch."],["Biz yerto‘la<mark>da</mark>miz.","Wir sind <mark>im</mark> Keller."],["Qutilarni yerto‘la<mark>ga</mark> olib tushamiz.","Wir bringen die Kartons <mark>in den</mark> Keller."]],
tip:"<b>Yodlash usuli:</b> stellen, legen, hängen (harakat) → <b>Akkusativ</b>; stehen, liegen, hängen (holat) → <b>Dativ</b>. Shisha, shkaf, kompyuter <b>turadi</b> (steht); telefon, kitob, gilam <b>yotadi</b> (liegt).<br><b>Germaniyada:</b> e’londagi <b>Kaltmiete</b> — faqat ijara; <b>Warmmiete</b> = ijara + Nebenkosten (isitish, suv, axlat). Kaution ko‘pi bilan <b>uch oylik Kaltmiete</b>. Ko‘p uylarda soat 22:00 dan 6:00 gacha va yakshanba kuni <b>Ruhezeit</b> — shovqin qilish mumkin emas.",
mistakes:[["Der Schrank steht an die Wand.","Der Schrank steht an der Wand.","stehen — qayerda? → Dativ: der."],["Ich stelle die Flasche auf dem Tisch.","Ich stelle die Flasche auf den Tisch.","stellen — qayerga? → Akkusativ: den."],["Das Handy steht auf dem Tisch.","Das Handy liegt auf dem Tisch.","Yotiq narsalar uchun liegen."]]},
dialog:{scene:"Ko‘chish kuni, Leyptsig, to‘rtinchi qavat, lift yo‘q. Sardor shkafni ko‘tarib kirdi. Xotini Shahlo esa hammasini boshqaryapti.", a:"Shahlo", b:"Sardor", lines:`b|Uff! Wohin stelle ich den Schrank?|Uh! Shkafni qayerga qo‘yay?
a|Ins Schlafzimmer. An die Wand, links.|Yotoqxonaga. Devorga, chap tomonga.
b|So? Steht er gut?|Mana shundaymi? Yaxshi turibdimi?
a|Hmm... nein. Stell ihn lieber zwischen die Fenster.|Hmm... yo‘q. Yaxshisi, derazalar orasiga qo‘y.
b|Shahlo! Der Schrank wiegt hundert Kilo!|Shahlo! Shkaf yuz kilo keladi-ya!
a|Ich weiß, Schatz. Und den Teppich legst du ins Wohnzimmer.|Bilaman, jonim. Gilamni esa mehmonxonaga yozasan.
b|Der liegt doch schon im Wohnzimmer!|U allaqachon mehmonxonada yotibdi-ku!
a|Ja, aber unter dem Sofa. Er muss vor das Sofa.|Ha, lekin divan tagida. Divan oldida yotishi kerak.
b|Und wo sind die Schlüssel? Ich habe sie auf einen Karton gelegt!|Kalitlar qani? Ularni bir quti ustiga qo‘ygan edim!
a|Auf welchen Karton? Hier stehen dreißig Kartons!|Qaysi quti ustiga? Bu yerda o‘ttizta quti turibdi!
b|Moment... es klingelt. Wer ist das?|Shoshma... eshik qo‘ng‘irog‘i. Kim ekan?
a|Die Nachbarin. Sie sagt: Ab zweiundzwanzig Uhr ist Ruhezeit!|Qo‘shni ayol. Aytyapti: soat yigirma ikkidan keyin sokinlik vaqti!`},

grammar:{title:"MEN-GA yordam bering → Helfen Sie MIR: Dativ, xuddi o‘zbekchadagi -ga",
intro:"Yaxshi yangilik: bu mavzu o‘zbekchaga juda o‘xshaydi! O‘zbek tilida «kimga?» → <b>-ga</b>: men<b>ga</b>, sen<b>ga</b>, un<b>ga</b>. Nemis tilida bu <b>Dativ</b>:<br>• ich → <b>mir</b> (menga), du → <b>dir</b> (senga)<br>• er → <b>ihm</b>, sie → <b>ihr</b> (unga)<br>• wir → <b>uns</b> (bizga), ihr → <b>euch</b> (sizlarga)<br>• sie → <b>ihnen</b> (ularga), Sie → <b>Ihnen</b> (sizga)<br><br>Ba’zi fe’llar doim Dativ bilan keladi: <b>helfen</b> (menga yordam ber), <b>gehören</b> (menga tegishli), <b>gefallen</b> (menga yoqadi), <b>antworten</b> (menga javob ber), <b>danken</b>.<br>Ikki to‘ldiruvchili fe’llar (<b>geben, schicken, zeigen, leihen</b>): kimga — Dativ, nimani — Akkusativ: Ich schicke <b>dir</b> (kimga?) <b>das Geld</b> (nimani?).",
table:[["<mark>Menga</mark> yordam bering!","Helfen Sie <mark>mir</mark>!"],["Bu karta <mark>sizga</mark> tegishlimi?","Gehört die Karte <mark>Ihnen</mark>?"],["Ilova <mark>menga</mark> yoqadi.","Die App <mark>gefällt mir</mark>."],["<mark>Senga</mark> pul yuboraman.","Ich schicke <mark>dir</mark> Geld."],["<mark>Unga</mark> (erkakka) yuz yevro berdim.","Ich habe <mark>ihm</mark> hundert Euro gegeben."],["<mark>Unga</mark> (ayolga) yordam beramiz.","Wir helfen <mark>ihr</mark>."],["<mark>Bizga</mark> kim yordam beradi?","Wer hilft <mark>uns</mark>?"]],
tip:"<b>gefallen = yoqmoq</b>: o‘zbekchadagi kabi narsa ega bo‘ladi, odam -ga oladi: Ilova <b>menga</b> yoqadi → Die App gefällt <b>mir</b>. Ko‘plikda: Die Schuhe <b>gefallen</b> mir.<br>Ot oldida ham Dativ: <b>dem</b> / <b>der</b> / <b>dem</b>: Ich helfe <b>dem</b> Kollegen, <b>der</b> Kollegin; mein → <b>meinem</b>, meine → <b>meiner</b>.<br><b>Germaniyada:</b> har bir kishi <b>Basiskonto</b> (oddiy hisob) ochish huquqiga ega; pasport va odatda Anmeldung kerak bo‘ladi. Ko‘p kichik do‘kon va kafelar faqat <b>naqd</b> oladi («Nur Barzahlung»). Boshqa bankning bankomatidan pul yechsangiz, Gebühr olinishi mumkin.",
mistakes:[["Ich helfe dich.","Ich helfe dir.","helfen doim Dativ bilan: dir (senga)."],["Ich gefalle die App.","Die App gefällt mir.","O‘zbekchadagi kabi: ilova menga yoqadi — ilova ega."],["Die Karte gehört mich.","Die Karte gehört mir.","gehören + Dativ: mir."]]},
dialog:{scene:"Juma, soat 15:55. Bank filiali soat 16:00 da yopiladi. Bekzod eshikdan yugurib kirdi.", a:"Frau Wolf", b:"Bekzod", lines:`b|Warten Sie! Bitte helfen Sie mir!|Shoshmang! Iltimos, menga yordam bering!
a|Ruhig, ruhig. Wir haben noch fünf Minuten.|Sekin, sekin. Hali besh daqiqa vaqtimiz bor.
b|Der Geldautomat hat meine Karte geschluckt!|Bankomat kartamni yutib yubordi!
a|Oh. Haben Sie die PIN falsch eingegeben?|Voy. PIN kodni noto‘g‘ri kiritdingizmi?
b|Dreimal. Meine Frau hat mir die falsche PIN geschickt!|Uch marta. Xotinim menga noto‘g‘ri PIN yuboribdi!
a|Zeigen Sie mir bitte Ihren Ausweis.|Iltimos, guvohnomangizni menga ko‘rsating.
b|Hier. Geben Sie mir die Karte zurück?|Mana. Kartani menga qaytarib berasizmi?
a|Leider nicht. Sie bekommen eine neue. In zehn Tagen.|Afsuski, yo‘q. Yangisini olasiz. O‘n kundan keyin.
b|Zehn Tage? Ohne Bargeld? Wie soll ich leben?|O‘n kun? Naqd pulsiz? Qanday yashayman?
a|Sie können hier am Schalter Geld abheben.|Shu yerda, kassada pul yechishingiz mumkin.
b|Super! Dann bitte zweihundert Euro.|Zo‘r! Unda ikki yuz yevro, iltimos.
a|Gern. Haben Sie Ihre Bankkarte dabei?|Bajonidil. Bank kartangiz yoningizdami?`},

grammar:{title:"Bera olasizmi? → Bera olARMIDINGIZ? Könnten Sie...? Ich würde gern...",
intro:"O‘zbek tilida iltimosni yumshatish uchun <b>-ardi</b> shakllarini ishlatamiz: «Yordam bera olasizmi?» → «Yordam bera ol<b>armidingiz</b>?»; «xohlayman» → «xohl<b>ardim</b>». Nemis tilida buning uchun <b>Konjunktiv II</b> bor:<br>• können → <b>könnte</b>: <b>Könnten</b> Sie mir helfen?<br>• haben → <b>hätte</b>: Ich <b>hätte</b> eine Frage. Ich <b>hätte gern</b> einen Termin.<br>• sein → <b>wäre</b>: <b>Wäre</b> Montag möglich?<br>• boshqa fe’llar: <b>würde</b> + noaniq shakl gap oxirida: Ich <b>würde gern</b> den Termin <b>verschieben</b>.<br><br>Diqqat: Konjunktiv II da doim <b>umlaut</b> bor (könnte, hätte, wäre, würde). Umlautsiz <b>konnte, hatte, war</b> — bu o‘tgan zamon!",
table:[["Yordam bera ol<mark>armidingiz</mark>?","<mark>Könnten</mark> Sie mir helfen?"],["Bir savolim <mark>bor edi</mark>.","Ich <mark>hätte</mark> eine Frage."],["Qabulga yozilishni <mark>xohlardim</mark>.","Ich <mark>würde gern</mark> einen Termin <mark>machen</mark>."],["Dushanba mumkin <mark>bo‘larmidi</mark>?","<mark>Wäre</mark> Montag möglich?"],["Takrorlab ber<mark>armidingiz</mark>?","<mark>Würden</mark> Sie das bitte <mark>wiederholen</mark>?"],["Qabulni ko‘chir<mark>moqchi edim</mark>.","Ich <mark>würde</mark> den Termin gern <mark>verschieben</mark>."]],
tip:"<b>Telefonda nemislar</b> javob berganda familiyasini aytadi: «Praxis Dr. Braun, Hoffmann am Apparat.» Siz ham shunday boshlang: «Hier ist Nilufar Ismoilova.» Xayrlashish — <b>Auf Wiederhören</b> («yana eshitguncha»).<br><b>Harflab aytish:</b> o‘zbek ismlari nemislarga notanish, shuning uchun harflab aytishga tayyor turing: A wie Anton, B wie Berta, S wie Samuel...<br>Shifokor qabulini kamida <b>24 soat oldin</b> bekor qiling, aks holda ba’zi klinikalar pul talab qilishi mumkin.",
mistakes:[["Ich würde gern einen Termin.","Ich würde gern einen Termin machen.","würde dan keyin asosiy fe’l gap oxirida kerak."],["Konnten Sie mir helfen?","Könnten Sie mir helfen?","konnten (umlautsiz) — o‘tgan zamon. Xushmuomala iltimos — könnten."],["Ich will einen Termin!","Ich hätte gern einen Termin.","«Ich will» qo‘pol eshitiladi; idora va klinikada xushmuomala shaklni ishlating."]]},
dialog:{scene:"Dushanba, ertalab 8:01. Nilufar yarim soatdan beri tish klinikasiga qo‘ng‘iroq qilyapti, liniya doim band edi. Nihoyat kimdir go‘shakni oldi.", a:"Frau Hoffmann", b:"Nilufar", lines:`a|Zahnarztpraxis Dr. Braun, Hoffmann am Apparat.|Doktor Braun tish klinikasi, telefonda Hofman.
b|Endlich! Guten Morgen! Hier ist Nilufar Ismoilova.|Nihoyat! Xayrli tong! Men Nilufar Ismoilova.
a|Wie bitte? Könnten Sie das buchstabieren?|Nima dedingiz? Harflab ayta olarmidingiz?
b|I wie Ida, S wie Samuel... Ach, Nilufar reicht.|I — Ida, S — Samuel... Ey, Nilufar desangiz bo‘ldi.
a|Gut, Frau Nilufar. Was kann ich für Sie tun?|Yaxshi, Nilufar xonim. Sizga qanday yordam bera olaman?
b|Ich hätte morgen um neun einen Termin.|Ertaga soat to‘qqizda qabulim bor edi.
a|Ja, ich sehe ihn hier.|Ha, mana ko‘ryapman.
b|Ich würde ihn gern absagen. Ich habe leider Zahnschmerzen.|Uni bekor qilmoqchi edim. Afsuski, tishim og‘riyapti.
a|Zahnschmerzen? Frau Nilufar, wir sind eine Zahnarztpraxis!|Tish og‘rig‘i? Nilufar xonim, biz tish klinikasimiz-ku!
b|Oh... stimmt. Könnte ich dann heute kommen?|Voy... to‘g‘ri-ya. Unda bugun kelsam bo‘larmidi?
a|Heute ist alles voll. Aber wäre morgen um neun okay?|Bugun hammasi band. Ertaga soat to‘qqiz to‘g‘ri kelarmidi?
b|Perfekt! Das ist ja mein Termin!|Zo‘r! Bu axir mening qabulim-ku!`},

grammar:{title:"Der Zug HATTE Verspätung, wir WAREN müde: Präteritum va Perfekt",
intro:"O‘zbek tilida «edi» so‘zi juda qulay: Venada <b>edim</b>, vaqtim yo‘q <b>edi</b>. Nemis tilida <b>sein</b> va <b>haben</b> so‘zlashuvda ham qisqa o‘tgan zamon — <b>Präteritum</b> — shaklida ishlatiladi:<br>• sein: ich <b>war</b>, du <b>warst</b>, er/sie <b>war</b>, wir <b>waren</b>, ihr <b>wart</b>, sie/Sie <b>waren</b><br>• haben: ich <b>hatte</b>, du <b>hattest</b>, er/sie <b>hatte</b>, wir <b>hatten</b>, ihr <b>hattet</b>, sie/Sie <b>hatten</b><br>• es gibt → es <b>gab</b> (bor edi)<br><br>Qolgan fe’llar uchun so‘zlashuvda <b>Perfekt</b> (A1, 12-dars): haben/sein + Partizip II <b>gap oxirida</b>. Harakat fe’llari <b>sein</b> bilan: <b>gefahren, gegangen, gekommen, gelaufen</b>. Ajraladigan fe’llarda ge- o‘rtaga kiradi: um<b>ge</b>stiegen, an<b>ge</b>kommen, ab<b>ge</b>fahren.",
table:[["Poyezd kechik<mark>di</mark> (kechikishi bor <mark>edi</mark>).","Der Zug <mark>hatte</mark> Verspätung."],["Biz Venada <mark>edik</mark>.","Wir <mark>waren</mark> in Wien."],["Poyezdda Wi-Fi yo‘q <mark>edi</mark>.","Im Zug <mark>gab es</mark> kein WLAN."],["Gannoverda boshqa poyezdga <mark>o‘tdim</mark>.","Ich <mark>bin</mark> in Hannover <mark>umgestiegen</mark>."],["Kyolnga poyezdda <mark>bordik</mark>.","Wir <mark>sind</mark> mit dem Zug nach Köln <mark>gefahren</mark>."],["Ikki soat <mark>kutdik</mark>.","Wir <mark>haben</mark> zwei Stunden <mark>gewartet</mark>."],["U kech <mark>keldi</mark>.","Er <mark>ist</mark> spät <mark>gekommen</mark>."]],
tip:"<b>ich = er:</b> Präteritumda ham ich va er/sie shakli bir xil: ich war — er war, ich hatte — sie hatte.<br><b>Noto‘g‘ri fe’llarni juft qilib yodlang:</b> gehen → <b>gegangen</b>, fahren → <b>gefahren</b>, kommen → <b>gekommen</b>, steigen → <b>gestiegen</b>, laufen → <b>gelaufen</b> (hammasi sein bilan).<br><b>Germaniyada:</b> poyezd <b>60 daqiqadan</b> ko‘p kechiksa, chipta narxining 25 foizini, <b>120 daqiqadan</b> ko‘p kechiksa 50 foizini qaytarib olishingiz mumkin (Fahrgastrechte). Vokzaldagi e’lonlarda eng muhim so‘zlar: <b>Gleisänderung</b> va <b>fällt aus</b>.",
mistakes:[["Wir war in Wien.","Wir waren in Wien.","wir → waren."],["Ich habe in Hannover umgestiegen.","Ich bin in Hannover umgestiegen.","Bir joydan boshqasiga harakat → sein."],["Ich bin umgesteigt.","Ich bin umgestiegen.","steigen — noto‘g‘ri fe’l: gestiegen; ge- o‘rtaga kiradi."]]},

b|Ich bin in einen Regionalzug eingestiegen. Der war so voll!|Mintaqaviy poyezdga chiqdim. U liq to‘la edi!

grammar:{title:"Ein schöner Mantel, die rote Jacke: sifat qo‘shimchalari",
intro:"O‘zbek tilida sifat hech qachon o‘zgarmaydi: «chiroyli palto», «chiroyli palto<b>ni</b>», «chiroyli palto <b>bilan</b>» — faqat ot qo‘shimcha oladi. Nemis tilida esa sifat <b>ot oldida</b> kelsa, albatta qo‘shimcha oladi. A1 da o‘rgangan «Die Jacke ist rot» — bu yerda sifat fe’ldan keyin, shuning uchun o‘zgarmaydi.<br><br>Eng kerakli qoidalar:<br>• <b>der / die / das</b> dan keyin (1-kelishik): doim <b>-e</b>: der neu<b>e</b> Mantel, die rot<b>e</b> Jacke, das klein<b>e</b> Kleid<br>• <b>ein</b> dan keyin sifat jinsni «ko‘rsatadi»: ein neu<b>er</b> Mantel, eine rot<b>e</b> Jacke, ein klein<b>es</b> Kleid<br>• <b>den / einen</b> (der-so‘zlar, tushum kelishigi): <b>-en</b>: Ich kaufe einen warm<b>en</b> Mantel.<br>• <b>dem / der</b> dan keyin (mit, in, von ...) va <b>ko‘plikda</b>: <b>-en</b>: mit dem neu<b>en</b> Handy, die neu<b>en</b> Schuhe",

tip:"<b>Eslab qolish uchun:</b> -en eng ko‘p uchraydigan qo‘shimcha. Ishonchingiz komil bo‘lmasa va so‘z <b>den, dem</b> yoki <b>ko‘plik</b> bilan kelsa — <b>-en</b> qo‘ying. <br><b>Germaniyada:</b> do‘kondan olingan butun (buzilmagan) narsani almashtirish do‘konning majburiyati emas, bu uning yaxshi niyati. Shuning uchun to‘lashdan oldin so‘rang: «Kann ich das umtauschen?» va <b>Kassenbon</b>ni saqlang. Aksiyadagi (reduziert) narsalar ko‘pincha almashtirilmaydi. Internetdan olingan narsani esa 14 kun ichida qaytarish mumkin.",

grammar:{title:"Ich fühle MICH gut: reflexiv fe’llar (sich)",
intro:"O‘zbek tilida harakat o‘zimizga qaytsa, fe’lga <b>-in, -il</b> qo‘shiladi yoki «o‘zini» so‘zi ishlatiladi: yuv<b>in</b>moq, kiy<b>in</b>moq, «o‘z<b>imni</b> yaxshi his qilyapman». Nemis tilida buning uchun <b>sich</b> («o‘zini») so‘zi bor va u egaga qarab o‘zgaradi:<br>ich fühle <b>mich</b>, du fühlst <b>dich</b>, er/sie fühlt <b>sich</b>, wir fühlen <b>uns</b>, ihr fühlt <b>euch</b>, sie/Sie fühlen <b>sich</b>.<br><br>• <b>sich</b> fe’ldan keyin turadi: Ich <b>erkälte mich</b> oft.<br>• Perfektda — doim <b>haben</b> bilan: Ich <b>habe mich</b> erkältet.<br>• ajraladigan fe’llarda bo‘lak oxirga ketadi: Ich ruhe <b>mich</b> <b>aus</b>. Ich melde <b>mich</b> <b>an</b>.<br>• modal fe’l bilan: Sie müssen <b>sich</b> ausruhen.",
table:[["O‘zimni yomon <mark>his qilyapman</mark>.","Ich <mark>fühle mich</mark> schlecht."],["Qanday <mark>his qilyapsiz</mark>?","Wie <mark>fühlen Sie sich</mark>?"],["Shamolla<mark>dingmi</mark>?","Hast du <mark>dich erkältet</mark>?"],["U dam <mark>olishi kerak</mark>.","Er muss <mark>sich ausruhen</mark>."],["Qabulxonada ro‘yxatdan <mark>o‘tamiz</mark>.","Wir <mark>melden uns</mark> an der Rezeption <mark>an</mark>."],["<mark>Xavotirlanmang</mark>!","Machen Sie <mark>sich</mark> keine Sorgen!"],["men – o‘zimni, sen – o‘zingni ...","ich → <mark>mich</mark>, du → <mark>dich</mark>, er/sie → <mark>sich</mark>, wir → <mark>uns</mark>"]],
tip:"<b>Lug‘atda «sich» bilan yodlang!</b> Ba’zi fe’llar nemischada reflexiv, o‘zbekchada esa yo‘q: sich erkälten (shamollamoq), sich beeilen (shoshilmoq), sich freuen (xursand bo‘lmoq). <br><b>Germaniyada:</b> kasal bo‘lsangiz, birinchi kuniyoq ish beruvchiga xabar bering. 3 kundan ortiq kasal bo‘lsangiz, shifokorning <b>Krankmeldung</b>i kerak (ba’zi firmalar uni birinchi kundan so‘raydi); hozir shifokor uni sug‘urta kassasiga elektron yuboradi. Retseptli dori uchun odatda 5–10 yevro <b>Zuzahlung</b> to‘lanadi. Kechasi dori kerak bo‘lsa — <b>Notapotheke</b>: manzili har bir dorixona eshigida yozilgan bo‘ladi.",
mistakes:[["Ich fühle gut.","Ich fühle mich gut.","sich fühlen: «mich» tushib qolmaydi."],["Er ruht mich aus.","Er ruht sich aus.","er/sie → sich."],["Ich bin mich erkältet.","Ich habe mich erkältet.","Reflexiv fe’llar Perfektda doim haben bilan."]]},
dialog:{scene:"Myunxen, tungi soat ikki, kasalxonaning shoshilinch yordam bo‘limi. Ikki metrli Sardor barmog‘ini qo‘li bilan mahkam ushlab kirib keldi.", a:"Schwester Petra", b:"Sardor", lines:`a|Guten Abend. Was ist passiert?|Xayrli kech. Nima bo‘ldi?
b|Ich habe mich verletzt. Mit dem Messer. Beim Kochen.|Jarohatlandim. Pichoq bilan. Ovqat qilayotganda.
a|Um zwei Uhr nachts? Haben Sie Ihre Versicherungskarte?|Tungi soat ikkida-ya? Sug‘urta kartangiz bormi?
b|Ja, hier. Wir haben Gäste. Ich habe Plov gekocht.|Ha, mana. Uyda mehmonlar bor. Palov qilayotgan edim.
a|Zeigen Sie mal... Oh, das blutet stark. Wie fühlen Sie sich?|Ko‘rsating-chi... Voy, qon ko‘p ketyapti. O‘zingizni qanday his qilyapsiz?
b|Ein bisschen schwindlig. Aber es geht.|Biroz boshim aylanyapti. Lekin chidasa bo‘ladi.
a|Setzen Sie sich, bitte. Sie bekommen eine Spritze.|O‘tiring, iltimos. Sizga ukol qilamiz.
b|Eine Spritze?! Nein, nein. Ein Pflaster reicht!|Ukol?! Yo‘q, yo‘q. Plastir yetadi!
a|Herr Rahimov, Sie sind zwei Meter groß und haben Angst?|Rahimov janoblari, bo‘yingiz ikki metr-u, qo‘rqyapsizmi?
b|Nur vor Spritzen. Und vor meiner Frau.|Faqat ukoldan. Yana xotinimdan.
a|Vor Ihrer Frau? Warum denn?|Xotiningizdanmi? Nega endi?
b|Der Plov steht noch auf dem Herd!|Palov hali ham plitada turibdi!`},

grammar:{title:"WENN ich Zeit habe ... ALS ich klein war ...: «-ganda» ikki xil",
intro:"O‘zbek tilida bitta qo‘shimcha bor: «-ganda» (kel<b>ganda</b>, bo‘l<b>ganda</b>). Nemis tilida ikki so‘z: <b>wenn</b> va <b>als</b>. Yaxshi xabar: bu ergash gaplarda fe’l <b>gap oxiriga</b> ketadi — xuddi o‘zbekchadagidek: ... wenn ich Zeit <b>habe</b>.<br><br>• <b>als</b> — o‘tmishda <b>bir marta</b> bo‘lgan voqea yoki bir davr: <b>Als</b> ich klein <b>war</b> ... <b>Als</b> ich nach Deutschland <b>gekommen bin</b> ...<br>• <b>wenn</b> — hozirgi va kelasi zamon (ko‘pincha «agar» ma’nosida ham) va o‘tmishda <b>ko‘p marta</b> takrorlangan voqea: <b>Wenn</b> ich Zeit <b>habe</b> ... (Immer) <b>wenn</b> Oma <b>kam</b> ...<br><br><b>So‘z tartibi:</b> ergash gap birinchi kelsa, bosh gapning fe’li darhol verguldan keyin turadi: Wenn ich Zeit habe, <b>komme</b> ich. (fe’l, vergul, fe’l)",
table:[["Vaqtim <mark>bo‘lsa</mark>, kelaman.","<mark>Wenn</mark> ich Zeit <mark>habe</mark>, komme ich."],["Ramazon <mark>tugaganda</mark>, hayit qilamiz.","<mark>Wenn</mark> der Ramadan zu Ende <mark>ist</mark>, feiern wir."],["<mark>Bolaligimda</mark> Navro‘zni yaxshi ko‘rardim.","<mark>Als</mark> ich klein <mark>war</mark>, habe ich Navruz geliebt."],["Germaniyaga <mark>kelganimda</mark>, 25 yoshda edim.","<mark>Als</mark> ich nach Deutschland <mark>gekommen bin</mark>, war ich 25."],["<mark>Har safar</mark> onam qo‘ng‘iroq <mark>qilganda</mark>, yig‘lardim.","<mark>Immer wenn</mark> meine Mutter <mark>angerufen hat</mark>, habe ich geweint."],["Mehmon <mark>kelganda</mark>, choy qo‘yamiz.","<mark>Wenn</mark> Gäste <mark>kommen</mark>, machen wir Tee."]],
tip:"<b>Eslab qolish uchun:</b> «als = o‘tmishda bir marta». Qolgan hamma holatda — <b>wenn</b>. <br><b>Germaniyada:</b> asosiy bayramlar — Weihnachten (24–26-dekabr), Silvester (31-dekabr), Ostern (bahorda). Musulmonlar Zuckerfest (Ramazon hayiti) va Opferfest (Qurbon hayiti)ni nishonlaydi; bu kunlar rasmiy dam olish kuni emas, lekin oldindan so‘rasangiz, ko‘p ish beruvchilar ta’til beradi. Mehmonga aytilgan vaqtda borish odob; kechiksangiz, xabar bering. Taklifga javob: «Danke für die Einladung! Ich komme gern.»",
mistakes:[["Als ich Zeit habe, komme ich.","Wenn ich Zeit habe, komme ich.","Hozirgi va kelasi zamonda — wenn."],["Wenn ich ein Kind war, ...","Als ich ein Kind war, ...","O‘tmishdagi bir davr — als."],["Wenn ich habe Zeit, ich komme.","Wenn ich Zeit habe, komme ich.","Ergash gapda fe’l oxirida, bosh gapda fe’l verguldan keyin darhol."]]},
dialog:{scene:"Shtutgart, ko‘p qavatli uyning zinapoyasi. Ramazonning oxirgi kunlari. Gulnora qo‘shnisi Shults janoblarini hayitga chaqirmoqchi. Shults janoblari har kuni kechqurun uning oshxonasidan kelayotgan hidni sezib yuradi.", a:"Herr Schulz", b:"Gulnora", lines:`b|Herr Schulz! Warten Sie! Eine Einladung für Sie.|Shults janoblari! Shoshmang! Siz uchun taklifnoma.
a|Für mich? Oh, wie nett! Was feiern Sie denn?|Mengami? Voy, qanday yoqimli! Nimani nishonlayapsizlar?
b|Das Zuckerfest. Wenn der Ramadan zu Ende ist, feiern wir.|Ramazon hayitini. Ramazon tugaganda, bayram qilamiz.
a|Ach, deshalb kochen Sie immer so spät!|A-a, shuning uchun doim kechasi ovqat pishirasiz-da!
b|Genau. Wir essen erst, wenn die Sonne untergeht.|Xuddi shunday. Quyosh botgandagina ovqatlanamiz.
a|Als ich gestern Ihren Plov gerochen habe, hatte ich sofort Hunger!|Kecha palovingiz hidini sezganimda, darrov qornim ochib ketdi!
b|Dann kommen Sie am Sonntag! Um sechs Uhr.|Unda yakshanba kuni keling! Soat oltida.
a|Gern! Was soll ich mitbringen? Blumen? Kuchen?|Bajonidil! Nima olib kelay? Gulmi? Pirogmi?
b|Nichts! Bringen Sie nur Hunger mit.|Hech narsa! Faqat qorningizni och qilib keling.
a|Hunger? Kein Problem. Ich faste ab morgen früh!|Ochlikmi? Muammo yo‘q. Ertaga ertalabdan ro‘za tutaman!
b|Sie? Fasten? Bis sechs Uhr abends?|Siz-a? Ro‘za? Kechki oltigacha-ya?
a|Na ja... wenn ich nicht frühstücke. Mal sehen!|Xo‘sh... agar nonushta qilmasam. Ko‘ramiz-da!`},

grammar:{title:"Tez-ROQ → schnell-ER, ENG tez → AM schnell-STEN",
intro:"O‘zbek tilida solishtirish uchun <b>-roq</b> qo‘shimchasi va <b>eng</b> so‘zi bor: tez → tez<b>roq</b> → <b>eng</b> tez. Nemis tilida ham shunga o‘xshash: <b>-er</b> qo‘shimchasi va <b>am ...-sten</b>: schnell → schnell<b>er</b> → <b>am</b> schnell<b>sten</b>.<br><br>• «...dan» (Men akam<b>dan</b> balandroqman) → <b>als</b>: Ich bin größer <b>als</b> mein Bruder.<br>• teng bo‘lsa (akam<b>dek</b>, akam<b>chalik</b>) → <b>so ... wie</b>, sifat o‘zgarmaydi: Ich bin <b>so</b> groß <b>wie</b> mein Bruder.<br>• qisqa sifatlar ko‘pincha umlaut oladi: alt → <b>ä</b>lter, jung → j<b>ü</b>nger, groß → gr<b>ö</b>ßer, warm → w<b>ä</b>rmer.<br>• yodlash kerak: gut → <b>besser</b> → am <b>besten</b>; gern → <b>lieber</b> → am <b>liebsten</b>; viel → <b>mehr</b> → am <b>meisten</b>.",
table:[["tez → tez<mark>roq</mark> → <mark>eng</mark> tez","schnell → schnell<mark>er</mark> → <mark>am</mark> schnell<mark>sten</mark>"],["Men akam<mark>dan</mark> baland<mark>roq</mark>man.","Ich bin größ<mark>er als</mark> mein Bruder."],["Futbol voleyboldan qiziqarli<mark>roq</mark>.","Fußball ist interessant<mark>er als</mark> Volleyball."],["Men suzishni <mark>eng</mark> yaxshi ko‘raman.","Ich schwimme <mark>am liebsten</mark>."],["U men<mark>chalik</mark> tez yugura olmaydi.","Er läuft nicht <mark>so</mark> schnell <mark>wie</mark> ich."],["yaxshi → yaxshiroq → eng yaxshi","gut → <mark>besser</mark> → am <mark>besten</mark>"],["ko‘p → ko‘proq → eng ko‘p","viel → <mark>mehr</mark> → am <mark>meisten</mark>"]],
tip:"<b>Diqqat:</b> bu yerdagi <b>als</b> = «...dan». 9-darsdagi «-ganda» ma’nosidagi als bilan adashtirmang: gapdagi -er ga qarang. Teng bo‘lsa, -er qo‘shilmaydi: so schnell wie (so schneller wie emas!). <br><b>Germaniyada:</b> sport bilan arzon shug‘ullanishning yo‘li — <b>Verein</b> (klub): a’zolik badali odatda oyiga 10–30 yevro, ko‘pincha fitnes zaldan arzon. Agar Jobcenter yoki Wohngeld olsangiz, bolalaringizning klub badali uchun «Bildung und Teilhabe» dasturidan oyiga 15 yevrogacha yordam so‘rashingiz mumkin.",
mistakes:[["Er ist größer wie ich.","Er ist größer als ich.","-er dan keyin: als."],["Ich schwimme gerner.","Ich schwimme lieber.","gern → lieber → am liebsten."],["Er ist so größer wie ich.","Er ist so groß wie ich.","so ... wie oddiy shakl bilan."]]},

grammar:{title:"Ich WERDE Geld sparen. Ich freue mich AUF den Urlaub.",
intro:"<b>1. Kelasi zamon (Futur):</b> o‘zbek tilida fe’lga qo‘shimcha qo‘shamiz: yig‘<b>aman</b>, o‘rgan<b>aman</b>. Nemis tilida <b>werden</b> 2-o‘rinda, asosiy fe’l esa noaniq shaklda <b>gap oxirida</b> — xuddi modal fe’llardagidek: Ich <b>werde</b> Geld <b>sparen</b>.<br>Tuslanishi: ich <b>werde</b>, du <b>wirst</b>, er/sie <b>wird</b>, wir <b>werden</b>, ihr <b>werdet</b>, sie/Sie <b>werden</b>.<br>werden yolg‘iz kelsa — «bo‘lmoq»: Mein Sohn <b>wird</b> Arzt. (O‘g‘lim shifokor bo‘ladi.)<br><br><b>2. Predlogli fe’llar:</b> o‘zbek tilida kelishik qo‘shimchasi ishlatamiz: avtobus<b>ni</b> kutyapman, oilam <b>haqida</b> o‘ylayman. Nemis tilida fe’l bilan doim bir xil predlog keladi — ularni birga yodlang: warten <b>auf</b>, denken <b>an</b>, sich freuen <b>auf</b> / <b>über</b>, träumen <b>von</b>, sich interessieren <b>für</b>.",
table:[["Pul <mark>yig‘aman</mark>.","Ich <mark>werde</mark> Geld <mark>sparen</mark>."],["U ingliz tilini <mark>o‘rganadi</mark>.","Sie <mark>wird</mark> Englisch <mark>lernen</mark>."],["Yozda turmush <mark>quramiz</mark>.","Wir <mark>werden</mark> im Sommer <mark>heiraten</mark>."],["Avtobus<mark>ni</mark> kutyapman.","Ich <mark>warte auf</mark> den Bus."],["Oilam <mark>haqida</mark> o‘ylayman.","Ich <mark>denke an</mark> meine Familie."],["Ta’til<mark>ni</mark> intiqlik bilan kutyapman.","Ich <mark>freue mich auf</mark> den Urlaub."],["Sovg‘a<mark>dan</mark> xursandman.","Ich <mark>freue mich über</mark> das Geschenk."]],
tip:"<b>auf yoki über?</b> sich freuen <b>auf</b> — hali bo‘lmagan, kelajakdagi narsa (ta’til, to‘y). sich freuen <b>über</b> — bo‘lgan, qo‘lga kelgan narsa (sovg‘a, yaxshi xabar). <br><b>Savol berish:</b> narsa haqida — <b>wo(r)</b> + predlog: <b>Worauf</b> wartest du? <b>Woran</b> denkst du? Odam haqida — predlog + wen: <b>Auf wen</b> wartest du? <b>An wen</b> denkst du? <br><b>Kundalik nutqda</b> nemislar kelajak uchun ko‘pincha hozirgi zamon va vaqt so‘zini ishlatadi: Morgen fahre ich nach Köln. werden esa reja, va’da va taxmin uchun: Ich werde dir helfen.",
mistakes:[["Ich werde sparen Geld.","Ich werde Geld sparen.","Asosiy fe’l gap oxirida."],["Ich warte für den Bus.","Ich warte auf den Bus.","warten auf — predlogni fe’l bilan birga yodlang."],["Er werdet kommen.","Er wird kommen.","er/sie → wird."]]},
dialog:{scene:"Nyurnberg aeroporti, kelish zali. Bobur Toshkentdan uchib kelayotgan onasini kutyapti. Qo‘lida katta guldasta. Hamkasbi Liza ham u bilan birga kelgan.", a:"Lisa", b:"Bobur", lines:`a|Bobur, was ist los? Du bist so nervös.|Bobur, nima gap? Juda hayajonlanyapsan.
b|Ich warte auf meine Mutter. Sie kommt heute aus Taschkent!|Onamni kutyapman. Bugun Toshkentdan keladi!
a|Wie schön! Du freust dich bestimmt.|Qanday yaxshi! Albatta xursand bo‘lsang kerak.
b|Total! Ich habe sie drei Jahre nicht gesehen.|Juda ham! Uni uch yil ko‘rmadim.
a|Und was werdet ihr zusammen machen?|Birga nima qilasizlar?
b|Ich werde ihr alles zeigen. Die Stadt, meine Arbeit...|Unga hammasini ko‘rsataman. Shaharni, ishimni...
a|Und deine Pläne? Wirst du hierbleiben?|Rejalaring-chi? Shu yerda qolasanmi?
b|Ja. Nach der Prüfung werde ich als Pfleger arbeiten.|Ha. Imtihondan keyin hamshira bo‘lib ishlayman.
a|Super! Und hat deine Mutter auch Pläne?|Zo‘r! Onangning ham rejalari bormi?
b|Oh ja. Sie denkt nur an eine Sache.|Ha, bor. U faqat bitta narsani o‘ylaydi.
a|Woran denn?|Nimani axir?
b|An meine Hochzeit. Sie bringt Fotos von zehn Mädchen mit!|To‘yimni. O‘nta qizning rasmini olib kelyapti!`},

tip:"<b>Qisqa shakllar:</b> so‘zlashuvda doim qisqartiriladi: I’m, you’re, he’s, she’s, we’re, they’re. <br><b>you = sen ham, siz ham.</b> Ingliz tilida farq yo‘q! Hurmat so‘z bilan emas, ohang va <b>please, thank you, excuse me</b> bilan bildiriladi. <br><b>-dan → from:</b> o‘zbekchada qo‘shimcha so‘z oxirida (Toshkent<b>dan</b>), inglizchada esa so‘z oldida: <b>from</b> Tashkent.",
mistakes:[["I Aziz.","I am Aziz.","Ingliz tilida am / is / are tushirib qoldirilmaydi."],["He are from London.","He is from London.","he / she / it → is."],["Where you are from?","Where are you from?","Savolda are oldinga chiqadi."]]},
dialog:{scene:"Londondagi ombor, birinchi ish kuni. Tanaffus, choy apparati oldida navbat.", a:"Emma", b:"Aziz", lines:`a|Hi! Are you new here?|Salom! Yangi kelganmisiz?

a|So... where are you from? Turkey?|Xo‘sh... qayerdansiz? Turkiyadanmi?
b|No, no! I’m from Uzbekistan. From Samarkand.|Yo‘q, yo‘q! O‘zbekistondanman. Samarqanddan.
a|Samarkand? Wow! Is it beautiful?|Samarqand? Voy! Chiroylimi?

b|London is rainy too!|London ham yomg‘irli-ku!

b|Thank you! Oh, sorry... is this your tea?|Rahmat! Voy, kechirasiz... bu sizning choyingizmidi?`},

grammar:{title:"Mening akam BOR → I HAVE GOT a brother; Aziz-NING → Aziz’S",
intro:"O‘zbek tilida «bor» gap oxirida keladi: Mening akam <b>bor</b>. Ingliz tilida esa ega (kimda bor) gap boshida, keyin <b>have got</b> fe’li: <b>I have got</b> a brother (so‘zma-so‘z: «men akaga egaman»).<br>• I, you, we, they → <b>have got</b> (qisqasi: I’ve got)<br>• he, she, it → <b>has got</b> (qisqasi: she’s got)<br>Inkor: haven’t got / hasn’t got. Savol: <b>Have</b> you <b>got</b>...?<br><br><b>-ning → ’s:</b> o‘zbekcha Aziz<b>ning</b> opasi = Aziz<b>’s</b> sister. Tartib ham bir xil: avval egasi, keyin narsa!",
table:[["Mening akam <mark>bor</mark>","I <mark>have got</mark> a brother"],["Uning (Tomning) qizi <mark>bor</mark>","He <mark>has got</mark> a daughter"],["Farzandlaringiz <mark>bormi</mark>?","<mark>Have</mark> you <mark>got</mark> children?"],["Mening mashinam <mark>yo‘q</mark>","I <mark>haven’t got</mark> a car"],["Aziz<mark>ning</mark> opasi","Aziz<mark>’s</mark> sister"],["Tom va <mark>uning</mark> xotini","Tom and <mark>his</mark> wife"],["Malika va <mark>uning</mark> eri","Malika and <mark>her</mark> husband"]],
tip:"<b>his yoki her?</b> O‘zbekchada «uning» bitta, inglizchada ikkita. Egasi <b>erkak</b> bo‘lsa — <b>his</b>, <b>ayol</b> bo‘lsa — <b>her</b>. Narsaga qaramang, egasiga qarang: Malika and <b>her</b> brother. <br><b>Amerikada</b> ko‘pincha got’siz aytiladi: I <b>have</b> a brother. Ikkalasi ham to‘g‘ri. <br><b>brother, sister:</b> aka-uka, opa-singilni ajratmaydi. Kerak bo‘lsa: older brother (aka), younger sister (singil).",
mistakes:[["She have got a son.","She has got a son.","he / she / it → has got."],["Malika and his husband","Malika and her husband","Egasi ayol bo‘lsa: her."],["I have 25 years.","I’m 25 years old.","Yosh to be bilan aytiladi: I am ... years old."]]},

grammar:{title:"Ikki olma → two apple-S: sondan keyin ham ko‘plik",
intro:"O‘zbek tilida sondan keyin ko‘plik qo‘shimchasi qo‘shilmaydi: ikki olma, besh kishi (ikki olma<b>lar</b> demaymiz). Ingliz tilida esa aksincha: birdan ko‘p bo‘lsa, <b>doim -s</b> qo‘shiladi: two apple<b>s</b>, five pound<b>s</b>.<br>• oddiy holat: <b>-s</b> → bags, phones<br>• -s, -x, -sh, -ch bilan tugasa: <b>-es</b> → box<b>es</b>, bus<b>es</b>, watch<b>es</b><br>• noto‘g‘ri ko‘plik (yodlang!): man → <b>men</b>, woman → <b>women</b>, child → <b>children</b>, person → <b>people</b><br><br>Narx so‘rash: bitta narsa — <b>How much is</b>...? ko‘p narsa — <b>How much are</b>...?",

grammar:{title:"Present Simple: ishla-YMAN → I work, ishla-YDI → he work-S",
intro:"Yaxshi xabar: ingliz fe’li o‘zbek fe’lidan ancha oson! O‘zbekchada har shaxsga qo‘shimcha bor: ishla<b>yman</b>, ishla<b>ysan</b>, ishla<b>ydi</b>... Ingliz tilida fe’l <b>deyarli o‘zgarmaydi</b>: I work, you work, we work, they work. Faqat bitta qoida: <b>he, she, it</b> bilan fe’lga <b>-s</b> qo‘shiladi: she work<b>s</b> (o‘zbekcha -di kabi).<br>• -sh, -ch, -o bilan tugasa: <b>-es</b> → watch<b>es</b>, go<b>es</b>, do<b>es</b><br>• undosh + y: <b>-ies</b> → study → stud<b>ies</b><br>Inkor (o‘zbekcha -ma-): <b>don’t</b> / <b>doesn’t</b> + fe’l: I <b>don’t</b> work, she <b>doesn’t</b> work.<br><br><b>Kasb oldidan a / an:</b> o‘zbekchada «Men haydovchiman», inglizchada esa <b>a</b> qo‘shiladi: I am <b>a</b> driver.",
table:[["men ishla<mark>yman</mark>","I work"],["siz ishla<mark>ysiz</mark>","you work"],["u ishla<mark>ydi</mark>","he / she work<mark>s</mark>"],["biz ishla<mark>ymiz</mark>, ular ishla<mark>ydi</mark>","we / they work"],["u ishla<mark>ma</mark>ydi","she <mark>doesn’t</mark> work"],["Men haydovchi<mark>man</mark>","I am <mark>a</mark> driver"],["U muhandis","He is <mark>an</mark> engineer"]],
tip:"<b>a yoki an?</b> Harfga emas, tovushga qarang: unli tovushdan oldin <b>an</b> (an engineer, an office), undoshdan oldin <b>a</b> (a nurse, a driver). <br><b>What do you do?</b> = Kasbingiz nima? (so‘zma-so‘z: «nima qilasiz?»). <br><b>work as</b> = ... bo‘lib ishlamoq: I work <b>as a</b> cleaner. <br><b>I’m looking for a job</b> — ish qidirayotganda eng kerakli gap, yodlab oling.",

grammar:{title:"Soat yetti-DA → AT seven; ishlaysiz-MI? → DO you work?",
intro:"<b>Soat:</b> o‘zbekcha -da qo‘shimchasi o‘rniga inglizchada <b>at</b> so‘zi oldinda keladi: soat yetti<b>da</b> → <b>at</b> seven (o’clock). Yarim: <b>half past</b> seven = 7:30 (so‘zma-so‘z «yettidan yarim o‘tdi»).<br><br><b>Qanchalik tez-tez:</b> always (doim), usually (odatda), often (tez-tez), sometimes (ba’zan), never (hech qachon). Ular <b>fe’ldan oldin</b> turadi: I <b>usually</b> get up at seven. Lekin am / is / are dan <b>keyin</b>: He is <b>never</b> late.<br><br><b>Savol:</b> o‘zbekchada fe’lga -mi qo‘shamiz: ishlaysiz<b>mi</b>? Inglizchada gap boshiga <b>Do</b> qo‘yiladi, he / she / it bilan <b>Does</b>: <b>Does</b> she work? (does dan keyin fe’lda -s yo‘q!).",
table:[["soat yetti<mark>da</mark>","<mark>at</mark> seven o’clock"],["soat sakkiz yarim<mark>da</mark>","<mark>at half past</mark> eight"],["Men <mark>odatda</mark> yettida turaman","I <mark>usually</mark> get up at seven"],["U <mark>hech qachon</mark> kechikmaydi","He is <mark>never</mark> late"],["Ishlaysiz<mark>mi</mark>?","<mark>Do</mark> you work?"],["U ishlaydi<mark>mi</mark>?","<mark>Does</mark> she work?"],["Soat <mark>nechada</mark> turasiz?","<mark>What time</mark> do you get up?"]],
tip:"<b>never o‘zi inkor:</b> o‘zbekchada «hech qachon kechik<b>ma</b>ydi» — ikki inkor. Inglizchada bittasi yetadi: He <b>never</b> smokes (don’t kerak emas). <br><b>Predloglar:</b> soat bilan <b>at</b> (at 7), kun bilan <b>on</b> (on Monday), kun qismi bilan <b>in</b> (in the morning), lekin <b>at night</b>. Hafta kunlari doim katta harf bilan yoziladi. <br><b>Qisqa javob:</b> Do you work? — Yes, I do. / No, I don’t.",
mistakes:[["I get up in 7 o’clock.","I get up at 7 o’clock.","Soat bilan doim at."],["Does he works?","Does he work?","does dan keyin fe’l -s olmaydi."],["I don’t never sleep late.","I never sleep late.","never o‘zi inkor, don’t kerak emas."]]},
dialog:{scene:"Londondagi uy. Shahzod ijaraga xona ko‘ryapti. Uy egasi — qat’iy tartibli keksa ayol, missis Xarris.", a:"Mrs Harris", b:"Shahzod", lines:`a|So, Shahzod. Do you work in the morning?|Xo‘sh, Shahzod. Ertalab ishlaysizmi?

b|Usually at half past eleven.|Odatda soat o‘n bir yarimda.
a|Half past eleven?! I go to bed at nine!|O‘n bir yarimda?! Men soat to‘qqizda yotaman!

a|Hmm. Do you smoke?|Hmm. Chekasizmi?

grammar:{title:"I’d like SOME water: sanaladigan va sanalmaydigan otlar",
intro:"O‘zbek tilida «ozgina suv», «bir nechta olma» deymiz. Ingliz tilida otlar ikki guruhga bo‘linadi:<br>• <b>sanaladigan</b>: an apple, two apple<b>s</b>, an egg, three eggs<br>• <b>sanalmaydigan</b>: water, milk, bread, rice, sugar, money — ular <b>-s</b> olmaydi va oldidan <b>a / an</b> qo‘yilmaydi<br><br><b>some</b> = «biroz, bir nechta» — oddiy gapda va iltimosda: I’d like <b>some</b> water. <br><b>any</b> — savol va inkorda: Have you got <b>any</b> milk? — No, we haven’t got <b>any</b>.<br><br><b>Buyurtma:</b> <b>I’d like...</b> (= I would like, «... xohlardim») va <b>Can I have...?</b> («... bersangiz?»). <b>I want</b> esa kafeda qo‘pol eshitiladi.",

grammar:{title:"Ko‘chada bank BOR → There is a bank; bankning YONIDA → NEXT TO the bank",
intro:"O‘zbek tilida «Ko‘chada bank <b>bor</b>» deymiz, «bor» gap oxirida. Ingliz tilida «bor» gap <b>boshida</b> turadi: <b>There is</b> a bank in the street.<br>• bitta narsa: <b>there is</b> (qisqasi: there’s) a bank<br>• bir nechta narsa: <b>there are</b> two cafes<br>• savolda o‘rin almashadi: <b>Is there</b> a bank? <b>Are there</b> any cafes?<br>• yo‘q bo‘lsa: There <b>isn’t</b> a bank. There <b>aren’t</b> any cafes.<br><br><b>Joy ko‘makchilari</b> o‘zbekchada otdan <b>keyin</b> keladi (bankning <b>yonida</b>), inglizchada otdan <b>oldin</b>: <b>next to</b> the bank, <b>opposite</b> the park, <b>between</b> the bank <b>and</b> the hotel.<br><br><b>Buyruq</b> juda oson: fe’lning o‘zi, egasiz: <b>Turn</b> left! <b>Go</b> straight on! Hurmat uchun oxiriga <b>please</b> qo‘shing.",
table:[["Ko‘chada bank <mark>bor</mark>.","<mark>There is</mark> a bank in the street."],["Vokzal yaqinida ikkita kafe <mark>bor</mark>.","<mark>There are</mark> two cafes near the station."],["Shu yaqinda dorixona <mark>bormi</mark>?","<mark>Is there</mark> a pharmacy near here?"],["bank<mark>ning yonida</mark>","<mark>next to</mark> the bank"],["park<mark>ning qarshisida</mark>","<mark>opposite</mark> the park"],["bank <mark>bilan</mark> pochta<mark>ning orasida</mark>","<mark>between</mark> the bank <mark>and</mark> the post office"],["Chapga <mark>buriling</mark>!","<mark>Turn</mark> left, please!"]],
tip:"<b>a yoki the?</b> Birinchi marta, «qandaydir bitta» ma’nosida <b>a</b>: There is <b>a</b> bank. Hamma biladigan aniq joy oldida <b>the</b>: Where is <b>the</b> station? (shahardagi o‘sha vokzal). <br><b>Britaniya va Amerika:</b> dorixona Britaniyada ko‘pincha <b>chemist’s</b>, AQShda <b>drugstore</b>; hojatxona AQShda <b>restroom</b>; metro Londonda <b>the Tube</b>, Nyu-Yorkda <b>subway</b>. <br><b>Yo‘l so‘rashning eng oson yo‘li:</b> Excuse me, where is ...? Tushunmasangiz: Sorry, can you say that again, please?",

dialog:{scene:"London, yakshanba ertalab. Jasur oyisiga sovg‘a jo‘natmoqchi va ko‘chada keksa ayoldan pochtani so‘raydi.", a:"Jasur", b:"Mrs Brown", lines:`a|Excuse me! Is there a post office near here?|Kechirasiz! Shu yaqinda pochta bormi?
b|A post office? Hmm... Yes, there is. In Park Street.|Pochta? Hmm... Ha, bor. Park ko‘chasida.
a|Great! How do I get to Park Street?|Zo‘r! Park ko‘chasiga qanday borsam bo‘ladi?
b|Go straight on. Then turn left at the traffic lights.|To‘g‘riga yuring. Keyin svetoforda chapga buriling.
a|Straight on, then left... OK.|To‘g‘riga, keyin chapga... Xo‘p.

a|Opposite the museum, next to the bank. Is it far?|Muzeyning qarshisida, bankning yonida. Uzoqmi?
b|No, no. Five minutes. But why the post office?|Yo‘q, yo‘q. Besh daqiqa. Lekin pochta nimaga kerak?
a|I have a present for my mum in Tashkent.|Toshkentdagi oyimga sovg‘am bor.
b|Oh, how nice! But wait... today is Sunday.|Voy, qanday yaxshi! Lekin shoshmang... bugun yakshanba-ku.
a|And?|Xo‘sh?
b|It’s closed, dear! Come back tomorrow.|Yopiq-da, bolam! Ertaga keling.`},

grammar:{title:"Bu xona → THIS room, bu xonalar → THESE rooms; Is there...? How many...?",
intro:"O‘zbek tilida yaqin narsaga <b>bu</b>, uzoq narsaga <b>u, ana u</b> deymiz. Ingliz tilida ham shunday: <b>this</b> (bu) va <b>that</b> (ana u). Farqi: ko‘plikda o‘zbekcha «bu» o‘zgarmaydi (bu xona<b>lar</b>), inglizchada esa so‘zning o‘zi ham o‘zgaradi:<br>• yaqin: <b>this</b> room → <b>these</b> room<b>s</b><br>• uzoq: <b>that</b> house → <b>those</b> house<b>s</b><br><br><b>Uyda nima bor?</b> 7-darsdagi there is / there are:<br>• <b>Is there</b> a lift? — Yes, there is. / No, there isn’t.<br>• <b>Are there</b> any chairs? — Yes, there are. / No, there aren’t.<br><br><b>Nechta?</b> → <b>How many</b> + ko‘plikdagi ot: How many room<b>s</b> are there? O‘zbekchada «nechta xona» (ot birlikda), inglizchada esa doim ko‘plik!",

tip:"<b>Qavatlar:</b> Britaniyada pastki qavat <b>ground floor</b>, shuning uchun <b>first floor</b> bizdagi 2-qavat. AQShda esa first floor = 1-qavat. <br><b>Ijara e’lonlarida:</b> <b>bills included</b> = kommunal to‘lovlar narxga kiritilgan; <b>furnished</b> = mebelli; <b>deposit</b> = garov puli (ko‘chib ketganda qaytariladi). Britaniyada ijara ko‘pincha <b>pcm</b> (oyiga) yoki <b>pw</b> (haftasiga) deb yoziladi.",

b|Two. This is the living room, and that’s the bedroom.|Ikkita. Bu mehmonxona, anavi esa yotoqxona.
a|Look at these windows! Is there a balcony?|Derazalarini qarang! Balkon ham bormi?
b|Yes, there is. And the kitchen is new.|Ha, bor. Oshxona ham yangi.
a|Great! And how much is the rent?|Zo‘r! Ijara haqi qancha?
b|Five hundred pounds. Bills included.|Besh yuz funt. Kommunal to‘lovlar bilan.
a|Really? That’s very cheap for London!|Rostdanmi? London uchun juda arzon-ku!
b|Well... there’s one more thing. Meet Charlie.|E-e... yana bir gap bor. Charli bilan tanishing.

b|My parrot. He lives in the living room.|To‘tiqushim. U mehmonxonada yashaydi.
a|A parrot?! Hmm... Does he pay the bills?|To‘tiqush?! Hmm... Kommunal to‘lovni u to‘laydimi?`},

grammar:{title:"Avtobus-DA → BY bus; ket-YAPMAN → I AM go-ING",
intro:"O‘zbek tilida transportni <b>-da</b> bilan aytamiz: avtobus<b>da</b>, poyezd<b>da</b>. Ingliz tilida <b>by</b> + transport, artiklsiz: <b>by</b> bus, <b>by</b> train, <b>by</b> car. Piyoda esa <b>on foot</b>.<br><br><b>Present Continuous</b> — hozir, ayni damda bo‘layotgan ish. O‘zbekchadagi <b>-yap</b> ga juda o‘xshaydi: ket<b>yap</b>man → I <b>am go</b>ing. Yasalishi: <b>am / is / are</b> + fe’l + <b>-ing</b>:<br>• I <b>am</b> (I’m) wait<b>ing</b><br>• he / she / it <b>is</b> (she’s) com<b>ing</b><br>• we / you / they <b>are</b> (we’re) go<b>ing</b><br><br>Savol: <b>Are you</b> coming? Inkor: I’m <b>not</b> driving.<br><br>Diqqat: har kungi odat uchun oddiy hozirgi zamon: I <b>go</b> to work by bus (har kuni). Ayni paytda: I<b>’m going</b> to work now.",
table:[["Ishga avtobus<mark>da</mark> boraman.","I go to work <mark>by</mark> bus."],["Ishga <mark>piyoda</mark> boraman.","I go to work <mark>on foot</mark>."],["Hozir avtobus kut<mark>yapman</mark>.","I<mark>’m</mark> wait<mark>ing</mark> for the bus now."],["U taksida kel<mark>yapti</mark>.","She<mark>’s</mark> com<mark>ing</mark> by taxi."],["Biz Londonga ket<mark>yapmiz</mark>.","We<mark>’re</mark> go<mark>ing</mark> to London."],["Kel<mark>yapsiz</mark>mi?","<mark>Are</mark> you com<mark>ing</mark>?"],["Men mashina hayda<mark>mayapman</mark>.","I<mark>’m not</mark> driv<mark>ing</mark>."]],
tip:"<b>-ing yozilishi:</b> oxiridagi -e tushadi: take → tak<b>ing</b>, drive → driv<b>ing</b>; qisqa so‘zda oxirgi undosh ikkilanadi: get → ge<b>tt</b>ing, sit → si<b>tt</b>ing. <br><b>Telefonda eng ko‘p kerak bo‘ladigan gaplar:</b> I’m on my way! (Yo‘ldaman!), I’m in a traffic jam. (Tirbandlikdaman.), I’m waiting at the bus stop. <br><b>Britaniyada:</b> London metrosi <b>the Tube</b> deyiladi, chiptani bank kartasi bilan turniketda to‘lash mumkin. Poyezd chiptasi oldindan olinsa ancha arzon.",
mistakes:[["I go by foot.","I go on foot.","Piyoda — doim on foot."],["I go by the bus.","I go by bus.","by dan keyin artikl yo‘q."],["I waiting for the bus.","I’m waiting for the bus.","am / is / are tushib qolmaydi."]]},
dialog:{scene:"Shanba kechqurun. Malika kinoteatr oldida kutyapti, film boshlanishiga o‘n daqiqa qoldi. Rustamga qo‘ng‘iroq qiladi.", a:"Rustam", b:"Malika", lines:`b|Rustam! Where are you? The film starts in ten minutes!|Rustam! Qayerdasan? Kino o‘n daqiqadan keyin boshlanadi!

a|Er... the underground is closed today.|E-e... metro bugun yopiq.
b|OK. And where are you now?|Xo‘p. Hozir qayerdasan?
a|We’re going over the bridge right now.|Hozir ko‘prikdan o‘tyapmiz.

a|Er... GOAL! I mean... I’m leaving the house now!|E-e... GO-O-OL! Yo‘g‘-e... hozir uydan chiqyapman!`},

grammar:{title:"Boshim og‘riyapti → I have a headache / My head hurts; maslahat: You SHOULD rest",
intro:"O‘zbek tilida «bosh<b>im</b> og‘riyapti» deymiz: egalik qo‘shimchasi otning oxirida. Ingliz tilida egalik so‘zi <b>oldinda</b>: <b>My</b> head hurts. Ikkinchi, juda ko‘p ishlatiladigan usul: <b>I have a</b> head<b>ache</b> (so‘zma-so‘z: menda bosh og‘rig‘i bor).<br>• <b>-ache</b> faqat bir nechta so‘z bilan: head<b>ache</b>, tooth<b>ache</b>, stomach<b>ache</b>, back<b>ache</b><br>• tomoq: I have <b>a sore throat</b><br>• boshqalari: My leg <b>hurts</b>. My eyes <b>hurt</b> (ko‘plik → -s yo‘q).<br><br><b>Maslahat: should / shouldn’t</b> — o‘zbekchadagi «...ishingiz kerak», «...sangiz yaxshi bo‘ladi». should dan keyin fe’l <b>to siz</b> keladi va hech o‘zgarmaydi:<br>• You <b>should rest</b>. He <b>should see</b> a doctor.<br>• Inkor: You <b>shouldn’t</b> (should not) go to work.<br>• Savol: <b>Should I</b> take this medicine?",
table:[["Bosh<mark>im</mark> og‘riyapti.","<mark>I have a</mark> head<mark>ache</mark>. / <mark>My</mark> head <mark>hurts</mark>."],["Tish<mark>im</mark> og‘riyapti.","<mark>I have a</mark> tooth<mark>ache</mark>."],["Oyoq<mark>larim</mark> og‘riyapti.","<mark>My</mark> legs <mark>hurt</mark>."],["Isitma<mark>m bor</mark>.","<mark>I have a</mark> temperature."],["Dam olish<mark>ingiz kerak</mark>.","You <mark>should</mark> rest."],["Ishga bor<mark>masligingiz kerak</mark>.","You <mark>shouldn’t</mark> go to work."],["Bu dorini ich<mark>aymi</mark>?","<mark>Should I</mark> take this medicine?"]],
tip:"<b>Dori «ichilmaydi», «olinadi»:</b> inglizchada <b>take</b> medicine deyiladi (drink medicine emas). <br><b>Britaniyada:</b> oddiy oilaviy shifokor <b>GP</b> (ji:-pi:) deyiladi; avval GP ga ro‘yxatdan o‘tasiz, keyin qabulga yozilasiz: I’d like to make an appointment. Favqulodda holatda: <b>999</b> (Britaniya), <b>911</b> (AQSh), Yevropada <b>112</b>. Shoshilinch bo‘lmasa, Britaniyada <b>111</b> ga qo‘ng‘iroq qilib maslahat olish mumkin.",

dialog:{scene:"Shifokor qabulida. Nodira yangi ishda ikki oydan beri ishlaydi va hamma joyi og‘riydi.", a:"Dr Smith", b:"Nodira", lines:`a|Good morning. What’s the matter?|Xayrli tong. Nima bezovta qilyapti?

a|Hmm. How many hours do you sleep?|Hmm. Necha soat uxlaysiz?

intro:"O‘zbek tilida o‘tgan zamon <b>-di</b> bilan yasaladi: ishla<b>di</b>m. Ingliz tilida oddiy fe’llarga <b>-ed</b> qo‘shiladi: work → work<b>ed</b>, watch → watch<b>ed</b>. Shakl hamma shaxsda <b>bir xil</b>: I worked, she worked, they worked (o‘zbekchadagi -m, -ng, -k kabi o‘zgarmaydi!).<br><br><b>«edi»</b> → <b>was / were</b>:<br>• I / he / she / it <b>was</b><br>• you / we / they <b>were</b><br><br><b>Noto‘g‘ri fe’llar</b> -ed olmaydi, ularni yodlash kerak: go → <b>went</b>, have → <b>had</b>, see → <b>saw</b>, eat → <b>ate</b>, buy → <b>bought</b>, come → <b>came</b>.<br><br><b>Savol va inkor</b> — <b>did</b> yordamida, asosiy fe’l esa oddiy shakliga qaytadi:<br>• <b>Did</b> you <b>go</b> to work? (Did you went emas!)<br>• I <b>didn’t go</b> to work.",

grammar:{title:"Present Perfect: I have worked... / Have you ever...?",
intro:"O‘zbek tilida «Men omborda ishla<b>ganman</b>» deymiz: -gan qo‘shimchasi tajribani bildiradi. Ingliz tilida buning uchun <b>Present Perfect</b> bor: <b>have / has + fe’lning 3-shakli</b>: I <b>have worked</b>, she <b>has worked</b>. Oddiy fe’llarda 3-shakl -ed bilan (worked, cooked), noto‘g‘rilarida yodlanadi: be → <b>been</b>, do → <b>done</b>, see → <b>seen</b>, have → <b>had</b>.<br><br><b>Asosiy qiyinchilik:</b> o‘zbekcha «Uch yil<b>dan beri</b> shu yerda ishla<b>yman</b>» deymiz, ya’ni hozirgi zamon. Inglizcha esa hozirgi zamon emas, <b>Present Perfect</b> kerak: I <b>have worked</b> here <b>for</b> three years.<br>• <b>for</b> + davomiylik: for two years, for six months<br>• <b>since</b> + boshlanish nuqtasi: since 2020, since May, since Monday<br>• <b>ever</b> (hech) savolda, <b>never</b> (hech qachon) javobda.",
table:[["Uch yil<mark>dan beri</mark> shu yerda <mark>ishlayman</mark>","I <mark>have worked</mark> here <mark>for</mark> three years"],["2022-yil<mark>dan beri</mark>","<mark>since</mark> 2022"],["<mark>Hech</mark> mehmonxonada ishla<mark>ganmisiz</mark>?","<mark>Have</mark> you <mark>ever worked</mark> in a hotel?"],["<mark>Hech qachon</mark> tunda ishla<mark>maganman</mark>","I <mark>have never worked</mark> at night"],["U CV sini <mark>yuborgan</mark>","She <mark>has sent</mark> her CV"],["Ular <mark>hali</mark> qo‘ng‘iroq qil<mark>ishmadi</mark>","They <mark>haven’t called yet</mark>"]],
tip:"<b>Past Simple yoki Present Perfect?</b> Aniq vaqt aytilsa (yesterday, last week, in 2019) – faqat Past Simple: I <b>sent</b> my CV yesterday. Vaqt aytilmasa yoki u hozirgacha davom etsa – Present Perfect: I <b>have sent</b> my CV. <br>Suhbatda: «I’ve worked» (I have), «She’s worked» (she has), «I haven’t» – qisqa shakllar tabiiyroq eshitiladi.",
mistakes:[["I work here since 2020.","I have worked here since 2020.","«...dan beri» bo‘lsa, inglizchada Present Perfect."],["I have worked here since three years.","I have worked here for three years.","Davomiylik (uch yil) bilan for."],["I have sent my CV yesterday.","I sent my CV yesterday.","Aniq o‘tgan vaqt bilan Past Simple."]]},

grammar:{title:"have to / must / don’t have to: «kerak», «shart», «mumkin emas»",
intro:"O‘zbek tilida «to‘la<b>shim kerak</b>» deymiz. Ingliz tilida buning ikki asosiy usuli bor:<br>• <b>have to</b> – tashqi majburiyat, qoida, shartnoma talab qiladi: I <b>have to</b> pay the rent. U uchun (he/she/it): she <b>has to</b>.<br>• <b>must</b> – qat’iy «shart», ko‘pincha yozma qoidalar va o‘zingizning ichki qaroringiz: You <b>must</b> sign here. must o‘zgarmaydi: he must (he musts emas), dan keyin <b>to</b> kelmaydi.<br><br><b>Eng muhim tuzoq – inkor:</b><br>• <b>mustn’t</b> = mumkin emas, taqiqlangan (You mustn’t smoke).<br>• <b>don’t have to</b> = shart emas, xohlasangiz qiling (You don’t have to pay for water).<br>O‘zbekchada ham bular boshqa-boshqa: «chekish <b>mumkin emas</b>» va «to‘lash<b>ingiz shart emas</b>».<br><br>O‘tgan zamonda must yo‘q, faqat <b>had to</b>: We <b>had to</b> move out.",
table:[["Ijara haqini <mark>to‘lashim kerak</mark>","I <mark>have to</mark> pay the rent"],["U depozit <mark>to‘lashi kerak</mark>","She <mark>has to</mark> pay a deposit"],["Kalitni qaytarish<mark>ingiz shart</mark>","You <mark>must</mark> return the key"],["Bu yerda chekish <mark>mumkin emas</mark>","You <mark>mustn’t</mark> smoke here"],["Suv uchun to‘lash<mark>ingiz shart emas</mark>","You <mark>don’t have to</mark> pay for water"],["Depozit to‘lashim <mark>kerakmi</mark>?","<mark>Do</mark> I <mark>have to</mark> pay a deposit?"],["Ko‘chib chiqishga <mark>majbur bo‘ldik</mark>","We <mark>had to</mark> move out"]],
tip:"<b>Savol:</b> must bilan savol rasmiy eshitiladi, kundalik hayotda <b>Do I have to...?</b> deyiladi: Do I have to pay council tax? Does she have to sign?<br><b>Ijara e’lonlarida</b> qisqartmalar ko‘p: <b>pcm</b> = per calendar month (oyiga), <b>bills inc.</b> = to‘lovlar ichida, <b>no DSS</b> = nafaqa oluvchilarga emas. Shartnomani imzolashdan oldin depozit qaysi davlat himoya sxemasida (deposit protection) saqlanishini so‘rang.",

grammar:{title:"much / many / a lot of / a few / a little: «ko‘p» va «oz»",
intro:"O‘zbek tilida «ko‘p» bitta so‘z: ko‘p tanga, ko‘p pul. Ingliz tilida esa otlar ikki turga bo‘linadi:<br>• <b>sanaladigan</b> (countable): a coin – coins, a card – cards, a question – questions. Ular bilan <b>many</b> va <b>a few</b>.<br>• <b>sanalmaydigan</b> (uncountable): money, cash, time, interest, debt, water. Ular bilan <b>much</b> va <b>a little</b>. Diqqat: <b>money sanalmaydi!</b> «moneys» yo‘q, «a money» yo‘q.<br><br><b>a lot of</b> ikkalasiga ham mos va tasdiq gapda eng tabiiysi: a lot of coins, a lot of money. <b>much</b> va <b>many</b> asosan savol va inkorda: How much...? I haven’t got much cash.<br><br>Savol: <b>How many</b> cards? (nechta?) / <b>How much</b> money? (qancha?) – o‘zbekchadagi «nechta» va «qancha» farqiga juda o‘xshaydi.",
table:[["Menda <mark>ko‘p</mark> tanga yo‘q","I haven’t got <mark>many</mark> coins"],["Menda <mark>ko‘p</mark> naqd pul yo‘q","I haven’t got <mark>much</mark> cash"],["U <mark>ko‘p</mark> pul sarfladi","She spent <mark>a lot of</mark> money"],["<mark>Bir nechta</mark> savolim bor","I have <mark>a few</mark> questions"],["<mark>Ozgina</mark> vaqtim bor","I have <mark>a little</mark> time"],["<mark>Nechta</mark> karta?","<mark>How many</mark> cards?"],["<mark>Qancha</mark> pul?","<mark>How much</mark> money?"]],
tip:"<b>a few / few, a little / little:</b> a bilan – ijobiy («ozgina bor, yetadi»): I have <b>a little</b> money – kofega yetadi. a siz – salbiy («deyarli yo‘q»): I have <b>little</b> money – qiyin ahvoldaman.<br><b>Uyga pul jo‘natishda</b> ikki narsani solishtiring: <b>fee</b> (komissiya) va <b>exchange rate</b> (kurs). Ba’zan «no fee» deyiladi, lekin kurs yomon bo‘ladi: How much will my mum get in sums?",
mistakes:[["many money","a lot of money / much money","money sanalmaydi: many emas."],["I have a few money.","I have a little money.","Sanalmaydigan so‘z bilan a little."],["How much cards have you got?","How many cards have you got?","cards sanaladi: How many."]]},

b|Quite a lot, actually. One second.|Aslida, ancha ko‘p. Bir soniya.

grammar:{title:"Xushmuomala iltimos: Could you...? Would you...? I’d like to...",
intro:"Ingliz tilida buyruq shakli (Give me..., Call me back.) yoki «I want...» qo‘pol eshitiladi. O‘zbek tilida ham «bering!» emas, «bera <b>olasizmi</b>?», «bersa<b>ngiz</b>» deymiz. Ingliz tilida ham xuddi shunday:<br>• <b>Could you</b> + fe’l? = ...a olasizmi? (eng ko‘p ishlatiladi)<br>• <b>Would you</b> + fe’l? = ...sangiz (yanada muloyim)<br>• <b>Could I</b> + fe’l? = ...sam maylimi? (ruxsat so‘rash)<br>• <b>I’d like to</b> + fe’l = ...moqchi edim. Bu o‘zbekchaga juda o‘xshaydi: «yozilmoqchi <b>edim</b>» ham, «I <b>would</b> like» ham o‘tgan zamonga o‘xshab, muloyimlik beradi. I’d = I would.<br>• <b>Would you mind</b> + <b>-ing</b>? = ...sangiz qarshi emasmisiz?<br><br>Fe’l doim oddiy shaklda: Could you <b>call</b> (to call emas, calling emas). Faqat Would you mind dan keyin <b>-ing</b>.",
table:[["Menga qayta qo‘ng‘iroq qila <mark>olasizmi</mark>?","<mark>Could you</mark> call me back?"],["Bir daqiqa kutib tur<mark>sangiz</mark>","<mark>Would you</mark> wait a minute?"],["Qabulga yozil<mark>moqchi edim</mark>","<mark>I’d like to</mark> make an appointment"],["Ismingizni bil<mark>sam maylimi</mark>?","<mark>Could I</mark> have your name?"],["Takrorla<mark>sangiz, qarshi emasmisiz</mark>?","<mark>Would you mind</mark> repeat<mark>ing</mark> that?"],["Kofe <mark>istaysizmi</mark>?","<mark>Would you like</mark> a coffee?"]],
tip:"<b>Javoblar:</b> «Sure», «Of course», «No problem» – ha; «I’m afraid not», «I’m afraid I can’t» – muloyim yo‘q. <br><b>Would you mind...?</b> savoliga «ha» javobi – <b>No, not at all</b> («qarshi emasman»). Agar «Yes» desangiz, «ha, qarshiman» bo‘lib qoladi!<br>Telefonda o‘zingizni «I am Aziz» emas, <b>This is Aziz</b> deb tanishtiring.",
mistakes:[["Could you to call me back?","Could you call me back?","Could you dan keyin to kelmaydi."],["I like to make an appointment.","I’d like to make an appointment.","I like = yaxshi ko‘raman; I’d like = ...moqchi edim."],["Would you mind to wait?","Would you mind waiting?","Would you mind dan keyin -ing."]]},

grammar:{title:"Past Continuous: I was waiting when...",
intro:"O‘zbek tilida o‘tmishda davom etib turgan ish uchun «kut<b>ayotgan edim</b>» deymiz. Ingliz tilida bu <b>Past Continuous</b>: <b>was / were + fe’l-ing</b>.<br>• I / he / she / it <b>was</b> waiting<br>• you / we / they <b>were</b> waiting<br><br><b>Asosiy ishlatilishi – «uzilgan» harakat:</b> uzun ish (fon) Past Continuous, uni bo‘lgan qisqa voqea esa Past Simple:<br>I <b>was waiting</b> on the platform <b>when</b> the train <b>arrived</b>. = Platformada kutayotgan edim, shunda poyezd keldi.<br><b>While</b> + uzun ish: <b>While</b> I <b>was sleeping</b>, someone took my bag. = Men uxla<b>yotganimda</b> kimdir sumkamni oldi.<br>O‘zbekchadagi <b>-yotganimda</b> = while I was ...ing.",
table:[["Platformada <mark>kutayotgan edim</mark>","I <mark>was waiting</mark> on the platform"],["Biz <mark>uxlayotgan edik</mark>","We <mark>were sleeping</mark>"],["Kitob o‘qiyotgan edim, <mark>shunda</mark> poyezd to‘xtadi","I <mark>was reading</mark> <mark>when</mark> the train <mark>stopped</mark>"],["Men uxla<mark>yotganimda</mark> kimdir sumkamni oldi","<mark>While</mark> I <mark>was sleeping</mark>, someone took my bag"],["Soat sakkizda nima qil<mark>ayotgan edingiz</mark>?","What <mark>were</mark> you <mark>doing</mark> at eight?"],["U qo‘ng‘iroq qil<mark>ayotgani yo‘q edi</mark>","She <mark>wasn’t calling</mark>"]],
tip:"<b>Hikoya qilish sirlari:</b> voqeani Past Continuous bilan boshlang – bu «kadr», fon: It <b>was raining</b>. People <b>were running</b> to the platform. Keyin Past Simple bilan voqealar: <b>Suddenly</b> the lights <b>went</b> off.<br>Ba’zi fe’llar -ing olmaydi: know, want, like, need. «I was knowing» emas, <b>I knew</b>.",
mistakes:[["I was wait on the platform.","I was waiting on the platform.","was dan keyin fe’l -ing bilan."],["They was sleeping.","They were sleeping.","they, we, you bilan were."],["When I waited, the train was arriving.","I was waiting when the train arrived.","Uzun ish – Past Continuous, qisqa voqea – Past Simple."]]},

grammar:{title:"Maslahat: should / shouldn’t va «Qachondan beri?» → How long have you had...?",
intro:"<b>1. should — maslahat.</b> O‘zbekchada «dam olish<b>ingiz kerak</b>», «chek<b>masangiz yaxshi</b>» deymiz. Ingliz tilida buning hammasi bitta so‘z: <b>should</b> + fe’l (to‘g‘ridan-to‘g‘ri, «to»siz). U shaxsga qarab o‘zgarmaydi: I should, he should. Inkori — <b>shouldn’t</b>, savoli — <b>Should I...?</b><br><br><b>2. Qachondan beri?</b> O‘zbekchada hozirgi zamon ishlatamiz: «Boshim uch kundan beri og‘ri<b>yapti</b>». Ingliz tilida esa <b>present perfect</b>: I <b>have had</b> a headache <b>for</b> three days. Shifokorning eng ko‘p beradigan savoli: <b>How long have you had...?</b>",

tip:"<b>for yoki since?</b> <b>for</b> + muddat (for two days, for a month, for a long time); <b>since</b> + boshlanish nuqtasi (since Monday, since 2024, since my new job). <br><b>Retseptni adashtirmang:</b> prescription — dori retsepti, recipe — ovqat retsepti, receipt — do‘kon cheki! <br>Britaniyada avval <b>GP</b> (oilaviy shifokor)ga yoziladi; juda og‘ir holatda esa to‘g‘ri <b>A&E</b>ga boriladi yoki <b>999</b> ga qo‘ng‘iroq qilinadi.",

grammar:{title:"«Raqsga tushishni yoqtiraman» → I enjoy dancing: -ing yoki to?",
intro:"O‘zbek tilida fe’ldan keyin boshqa fe’l kelsa, u <b>-ish</b> yoki <b>-moq</b> shaklini oladi: raqsga tush<b>ish</b>ni yoqtiraman, kel<b>moq</b>chiman. Ingliz tilida ham ikki shakl bor, lekin qaysi biri ishlatilishi <b>birinchi fe’lga</b> bog‘liq:<br>• <b>fe’l + -ing</b>: enjoy, mind, avoid, finish, look forward to → I enjoy danc<b>ing</b>.<br>• <b>fe’l + to + fe’l</b>: want, would like, decide, hope, promise, offer → I want <b>to come</b>.<br><br>Bularni qoida bilan emas, <b>juftlik</b> qilib yodlang: «enjoy dancing», «want to come».",
table:[["Raqsga tush<mark>ishni</mark> yoqtiraman","I enjoy danc<mark>ing</mark>."],["Kel<mark>moqchiman</mark>","I want <mark>to come</mark>."],["Kel<mark>ishni</mark> xohlaysizmi?","Would you like <mark>to come</mark>?"],["Kutib tur<mark>ishga</mark> qarshi emasmisiz?","Do you mind wait<mark>ing</mark>?"],["Kichik to‘y qil<mark>ishga</mark> qaror qildik","We decided <mark>to have</mark> a small wedding."],["Siz bilan ko‘rish<mark>ishni</mark> intiq kutyapman","I’m looking forward <mark>to seeing</mark> you."],["Sovg‘a olib kel<mark>ishni</mark> unutmang","Don’t forget <mark>to bring</mark> a gift."]],
tip:"<b>Tuzoq: look forward to.</b> Bu yerdagi <b>to</b> — fe’l oldidagi «to» emas, oddiy ko‘makchi, shuning uchun keyin <b>-ing</b> keladi: looking forward to <b>seeing</b> you. <br><b>like, love</b> ikkalasi bilan ham ishlaydi: I like danc<b>ing</b> = I like <b>to dance</b>. <br>Taklifga eng chiroyli javob: <b>I’d love to!</b> Rad etish: <b>I’d love to, but I can’t. I’m working.</b>",
mistakes:[["I enjoy to dance.","I enjoy dancing.","enjoy dan keyin doim -ing."],["I want coming.","I want to come.","want dan keyin to + fe’l."],["I look forward to see you.","I look forward to seeing you.","Bu yerda «to» — ko‘makchi, shuning uchun -ing."]]},
dialog:{scene:"Birmingemdagi ofis, tushlik vaqti. Malika ingliz hamkasbi Jeymsni akasining to‘yiga taklif qilmoqchi. Jeyms hali o‘zbek to‘yini ko‘rmagan.", a:"Malika", b:"James", lines:`a|James! Are you free on Saturday?|Jeyms! Shanba kuni bo‘shmisan?
b|Saturday? I think so. Why?|Shanba? Shekilli. Nimaydi?
a|My brother’s getting married. I’d like to invite you!|Akam uylanyapti. Seni taklif qilmoqchiman!
b|Wow, an Uzbek wedding! I’d love to come.|Voy, o‘zbek to‘yi! Bajonidil boraman.
a|Great! It’s a small wedding. Just four hundred guests.|Zo‘r! Kichkina to‘y. Atigi to‘rt yuzta mehmon.
b|Four hundred?! That’s small?|To‘rt yuzta?! Shu kichkinami?
a|For us, yes. Oh, and don’t forget to dress up.|Biz uchun, ha. Aytgancha, yasanib kelishni unutma.
b|No problem. But... I don’t enjoy dancing.|Muammo yo‘q. Lekin... men raqsga tushishni yoqtirmayman.
a|That’s fine. You don’t have to dance.|Mayli. Raqsga tushishing shart emas.
b|Really? Phew!|Rostdanmi? Uh, yengil tortdim!
a|But my grandma will make you. She always does.|Lekin buvim baribir tushiradi. Doim shunaqa.
b|Then I’d better start practising tonight!|Unda bugun kechdan mashq qilishni boshlaganim ma’qul!`},

grammar:{title:"Qanday? Qanchalik? → quickly, well, too, enough, How often",
intro:"<b>1. Ravish.</b> O‘zbek tilida bitta so‘z ham sifat, ham ravish bo‘ladi: <b>tez</b> mashina — <b>tez</b> yuguradi. Ingliz tilida esa fe’lni tasvirlash uchun sifatga <b>-ly</b> qo‘shiladi: quick → quick<b>ly</b>, careful → careful<b>ly</b>, bad → bad<b>ly</b>. Istisnolar: good → <b>well</b>, fast → fast, hard → hard.<br><br><b>2. too va enough.</b> <b>too</b> + sifat = «haddan ziyod» (salbiy ma’no): too cold. Sifat + <b>enough</b> = «yetarlicha»: old enough. Ot bilan esa <b>enough</b> oldin keladi: enough time.<br><br><b>3. How often?</b> = Qanchalik tez-tez? Javob: once a week, twice a month, three times a week, hardly ever.",
table:[["U <mark>tez</mark> yuguradi","He runs <mark>quickly</mark>."],["U tennisni <mark>yaxshi</mark> o‘ynaydi","She plays tennis <mark>well</mark>."],["Suzishga <mark>haddan ziyod</mark> sovuq","It’s <mark>too</mark> cold to swim."],["U yoshi <mark>yetarlicha</mark> katta","He’s old <mark>enough</mark>."],["Vaqtim <mark>yetarli</mark> emas","I don’t have <mark>enough</mark> time."],["<mark>Qanchalik tez-tez</mark> zalga borasiz?","<mark>How often</mark> do you go to the gym?"],["Haftada <mark>uch marta</mark>","<mark>Three times</mark> a week."]],
tip:"<b>very va too farqi:</b> It’s <b>very</b> cold — juda sovuq (shunchaki ma’lumot). It’s <b>too</b> cold — haddan ziyod sovuq, ya’ni biror ishni qilib bo‘lmaydi: It’s too cold <b>to</b> play football. <br><b>enough joyi:</b> sifatdan keyin (good enough, fast enough), otdan oldin (enough money, enough players). <br>Haftada bir marta — <b>once</b>, ikki marta — <b>twice</b>, uch va undan ko‘p — <b>three times, four times</b>.",
mistakes:[["He plays very good.","He plays very well.","Fe’lni tasvirlaydi — ravish kerak: well."],["I’m enough old.","I’m old enough.","enough sifatdan keyin keladi."],["How many often do you train?","How often do you train?","«Qanchalik tez-tez» — How often."]]},
dialog:{scene:"Londondagi sport zali, birinchi mashg‘ulot. Sherzod yangi sport kiyimida, murabbiy Lisa uni sinab ko‘rmoqchi.", a:"Lisa", b:"Sherzod", lines:`a|Hi! You’re new, right? I’m Lisa, your trainer.|Salom! Yangisiz-a? Men Lisa, murabbiyingizman.
b|Hi. Sherzod. I want to get in good shape.|Salom. Sherzod. Yaxshi formaga kirmoqchiman.
a|Great! How often do you do sport?|Zo‘r! Qanchalik tez-tez sport bilan shug‘ullanasiz?
b|Every day! I run a lot.|Har kuni! Ko‘p yuguraman.
a|Really? How far do you run?|Rostdanmi? Qancha masofaga yugurasiz?
b|From my house to the bus stop. Very quickly.|Uyimdan avtobus bekatigacha. Juda tez.
a|Ha! Okay... Let’s try ten push-ups.|Ha! Xo‘p... Keling, o‘n marta yerga tayanib ko‘tarilamiz.
b|Ten? Isn’t that too many for the first day?|O‘n marta? Birinchi kunga ko‘plik qilmaydimi?
a|Come on! You can do it!|Qani! Uddalaysiz!
b|One... two... Okay. I think that’s enough.|Bir... ikki... Bo‘ldi. Menimcha, shu yetarli.
a|Two?! You said you’re fit!|Ikkita?! Sportchiman degandingiz-ku!
b|I am fit. For the bus.|Sportchiman. Avtobus uchun.`},

intro:"<b>1. be going to — reja.</b> O‘zbekchada «Kelasi yil uylan<b>moqchiman</b>» desak, bu oldindan o‘ylangan reja. Ingliz tilida: I’m <b>going to</b> get married next year. am/is/are tushib qolmaydi!<br><br><b>2. will — taxmin, va’da, shu zahotiyoq qaror.</b> «Menimcha, yomg‘ir yog‘<b>sa kerak</b>» → I think it <b>will</b> rain. «Hozir eshikni ochaman!» → I<b>’ll</b> open it! Inkori: <b>won’t</b>.<br><br><b>3. Shart gap (First Conditional).</b> O‘zbekchada: «Pul yig‘<b>sam</b>, mashina ol<b>aman</b>». Ingliz tilida: <b>If</b> + hozirgi zamon, <b>will</b> + fe’l. Diqqat: if qismida <b>will ishlatilmaydi</b> — xuddi o‘zbekchada «yig‘a<b>digan bo‘lsam</b>» demaganimizdek.",
table:[["Mashina ol<mark>moqchiman</mark> (reja)","I’m <mark>going to</mark> buy a car."],["Ertaga yomg‘ir yog‘<mark>sa kerak</mark>","I think it <mark>will</mark> rain tomorrow."],["Shoshmang, men <mark>ochaman</mark>!","Wait, I<mark>’ll</mark> open the door!"],["Pul yig‘<mark>sam</mark>, mashina ol<mark>aman</mark>","<mark>If</mark> I save money, I<mark>’ll</mark> buy a car."],["Astoydil ishla<mark>sang</mark>, muvaffaqiyatga erish<mark>asan</mark>","<mark>If</mark> you work hard, you<mark>’ll</mark> succeed."],["Yomg‘ir yog‘<mark>sa</mark>, uyda qol<mark>amiz</mark>","We<mark>’ll</mark> stay at home <mark>if</mark> it rains."]],
tip:"<b>going to yoki will?</b> Agar qaror <b>oldin</b> qabul qilingan bo‘lsa (kursga pul to‘ladingiz, chipta oldingiz) — <b>going to</b>. Agar hozir, gapirayotib qaror qilsangiz yoki taxmin qilsangiz — <b>will</b>. Ko‘rinib turgan narsa uchun ham <b>going to</b>: Look at those clouds! It’s <b>going to</b> rain. <br>Taxminni yumshatish uchun: I’ll <b>probably</b>..., <b>Perhaps</b> I’ll..., I <b>think</b> I’ll...",
mistakes:[["If I will save money, I will buy a car.","If I save money, I will buy a car.","if qismida will ishlatilmaydi."],["I going to study.","I’m going to study.","am / is / are tushib qolmaydi."],["I will to call you.","I will call you.","will dan keyin «to» qo‘yilmaydi."]]},

grammar:{title:"«Rus tilini biladigan ayol» → the woman who speaks Russian; because, so, although",
intro:"<b>1. who / which / that.</b> O‘zbek tilida odam yoki narsani tasvirlovchi qism <b>oldin</b> keladi va <b>-gan, -digan</b> qo‘shimchasini oladi: «qo‘shnimizda yasha<b>ydigan</b> odam». Ingliz tilida aksincha: avval ot, keyin <b>who / which / that</b> va tasvir: the man <b>who</b> lives next door.<br>• <b>who</b> — odamlar uchun<br>• <b>which</b> — narsalar uchun<br>• <b>that</b> — ikkalasi uchun ham (og‘zaki nutqda eng ko‘p)<br><br><b>2. Bog‘lovchilar.</b> <b>because</b> = chunki (sabab), <b>so</b> = shuning uchun (natija), <b>although</b> = garchi... -sa ham (qarama-qarshilik).",

tip:"<b>Muloyim e’tiroz.</b> Britaniyada to‘g‘ridan-to‘g‘ri «You’re wrong!» deyish qo‘pol eshitiladi. Yumshoqroq aytilsa yaxshi: <b>I see what you mean, but...</b>, <b>I’m not sure about that.</b>, <b>That’s a good point, however...</b> <br><b>agree — fe’l!</b> «Men roziman» = <b>I agree</b> (am qo‘shilmaydi). Kim bilan: agree <b>with</b> you.",

<script>
/* Ovoz: avval odamlarning jonli yozuvlari, topilmasa sintez ovoz.
   1) So‘zlar: Wikimedia Commons (Vikilug‘at yozuvlari "Ru-so‘z.ogg") va Lingua Libre ("LL-Q7737 (rus)-...").
   2) Gaplar: Tatoeba (faqat ochiq litsenziyali yozuvlar).
   3) Hech narsa topilmasa: brauzerning eng tabiiy rus ovozi. */
window.TIL = window.TIL || {};
TIL.audio = (function(){
  const COMMONS = "https://commons.wikimedia.org/w/api.php";
  const CACHE_KEY = "til.audio.v1";
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}"); } catch(e) {}
  const saveCache = () => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch(e) {} };
  let offline = { commons:false, tatoeba:false };
  let cur = null;          // hozir o‘ynayotgan Audio
  let curDone = null;      // uning va’dasini yakunlash
  let gen = 0;             // har stop() yangi avlod: eski so‘rovlar ovoz chiqarmaydi
  let settings = { live:true, slow:false };

  const plain = s => String(s).replace(/́/g,"").replace(/'/g,"").trim();
  /* tillar: Commons fayl nomi, Lingua Libre belgisi, Tatoeba kodi */
  const LANGS = {
    ru:{ commons:"Ru-", ll:"LL-Q7737 (rus)", tat:"rus" },
    de:{ commons:"De-", ll:"LL-Q188 (deu)", tat:"deu", article:/^(der|die|das)\s+/i },
    en:{ commons:"En-us-", ll:"LL-Q1860 (eng)", tat:"eng", article:/^(the|a|an|to)\s+/i }
  };
  const keyOf = (lang,s) => lang + ":" + plain(s).toLowerCase();

  function withTimeout(p, ms){
    return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")), ms))]);
  }
  async function getJSON(url, ms){
    const r = await withTimeout(fetch(url, {mode:"cors"}), ms || 4000);
    if (!r.ok) throw new Error("http " + r.status);
    return r.json();
  }

  const canOgg = (()=>{ try { return !!document.createElement("audio").canPlayType('audio/ogg; codecs="vorbis"'); } catch(e){ return false; } })();

  function pickFromInfo(info){
    if (!info) return null;
    const ders = info.derivatives || [];
    const mp3 = ders.find(d => /audio\/mpeg/.test(d.type||""));
    if (mp3) return mp3.src;
    if (/\.(ogg|oga)$/i.test(info.url||"") && !canOgg) return (ders.find(d=>/audio/.test(d.type||""))||{}).src || null;
    return info.url || null;
  }

  /* Bir nechta so‘zni bitta so‘rov bilan tekshirish (dars ochilganda) */
  async function prefetchWords(lang, words){
    const LG = LANGS[lang];
    if (!settings.live || offline.commons || !LG) return;
    const todo = [];
    words.forEach(w => {
      let p = plain(w); if (LG.article) p = p.replace(LG.article, "");
      if (!p || /[\s?!.,]/.test(p)) return;
      if (cache[keyOf(lang,p)] !== undefined) return;
      if (!todo.includes(p)) todo.push(p);
    });
    for (let i=0; i<todo.length; i+=40){
      const chunk = todo.slice(i, i+40);
      const titles = chunk.map(w => "File:" + LG.commons + w + ".ogg").join("|");
      const url = COMMONS + "?action=query&format=json&origin=*&prop=videoinfo&viprop=url|derivatives&titles=" + encodeURIComponent(titles);
      try {
        const j = await getJSON(url, 6000);
        const norm = {};
        ((j.query||{}).normalized||[]).forEach(n => norm[n.to] = n.from);
        const pages = (j.query||{}).pages || {};
        const found = {};
        Object.values(pages).forEach(pg => {
          if (pg.missing !== undefined || !pg.videoinfo) return;
          const src = pickFromInfo(pg.videoinfo[0]);
          if (!src) return;
          const t = (norm[pg.title] || pg.title).slice(("File:" + LG.commons).length).replace(/\.ogg$/,"").replace(/_/g," ").toLowerCase();
          found[t] = { src, by:"Wikimedia Commons", lic:"ochiq litsenziya", link:"https://commons.wikimedia.org/wiki/" + encodeURIComponent(pg.title.replace(/ /g,"_")) };
        });
        chunk.forEach(w => { const lw = w.toLowerCase(); cache[keyOf(lang,w)] = found[lw] || (cache[keyOf(lang,w)] === undefined ? null : cache[keyOf(lang,w)]); });
        saveCache();
      } catch(e){ offline.commons = true; return; }
    }
  }

  async function lookupLinguaLibre(w, lang){
    const LG = LANGS[lang];
    const q = 'intitle:"' + LG.ll + '" intitle:"' + w + '"';
    const url = COMMONS + "?action=query&format=json&origin=*&list=search&srnamespace=6&srlimit=20&srsearch=" + encodeURIComponent(q);
    const j = await getJSON(url, 5000);
    const hits = ((j.query||{}).search||[]).map(h=>h.title).filter(t => t.toLowerCase().endsWith("-" + w.toLowerCase() + ".wav"));
    if (!hits.length) return null;
    const title = hits[0];
    const j2 = await getJSON(COMMONS + "?action=query&format=json&origin=*&prop=imageinfo&iiprop=url&titles=" + encodeURIComponent(title), 5000);
    const pg = Object.values((j2.query||{}).pages||{})[0];
    const u = pg && pg.imageinfo && pg.imageinfo[0] && pg.imageinfo[0].url;
    if (!u) return null;
    const m = title.match(/\([a-z]{3}\)-(.+?)-/);
    return { src:u, by:"Lingua Libre" + (m ? " · " + m[1] : ""), lic:"CC BY-SA 4.0", link:"https://commons.wikimedia.org/wiki/" + encodeURIComponent(title.replace(/ /g,"_")) };
  }

  async function lookupTatoeba(text, lang){
    const q = plain(text);
    const url = "https://tatoeba.org/en/api_v0/search?from=" + LANGS[lang].tat + "&orphans=no&unapproved=no&has_audio=yes&query=" + encodeURIComponent('"' + q + '"');
    const j = await getJSON(url, 5000);
    const norm = s => plain(s).toLowerCase().replace(/[«»"“”.,!?—–-]/g,"").replace(/\s+/g," ").trim();
    const want = norm(q);
    for (const r of (j.results||[])){
      if (norm(r.text) !== want) continue;
      const au = (r.audios||[]).find(a => a.license && /^CC/i.test(a.license));
      if (au) return { src:"https://tatoeba.org/audio/download/" + au.id, by:"Tatoeba · " + (au.author||""), lic:au.license, link:"https://tatoeba.org/ru/sentences/show/" + r.id };
    }
    return null;
  }

  async function resolve(lang, text){
    const LG = LANGS[lang];
    if (!settings.live || !LG) return null;
    let p = plain(text).replace(/[«»"“”„]/g,"");
    if (LG.article && p.split(/\s+/).length === 2 && LG.article.test(p)) p = p.replace(LG.article, "");
    const k = keyOf(lang, p);
    if (cache[k]) return cache[k];
    const isWord = !/\s/.test(p) && p.length < 30;
    if (isWord){
      const w = p.replace(/[?!.,]/g,"");
      if (cache[k] === undefined) { await prefetchWords(lang, [w]); if (cache[k]) return cache[k]; }
      if (!offline.commons && cache[k + "#ll"] === undefined){
        try { const res = await lookupLinguaLibre(w, lang); cache[k + "#ll"] = res ? 1 : 0; if (res) cache[k] = res; saveCache(); }
        catch(e){ offline.commons = true; }
      }
    } else if (!offline.tatoeba && cache[k + "#tt"] === undefined){
      try { const res = await lookupTatoeba(p, lang); cache[k + "#tt"] = res ? 1 : 0; if (res) cache[k] = res; saveCache(); }
      catch(e){ offline.tatoeba = true; }
    }
    return cache[k] || null;
  }

  /* --- sintez ovoz --- */
  let voices = [];
  function loadVoices(){ try { voices = speechSynthesis.getVoices(); } catch(e){ voices = []; } }
  if ("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  const FEM = /svetlana|dariya|milena|katya|irina|ekaterina|anna|elena|alena|female|katja|marlene|vicki|hedda|petra|seraphina|louisa|amala|elke|tanja|klarissa|maja|ingrid|gisela|helena|zira|google/i;
  const MAS = /dmitry|yuri|pavel|maxim|conrad|killian|stefan|markus|hans|florian|ralf|bernd|christoph|kasper|klaus|male\b/i;
  function bestVoice(langTag, gender){
    const alt = /2$/.test(gender || ""); gender = (gender || "").replace("2", "");
    const base = langTag.slice(0,2);
    const list = voices.filter(v => (v.lang||"").toLowerCase().startsWith(base));
    const g = v => gender === "m" ? (MAS.test(v.name) ? 60 : FEM.test(v.name) ? -60 : 0) : gender === "f" ? (FEM.test(v.name) && !MAS.test(v.name) ? 60 : MAS.test(v.name) ? -60 : 0) : 0;
    const score = v => g(v) + (/natural|neural|online/i.test(v.name) ? 40 : 0) + (/google/i.test(v.name) ? 20 : 0) + (/milena|yuri|katya|svetlana|dmitry|dariya/i.test(v.name) ? 15 : 0) + (v.localService ? 0 : 5);
    list.sort((a,b)=>score(b)-score(a));
    /* ikkinchi qahramon: xuddi shu jinsdagi boshqa ovoz bo‘lsa, o‘shani olamiz */
    if (alt && list[1] && g(list[1]) >= g(list[0])) return list[1];
    return list[0] || null;
  }
  function tts(text, langTag, gender){
    return new Promise(res => {
      if (!("speechSynthesis" in window)) return res(false);
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(plain(text));
        u.lang = langTag; const v = bestVoice(langTag, gender); if (v) u.voice = v;
        const alt = /2$/.test(gender || ""); gender = (gender || "").replace("2", "");
        u.rate = settings.slow ? 0.7 : (gender ? 1 : 0.9);
        /* mos jinsdagi ovoz topilmasa, ohang bilan farqlaymiz */
        if (gender && v){ const okM = MAS.test(v.name), okF = FEM.test(v.name) && !okM; if (gender === "m" && !okM) u.pitch = 0.7; if (gender === "f" && !okF) u.pitch = 1.2; }
        else if (gender) u.pitch = gender === "m" ? 0.7 : 1.2;
        if (alt && v && bestVoice(langTag, gender) === v) u.pitch = (u.pitch || 1) * (gender === "m" ? 1.25 : 0.85);
        u.onend = () => res(true); u.onerror = () => res(false);
        speechSynthesis.speak(u);
      } catch(e){ res(false); }
    });
  }

  function stop(){
    gen++;
    try { if (cur){ cur.pause(); cur.removeAttribute("src"); cur = null; } } catch(e){}
    if (curDone){ const d = curDone; curDone = null; d(); }
    try { speechSynthesis.cancel(); } catch(e){}
  }

  function playSrc(src){
    return new Promise((res, rej) => {
      const a = new Audio(src); cur = a;
      curDone = () => res(false);
      a.playbackRate = settings.slow ? 0.8 : 1;
      a.onended = () => { curDone = null; res(true); };
      a.onerror = () => { curDone = null; rej(new Error("audio")); };
      const p = a.play(); if (p && p.catch) p.catch(rej);
    });
  }

  /* say(): matnni o‘qiydi; onSource(info) qaysi manbadan ekanini aytadi */
  async function say(text, opts){
    opts = opts || {};
    const lang = opts.lang || "ru", tag = opts.tag || "ru-RU";
    stop();
    const my = gen;
    let info = null;
    if (!opts.gender) try { info = await withTimeout(resolve(lang, text), 7000); } catch(e){ info = null; }
    if (my !== gen) return null;          // kutilayotganda to‘xtatildi
    if (info && info.src){
      try { opts.onSource && opts.onSource(info); await playSrc(info.src); return info; }
      catch(e){ if (my !== gen) return null; /* sintezga o‘tamiz */ }
    }
    const s = { by:"Sintez ovoz (jonli yozuv topilmadi)", synth:true };
    opts.onSource && opts.onSource(s);
    await tts(text, tag, opts.gender);
    return s;
  }

  const busy = () => !!cur || (("speechSynthesis" in window) && speechSynthesis.speaking);
  return { say, stop, busy, prefetchWords, plain, setSettings: s => Object.assign(settings, s), status: () => ({...offline}) };
})();
